<title>Eventlas — Aachen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314161A'/%3E%3Ccircle cx='32' cy='27' r='13' fill='%23FFC61A'/%3E%3Cpath d='M32 58 22 38h20z' fill='%23FFC61A'/%3E%3Ccircle cx='32' cy='27' r='5' fill='%2314161A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Schriften liegen im Projekt statt bei Google. Die dynamische Einbindung von Google Fonts
     überträgt bei jedem Aufruf die IP-Adresse in die USA — das LG München hat das 2022 als
     Datenschutzverstoß gewertet (3 O 17493/20). Lokal gehostet entfällt der Drittkontakt
     vollständig, und die Karte lädt schneller. Inter ist eine Variable Font: eine Datei
     deckt alle Schnitte ab. */
  @font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;
    src:url('schriften/anton.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('schriften/inter.woff2') format('woff2')}

  :root{
    --nacht:#14161A; --panel:#1D2026; --linie:#2C3038;
    --papier:#F5F2E9; --grau:#9AA0AB;
    --hilfe:#FFC61A; --event:#2FD6C3; --angebot:#FF6A3D; --spot:#C77DFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* 100dvh statt 100% — sonst schneidet die einfahrende Adressleiste von Safari/Chrome
     auf dem Handy den unteren Rand ab und der Melden-Knopf liegt außerhalb. */
  html,body{height:100%;height:100dvh}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--nacht);color:var(--papier);
    overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  #map{position:absolute;inset:0}
  /* iOS zoomt beim Fokus auf Felder unter 16px — das verstellt die ganze Ansicht */
  input,select,textarea{font-size:16px}
  button{font-family:inherit}

  /* ---------- Kopfzeile ---------- */
  header{position:absolute;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:flex-start;gap:10px;padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));
    background:linear-gradient(to bottom, rgba(20,22,26,.92), rgba(20,22,26,0));pointer-events:none}
  header .titel{pointer-events:auto;min-width:0}
  h1{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
  h1 span{color:var(--hilfe)}
  .sub{font-size:11px;color:var(--grau);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kopf-knoepfe{margin-left:auto;display:flex;gap:6px;pointer-events:auto;flex:none}
  .kbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--linie);
    background:rgba(29,32,38,.88);color:var(--papier);cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center}
  .kbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* Schmale Handys: fünf Knöpfe + Titel gehen sich sonst nicht aus.
     Die Knöpfe bleiben trotzdem gut treffbar — die sichtbare Fläche ist kleiner,
     die Tippfläche über ::before aber weiterhin 44 px (Empfehlung Apple/Google). */
  @media (max-width:430px){
    h1{font-size:17px}
    .sub{font-size:10px}
    .kopf-knoepfe{gap:6px}
    .kbtn{width:36px;height:36px;border-radius:10px;position:relative}
    .kbtn::before{content:"";position:absolute;top:50%;left:50%;
      transform:translate(-50%,-50%);width:44px;height:44px}
    .kbtn svg{width:18px;height:18px}
  }
  @media (max-width:360px){ .sub{display:none} }
  .kbtn.an{background:var(--papier);color:#141414;border-color:var(--papier)}
  .kbtn.foto{background:var(--hilfe);border-color:var(--hilfe);color:#141414}
  .kbtn.foto:active{transform:scale(.94)}
  .kbtn.laedt{opacity:.6;pointer-events:none}
  .foto-vorschau{width:100%;max-height:180px;object-fit:contain;border-radius:12px;
    border:1px solid var(--linie);background:var(--nacht);margin:10px 0 4px}
  .ort-status{display:flex;align-items:center;gap:8px;font-size:12px;padding:9px 11px;
    border-radius:10px;background:var(--nacht);border:1px solid var(--linie);margin:8px 0}
  .ort-status.ok{border-color:var(--event);color:var(--event)}
  .ort-status.warn{border-color:var(--hilfe);color:var(--hilfe)}
  .kbtn:focus-visible,.chip:focus-visible,.zchip:focus-visible,.tagchip:focus-visible,.melden:focus-visible{outline:2px solid var(--papier);outline-offset:2px}

  /* Suchleiste */
  .suche{position:absolute;left:12px;right:12px;z-index:19;display:none;
    top:calc(58px + env(safe-area-inset-top));max-width:560px;margin:0 auto}
  .suche.offen{display:flex;gap:8px}
  .suche input{flex:1;border:1px solid var(--linie);background:rgba(29,32,38,.96);color:var(--papier);
    border-radius:12px;padding:11px 14px;font:600 14px 'Inter';min-width:0}
  .suche input::placeholder{color:var(--grau);font-weight:400}
  .suche .leeren{width:44px;border-radius:12px;border:1px solid var(--linie);
    background:rgba(29,32,38,.96);color:var(--grau);cursor:pointer;font-size:16px}
  .such-info{position:absolute;left:12px;right:12px;z-index:19;display:none;max-width:560px;
    margin:6px auto 0;top:calc(58px + env(safe-area-inset-top));
    background:var(--panel);border:1px solid var(--linie);border-radius:10px;
    padding:8px 12px;font-size:12px;color:var(--grau)}
  .such-info.da{display:block}
  .such-info b{color:var(--papier)}
  .such-info .vorschlag{color:var(--hilfe);cursor:pointer;font-weight:600;white-space:nowrap}

  /* Toast (neue Pins) */
  .toast{position:absolute;left:12px;right:12px;z-index:18;display:none;
    top:calc(58px + env(safe-area-inset-top));max-width:560px;margin:0 auto;
    background:var(--panel);border:1px solid var(--linie);border-radius:12px;
    padding:10px 14px;font-size:13px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  .toast b{color:var(--hilfe)}

  /* ---------- HUD unten ---------- */
  .hud{position:absolute;left:0;right:0;bottom:0;z-index:20;
    padding:8px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(20,22,26,.94) 62%, rgba(20,22,26,0));}
  .hud-innen{max-width:560px;margin:0 auto}

  /* Filter einklappbar: Auf kleinen Handys nehmen drei Filterreihen ein Drittel des
     Bildschirms weg. Eingeklappt bleibt die Karte groß, ein Tipp holt alles zurück. */
  .hud-klapp{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    background:none;border:0;color:var(--grau);font:700 11px 'Inter';letter-spacing:.4px;
    cursor:pointer;padding:5px 0 7px;min-height:32px}
  .hud-klapp .pfeil{transition:transform .2s ease;font-size:10px}
  .hud.zu .hud-klapp .pfeil{transform:rotate(180deg)}
  .hud-filter{max-height:340px;overflow:hidden;
    transition:max-height .26s ease, opacity .2s ease}
  .hud.zu .hud-filter{max-height:0;opacity:0;pointer-events:none}
  .hud.zu .hud-klapp{color:var(--papier)}
  .hud-klapp .marke{background:var(--hilfe);color:#141414;border-radius:99px;
    padding:1px 7px;font-size:10px;display:none}
  .hud.zu .hud-klapp .marke.da{display:inline-block}

  /* Tag-Chips (scrollbar). Der Verlauf rechts zeigt an, dass es weitergeht —
     ohne ihn übersehen Nutzer auf schmalen Screens die hinteren Themen. */
  .tags-wrap{position:relative}
  .tags-wrap::after{content:"";position:absolute;right:0;top:0;bottom:8px;width:26px;
    background:linear-gradient(to right, rgba(20,22,26,0), rgba(20,22,26,.92));
    pointer-events:none;opacity:0;transition:opacity .2s}
  .tags-wrap.mehr::after{opacity:1}
  .tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .tags::-webkit-scrollbar{display:none}
  .tags .tagchip{scroll-snap-align:start}
  .tagchip{flex:none;border:1px solid var(--linie);background:rgba(29,32,38,.85);color:var(--grau);
    border-radius:999px;padding:9px 13px;font:600 12.5px 'Inter';cursor:pointer;white-space:nowrap;
    min-height:38px;display:flex;align-items:center}
  .tagchip.an{color:#141414;background:var(--papier);border-color:var(--papier)}
  .tagchip.fuerdich.an{background:var(--hilfe);border-color:var(--hilfe)}
  .tagchip.reset{color:var(--angebot);border-color:var(--angebot);display:none}
  .tagchip.reset.da{display:block}
  .tagchip.highlight{color:#FFC61A;border-color:#FF8A1F}
  .tagchip.highlight.an{color:#141414;background:linear-gradient(95deg,#FFC61A,#FF8A1F);border-color:#FF8A1F}

  /* Zeit-Chips: halbtransparent, kontraststark (Roadmap Nr. 14) */
  .zfilter{display:flex;gap:8px;margin-bottom:8px}
  .zchip{flex:1;border:1px solid rgba(245,242,233,.28);background:rgba(20,22,26,.62);color:#E8E5DC;
    border-radius:10px;padding:11px 4px;font:600 12.5px 'Inter';cursor:pointer;backdrop-filter:blur(3px);
    min-height:42px}
  .zchip.an{color:#141414;background:var(--papier);border-color:var(--papier)}

  /* Kategorie-Chips mit Icons (Roadmap Nr. 2, 11) */
  .filter{display:flex;gap:6px}
  .chip{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid var(--linie);background:var(--panel);color:var(--papier);
    border-radius:12px;padding:12px 4px;font:600 12px 'Inter';cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;min-width:0;min-height:46px}
  .chip:active{transform:scale(.97)}
  .chip svg{width:15px;height:15px;flex:none}
  .chip .zahl{font-family:'Anton';font-size:14px;letter-spacing:.5px}
  .chip[data-typ="event"] svg{color:var(--event)} .chip[data-typ="angebot"] svg{color:var(--angebot)}
  .chip[data-typ="hilfe"] svg{color:var(--hilfe)} .chip[data-typ="spot"] svg{color:var(--spot)}
  .chip.aus{opacity:.35}
  .chip .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Liste und Melden gleichwertig nebeneinander: Die Liste ist der Haupteinstieg,
     wenn man nicht auf der Karte suchen will — nicht nur ein Icon unter vielen oben. */
  .hud-aktionen{display:flex;gap:8px;margin-top:8px}
  .liste-btn{flex:0 0 auto;display:flex;align-items:center;gap:7px;
    font-family:'Anton';font-size:14px;letter-spacing:.8px;text-transform:uppercase;
    background:var(--panel);color:var(--papier);border:1px solid var(--linie);
    border-radius:12px;padding:13px 15px;cursor:pointer;white-space:nowrap}
  .liste-btn:active{transform:scale(.97)}
  .liste-btn .lb-icon{font-size:15px;line-height:1}
  .liste-btn:focus-visible{outline:2px solid var(--papier);outline-offset:2px}
  .melden{display:block;flex:1;width:auto;
    font-family:'Anton';font-size:15px;letter-spacing:1px;text-transform:uppercase;
    background:var(--hilfe);color:#141414;border:0;border-radius:12px;
    padding:13px;cursor:pointer}
  .hinweis{margin:6px auto 0;font-size:11px;color:var(--grau);text-align:center;display:none}
  .hinweis a{color:var(--hilfe);font-weight:600}

  /* ---------- Map-Blips: Form + Icon statt Buchstaben (farbenblind-tauglich) ----------
     WICHTIG: position:absolute — MapLibre positioniert Marker absolut; ein relative
     würde die Marker in den Layout-Fluss zwingen und sie beim Zoomen/Filtern verschieben. */
  .blip{position:absolute;width:34px;height:34px;border:0;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .blip .form{position:absolute;inset:2px;border:2px solid #14161A;box-shadow:0 2px 8px rgba(0,0,0,.45)}
  .blip svg{position:relative;width:16px;height:16px;color:#141414;
    fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .blip.t-event .form{background:var(--event);border-radius:50%}
  .blip.t-angebot .form{background:var(--angebot);border-radius:9px}
  .blip.t-hilfe .form{background:var(--hilfe);border-radius:8px;transform:rotate(45deg)}
  .blip.t-spot .form{background:var(--spot);border-radius:50%;box-shadow:0 0 0 2px rgba(199,125,255,.45),0 2px 8px rgba(0,0,0,.45)}
  .blip.neu-ort .form{background:var(--papier);border-style:dashed;border-radius:50%}
  .blip.neu-ort{font-family:'Anton';font-size:15px;color:#141414}
  .blip.gedimmt{opacity:.4}
  .blip.passt{z-index:5}
  .blip.passt .form{box-shadow:0 0 0 3px var(--papier),0 2px 10px rgba(0,0,0,.5)}
  .blip .emo{position:relative;font-size:15px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
  /* Highlight-Pins: feuriger Ring + Glut-Puls, damit sie auch ohne die Flamme auffallen */
  .blip.hot{width:40px;height:40px;z-index:6}
  .blip.hot .form{inset:5px;border-color:#FFD24A;
    box-shadow:0 0 0 3px #FF8A1F, 0 0 14px 3px rgba(255,138,31,.85), 0 2px 10px rgba(0,0,0,.5);
    animation:glut 1.9s ease-in-out infinite}
  .blip.hot::after{content:"🔥";position:absolute;top:-5px;right:-5px;font-size:14px;z-index:3;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
  .blip.hot::before{content:"";position:absolute;inset:0;border-radius:50%;
    border:2px solid rgba(255,198,26,.9);animation:feuerring 1.9s ease-out infinite}
  .blip.frisch:not(.hot)::before{content:"";position:absolute;top:-2px;left:-2px;width:10px;height:10px;z-index:2;
    background:#fff;border-radius:50%;border:0;box-shadow:0 0 0 2px var(--nacht);animation:blinzel 1.4s ease-in-out infinite}
  @keyframes glut{
    0%,100%{box-shadow:0 0 0 3px #FF8A1F, 0 0 12px 2px rgba(255,138,31,.7), 0 2px 10px rgba(0,0,0,.5)}
    50%    {box-shadow:0 0 0 3px #FFC61A, 0 0 20px 6px rgba(255,170,40,.95), 0 2px 10px rgba(0,0,0,.5)}}
  @keyframes feuerring{
    0%  {transform:scale(.85);opacity:.9}
    70% {transform:scale(1.45);opacity:0}
    100%{transform:scale(1.45);opacity:0}}
  @keyframes blinzel{0%,100%{opacity:1}50%{opacity:.35}}

  /* Cluster: fasst dicht beieinander liegende Pins zusammen, damit die Karte bei
     weitem Zoom lesbar bleibt. Farbe zeigt die häufigste Kategorie der Gruppe. */
  .cluster{width:40px;height:40px;border-radius:50%;border:2px solid #14161A;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:15px;
    color:#141414;box-shadow:0 2px 10px rgba(0,0,0,.45);position:absolute;
    background:var(--event);transition:transform .12s ease}
  .cluster:active{transform:scale(.94)}
  .cluster.gross{width:48px;height:48px;font-size:17px}
  .cluster.t-angebot{background:var(--angebot)} .cluster.t-hilfe{background:var(--hilfe)}
  .cluster.t-spot{background:var(--spot)} .cluster.t-event{background:var(--event)}
  .cluster.hat-hot{box-shadow:0 0 0 3px #FF8A1F,0 0 14px 3px rgba(255,138,31,.7),0 2px 10px rgba(0,0,0,.45)}
  .cluster .c-flamme{position:absolute;top:-7px;right:-6px;font-size:13px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
  .cluster:focus-visible{outline:2px solid var(--papier);outline-offset:3px}

  /* Hover-Vorschau: Titel erscheint direkt am Pin, ohne dass man klicken muss.
     Auf Touchgeräten irrelevant (kein Hover) — dort führt der Tipp direkt zum Popup. */
  .blip .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:var(--panel);color:var(--papier);border:1px solid var(--linie);border-radius:11px;
    padding:9px 11px;font:400 11.5px 'Inter';width:max-content;max-width:250px;
    white-space:normal;text-align:left;
    pointer-events:none;opacity:0;visibility:hidden;
    transition:opacity .13s ease;box-shadow:0 6px 20px rgba(0,0,0,.55);z-index:20}
  .blip .tip b{display:block;font-weight:800;font-size:12.5px;line-height:1.25;margin-bottom:2px}
  .blip .tip small{display:block;color:var(--hilfe);font-weight:600;font-size:10.5px;margin-bottom:3px}
  .blip .tip em{display:block;font-style:normal;color:#C9CDD6;line-height:1.4;font-size:11px}
  .blip .tip i{display:block;font-style:normal;color:var(--event);font-weight:600;
    font-size:10.5px;margin-top:4px}
  /* Am oberen Kartenrand nach unten aufklappen, damit die Karte nicht hinter die Kopfzeile rutscht */
  .blip.tip-unten .tip{bottom:auto;top:calc(100% + 8px)}
  @media (hover:hover){
    .blip:hover{z-index:19}
    .blip:hover .tip{opacity:1;visibility:visible}
    .cluster:hover{filter:brightness(1.08)}
  }
  .blip:focus-visible .tip{opacity:1;visibility:visible}

  /* Blättern zwischen Pins (wie in Immobilienportalen: Treffer durchklicken) */
  .p-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:-4px -4px 8px;padding-bottom:8px;border-bottom:1px solid var(--linie)}
  .p-nav button{width:30px;height:26px;border-radius:7px;border:1px solid var(--linie);
    background:transparent;color:var(--papier);cursor:pointer;font-size:14px;line-height:1;flex:none}
  .p-nav button:disabled{opacity:.3;cursor:default}
  .p-nav .zaehler{font-size:11px;color:var(--grau);text-align:center;flex:1}

  /* Heimat-Marker */
  .heim-marker{width:16px;height:16px;border-radius:50%;background:var(--papier);
    border:3px solid var(--nacht);box-shadow:0 0 0 2px var(--papier)}

  /* ---------- Popup ---------- */
  .maplibregl-popup{z-index:15}
  .maplibregl-popup-content{background:var(--panel);color:var(--papier);
    border:1px solid var(--linie);border-radius:14px;padding:14px;min-width:230px;max-width:270px;
    font-family:'Inter'}
  .maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
  .maplibregl-popup-close-button{color:var(--grau);font-size:18px;right:6px;top:4px}
  .p-typ{font-family:'Anton';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .p-typ svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .p-typ.event{color:var(--event)} .p-typ.angebot{color:var(--angebot)}
  .p-typ.hilfe{color:var(--hilfe)} .p-typ.spot{color:var(--spot)}
  .p-hot{margin-left:auto;letter-spacing:.3px;font-size:9px;color:#141414;white-space:nowrap;
    background:linear-gradient(95deg,#FFC61A,#FF8A1F);border-radius:6px;padding:3px 6px}
  .p-titel{font-weight:800;font-size:15px;margin:4px 0 6px;line-height:1.25}
  .p-text{font-size:13px;color:#C9CDD6;line-height:1.45}
  .p-meta{font-size:11px;color:var(--grau);margin-top:8px}
  .p-gold{font-size:11px;color:var(--hilfe);margin-top:6px}
  /* Primäraktion breit und farbig, Zweitaktionen klein darunter — so ist auf einen Blick
     klar, was der nächste Schritt ist (Tickets bzw. Hinfahren). */
  .p-haupt{display:block;margin-top:11px;text-align:center;text-decoration:none;
    background:var(--hilfe);color:#141414;border-radius:10px;padding:12px 10px;
    font:800 13.5px 'Inter';letter-spacing:.2px}
  .p-akt{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .p-btn{display:inline-block;font:600 12px 'Inter';color:#141414;border:0;cursor:pointer;
    background:var(--papier);border-radius:8px;padding:7px 11px;text-decoration:none}
  .p-btn.sek{background:transparent;color:var(--papier);border:1px solid var(--linie)}
  .p-btn.sek.aktivgruen{border-color:var(--event);color:var(--event)}
  .p-quelle{font-size:10px;color:var(--grau);margin-top:8px}
  .p-quelle a{color:var(--grau)}

  /* Nutzerbeiträge: ein Bild und kurze Tipps von Leuten, die schon da waren.
     Beides wird vor der Veröffentlichung geprüft — siehe Roadmap "Beitragen". */
  .p-bild{width:100%;border-radius:10px;margin:9px 0 3px;display:block;
    background:var(--nacht);object-fit:cover;max-height:170px}
  .p-bild-credit{font-size:10px;color:var(--grau);margin-bottom:4px}
  .p-tipps{margin-top:10px;border-top:1px solid var(--linie);padding-top:9px}
  .p-tipps h4{font:800 11px 'Inter';letter-spacing:.6px;text-transform:uppercase;
    color:var(--grau);margin-bottom:6px}
  .p-tipp{font-size:12.5px;line-height:1.45;color:#C9CDD6;padding:6px 0;
    border-bottom:1px solid rgba(44,48,56,.6)}
  .p-tipp:last-of-type{border-bottom:0}
  .p-tipp b{color:var(--papier);font-weight:700}
  .p-tipp .wer{color:var(--grau);font-size:11px}
  .p-beitragen{display:flex;gap:6px;margin-top:9px}
  .p-beitragen button{flex:1;border:1px dashed var(--linie);background:transparent;
    color:var(--grau);border-radius:9px;padding:9px 6px;font:600 11.5px 'Inter';cursor:pointer}
  .p-beitragen button:active{transform:scale(.98)}
  .p-beitragen button:hover{color:var(--papier);border-color:var(--papier)}

  /* ---------- Modale ---------- */
  .schleier{position:fixed;inset:0;z-index:40;background:rgba(10,11,13,.6);display:none;
    align-items:flex-end;justify-content:center}
  .schleier.offen{display:flex}
  .blatt{width:100%;max-width:560px;max-height:82vh;overflow-y:auto;overflow-x:hidden;
    background:var(--panel);border:1px solid var(--linie);border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
  .blatt h2{font-family:'Anton';font-size:17px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
  .blatt h3{font-size:13px;font-weight:800;margin:16px 0 6px}
  .blatt p{font-size:13px;color:#C9CDD6;line-height:1.5;margin:6px 0}
  .blatt .klein{font-size:11px;color:var(--grau)}
  .blatt-knoepfe{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .bbtn{flex:1;min-width:130px;border:0;border-radius:12px;padding:12px;cursor:pointer;
    font:700 13px 'Inter';background:var(--papier);color:#141414;text-align:center;text-decoration:none;display:block}
  .bbtn.sek{background:transparent;color:var(--papier);border:1px solid var(--linie)}
  .bbtn.wa{background:#25D366}
  .bbtn.gelb{background:var(--hilfe)}
  .blatt textarea{width:100%;min-height:90px;border:1px solid var(--linie);background:var(--nacht);
    color:var(--papier);border-radius:10px;padding:10px;font:400 13px 'Inter';resize:vertical}
  .wahl-tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .wahl-tags .tagchip{font-size:13px;padding:9px 14px}

  /* Kurz-Einführung */
  .howto{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linie)}
  .howto:last-of-type{border-bottom:0}
  .howto .ht-icon{width:38px;height:38px;flex:none;border-radius:11px;background:var(--nacht);
    border:1px solid var(--linie);display:flex;align-items:center;justify-content:center;font-size:17px}
  .howto .ht-text{font-size:13px;line-height:1.45;color:#C9CDD6}
  .howto .ht-text b{color:var(--papier);display:block;font-size:13.5px;margin-bottom:1px}
  .schritte{display:flex;gap:5px;justify-content:center;margin-top:14px}
  .schritte span{width:7px;height:7px;border-radius:50%;background:var(--linie)}
  .schritte span.an{background:var(--hilfe);width:20px;border-radius:4px}
  .zeile{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--linie);font-size:13px}
  .zeile:last-child{border-bottom:0}
  .zeile .aktion{color:var(--hilfe);font-weight:700;cursor:pointer;background:none;border:0;font-size:13px}
  .radius-wahl{display:flex;gap:6px}
  .radius-wahl button{border:1px solid var(--linie);background:var(--nacht);color:var(--papier);
    border-radius:8px;padding:6px 10px;font:600 12px 'Inter';cursor:pointer}
  .radius-wahl button.an{background:var(--papier);color:#141414}
  /* 16px ist Pflicht: Darunter zoomt iOS beim Antippen ins Feld hinein */
  .blatt input[type="date"],.blatt input[type="time"]{border:1px solid var(--linie);
    background:var(--nacht);color:var(--papier);border-radius:8px;padding:9px 10px;
    font:600 16px 'Inter';color-scheme:dark}
  .zeit-feld{display:flex;gap:6px;align-items:center;flex:1;justify-content:flex-end;min-width:0}
  .zeit-feld input[type="time"]{width:88px;flex:none;padding-left:6px;padding-right:6px}
  .zeit-feld input[type="date"]{flex:none;min-width:0;padding-left:6px;padding-right:6px}
  @media (max-width:380px){
    .zeit-feld input[type="time"]{width:78px;font-size:15px}
    .zeit-feld input[type="date"]{font-size:15px}
  }

  /* Listenansicht */
  .liste-zeile{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:0;border-bottom:1px solid var(--linie);padding:11px 2px;cursor:pointer;color:var(--papier)}
  .liste-zeile:last-child{border-bottom:0}
  .liste-zeile .lz-sym{width:30px;height:30px;flex:none;border-radius:9px;border:2px solid #14161A;
    display:flex;align-items:center;justify-content:center;font-size:14px}
  .liste-zeile .lz-sym svg{width:15px;height:15px;color:#141414;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .liste-zeile .lz-sym.event{background:var(--event);border-radius:50%}
  .liste-zeile .lz-sym.angebot{background:var(--angebot)}
  .liste-zeile .lz-sym.hilfe{background:var(--hilfe);border-radius:8px}
  .liste-zeile .lz-sym.spot{background:var(--spot);border-radius:50%}
  .liste-zeile .lz-sym.hot{box-shadow:0 0 0 2px #FF8A1F, 0 0 8px 2px rgba(255,138,31,.7)}
  .liste-zeile .lz-mitte{flex:1;min-width:0;overflow:hidden}
  .liste-zeile .lz-titel{display:block;font-weight:700;font-size:13px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .liste-zeile .lz-meta{display:block;font-size:11px;color:var(--grau);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .liste-zeile .lz-datum{flex:none;max-width:33%;font-size:11px;color:var(--hilfe);
    font-weight:700;text-align:right;white-space:nowrap}
  .liste-tabs{display:flex;gap:8px;margin:10px 0 4px}
  .liste-tabs button{flex:1;border:1px solid var(--linie);background:transparent;color:var(--grau);
    border-radius:10px;padding:9px 6px;font:700 12px 'Inter';cursor:pointer}
  .liste-tabs button.an{background:var(--papier);color:#141414;border-color:var(--papier)}
  .saison-kopf{font-family:'Anton';font-size:12px;letter-spacing:1px;text-transform:uppercase;
    color:var(--hilfe);margin:16px 0 2px}
  .saison-kopf:first-of-type{margin-top:8px}
  .saison-kopf.spaeter{color:var(--grau)}

  /* ---------- Detail-Sheet (Mobil) ----------
     Auf dem Handy ist ein Popup mitten auf der Karte schlecht: klein, verdeckt den Pin und
     zwingt zum Zielen. Stattdessen fährt die Info von unten ein (wie in Karten- und
     Immobilien-Apps) — Karte bleibt oben sichtbar, Daumen erreicht alles. */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--panel);border-top:1px solid var(--linie);
    border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.55);
    transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
    max-height:66vh;display:flex;flex-direction:column;touch-action:none}
  .sheet.offen{transform:translateY(0)}
  .sheet-griff{width:100%;height:26px;border:0;background:transparent;cursor:grab;
    display:flex;align-items:center;justify-content:center;flex:none;padding:0}
  .sheet-griff::before{content:"";width:38px;height:4px;border-radius:2px;background:var(--linie)}
  .sheet-griff:active{cursor:grabbing}
  .sheet-inhalt{overflow-y:auto;overscroll-behavior:contain;
    padding:2px 16px calc(16px + env(safe-area-inset-bottom));font-family:'Inter'}
  .sheet .p-titel{font-size:17px;margin:6px 0 7px}
  .sheet .p-text{font-size:14px}
  .sheet .p-akt{gap:8px;margin-top:12px}
  .sheet .p-btn{padding:11px 14px;font-size:13px}
  .sheet .p-nav{margin:0 0 8px}
  .sheet .p-nav button{width:42px;height:34px;font-size:17px}
  .sheet-zurueck{display:flex;align-items:center;gap:6px;background:none;border:0;
    color:var(--hilfe);font:700 13px 'Inter';cursor:pointer;padding:6px 2px 8px}

  /* Querformat: Es bleibt kaum Höhe übrig — Sheet und Modale flacher, Filter zu.
     Ohne das verdeckt ein 66vh-Sheet fast die ganze Karte. */
  @media (max-height:520px){
    .sheet{max-height:82vh}
    .blatt{max-height:88vh}
    header{padding-top:6px;padding-bottom:4px}
    .hud{padding-top:4px}
    .hud-aktionen{margin-top:5px}
    .melden,.liste-btn{padding-top:10px;padding-bottom:10px}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
  @media (min-width:700px){
    .schleier{align-items:center} .blatt{border-radius:18px}
    .sheet{display:none}                 /* Desktop behält das Karten-Popup */
    /* Am Desktop ist Platz genug — Filter immer sichtbar, Klapp-Knopf überflüssig */
    .hud-klapp{display:none}
    .hud.zu .hud-filter{max-height:340px;opacity:1;pointer-events:auto}
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Eventlas Karte"></div>

<header>
  <div class="titel">
    <h1 id="app-titel">Event<span>las</span></h1>
    <div class="sub" id="app-sub">Aachen — Events · Angebote · Hilfe · Fotospots</div>
  </div>
  <div class="kopf-knoepfe">
    <button class="kbtn foto" id="btn-foto" aria-label="Plakat fotografieren" title="Plakat fotografieren — Ort wird automatisch erkannt">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>
    </button>
    <button class="kbtn" id="btn-liste" aria-label="Listenansicht" title="Liste der sichtbaren Pins">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    </button>
    <button class="kbtn" id="btn-suche" aria-label="Suchen" title="Suchen">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
    </button>
    <button class="kbtn" id="btn-idee" aria-label="Verbesserungsvorschlag" title="Idee einreichen">
      <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.7 1 1.6 1 2.5h6c0-.9.2-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>
    </button>
    <button class="kbtn" id="btn-info" aria-label="Info und Profil" title="Info & Profil">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/></svg>
    </button>
  </div>
</header>

<div class="suche" id="suchleiste">
  <input id="sucheingabe" type="search" placeholder="z. B. Konzert, Flohmarkt, Wochenende …"
    autocomplete="off" aria-label="Pins durchsuchen">
  <button class="leeren" id="suchleeren" aria-label="Suche löschen">✕</button>
</div>
<div class="such-info" id="such-info" role="status"></div>

<div class="toast" id="toast" role="status"></div>

<div class="hud">
  <div class="hud-innen">
    <button class="hud-klapp" id="hud-klapp" aria-expanded="true" aria-controls="hud-filter">
      <span class="pfeil">▼</span><span id="klapp-text">Filter ausblenden</span><span class="marke" id="klapp-marke">aktiv</span>
    </button>
    <div class="hud-filter" id="hud-filter">
      <div class="tags-wrap" id="tags-wrap">
        <div class="tags" id="tagleiste" role="group" aria-label="Nach Thema filtern"></div>
      </div>
      <div class="zfilter" role="group" aria-label="Zeitraum filtern">
        <button class="zchip" data-z="today">Heute</button>
        <button class="zchip an" data-z="soon">Demnächst</button>
        <button class="zchip" data-z="all">Alle</button>
        <button class="zchip" data-z="range" id="zr-chip">📅 Zeitraum</button>
      </div>
      <div class="filter" role="group" aria-label="Kategorien filtern">
        <button class="chip" data-typ="event" aria-pressed="true"></button>
        <button class="chip" data-typ="angebot" aria-pressed="true"></button>
        <button class="chip" data-typ="hilfe" aria-pressed="true"></button>
        <button class="chip" data-typ="spot" aria-pressed="true"></button>
      </div>
    </div>
    <div class="hud-aktionen">
      <button class="liste-btn" id="liste-unten"><span class="lb-icon">☰</span><span id="liste-zahl">Liste</span></button>
      <button class="melden" id="melden">＋ Pin melden</button>
    </div>
    <div class="hinweis" id="hinweis"></div>
  </div>
</div>

<!-- Detail-Sheet (Mobil): Pin-Infos unten statt Popup auf der Karte -->
<div class="sheet" id="sheet" role="dialog" aria-label="Pin-Details" aria-hidden="true">
  <button class="sheet-griff" id="sheet-griff" aria-label="Schließen"></button>
  <div class="sheet-inhalt" id="sheet-inhalt"></div>
</div>

<!-- Modale -->
<div class="schleier" id="schleier">
  <div class="blatt" id="blatt" role="dialog" aria-modal="true"></div>
</div>

<input type="file" id="plakat-datei" accept="image/*" capture="environment" hidden>
<input type="file" id="plakat-galerie" accept="image/*" hidden>
<input type="file" id="beitrag-datei" accept="image/*" hidden>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>

const FALLBACK_PINS = [

  {id:"alemannia-verl", typ:"event", titel:"Alemannia – SC Verl", text:"Saisonauftakt am Tivoli, Anstoß 19:30 Uhr. Vorher Fanmarsch: Treffen ab 13 Uhr auf dem Markt, Abmarsch 15:30 Uhr.", lng:6.0955, lat:50.7930, start:"2026-08-09", meta:"19:30 · Tivoli", tags:["sport"], link:"https://www.alemannia-aachen.de", quelle:"https://www.alemannia-aachen.de", hinzu:"2026-08-07"},
  {id:"alemannia-meppen", typ:"event", titel:"Alemannia – SV Meppen", text:"3. Spieltag am Tivoli. Genauer Anstoß wird noch terminiert — Details auf der Vereinsseite.", lng:6.0968, lat:50.7925, start:"2026-08-28", ende:"2026-08-30", meta:"Tivoli", tags:["sport"], link:"https://www.alemannia-aachen.de", quelle:"https://www.alemannia-aachen.de", hinzu:"2026-08-07"},

/* ---------- Zeitlogik (Roadmap Nr. 13: rollierende Fenster statt Jahresfilter) ----------
   Abgelaufene Pins werden NIE angezeigt (Datenpflege: das Update-Skript räumt Einträge,
   die länger als 3 Monate vorbei sind, aus pins.json). "Alle" = alles Kommende, auch
   über den Jahreswechsel hinaus — dadurch braucht es keinen fehleranfälligen Jahresfilter. */
const HEUTE0 = new Date(); HEUTE0.setHours(0,0,0,0);
const TAGE = ["so","mo","di","mi","do","fr","sa"];
const TAGN = {mo:"Mo",di:"Di",mi:"Mi",do:"Do",fr:"Fr",sa:"Sa",so:"So"};

function fenster(p){ // effektives Zeitfenster {s,e} oder null (= undatiert/immer)
  if(p.saison && p.saison.von && p.saison.bis){
    const j = HEUTE0.getFullYear();
    let s = new Date(j+"-"+p.saison.von+"T00:00:00");
    let e = new Date(j+"-"+p.saison.bis+"T23:59:59");
    if(e < s){ // Saison über Jahreswechsel (z. B. 11-01 bis 02-28)
      const eLaufend = new Date(j+"-"+p.saison.bis+"T23:59:59");
      if(HEUTE0 <= eLaufend) return {s:new Date((j-1)+"-"+p.saison.von+"T00:00:00"), e:eLaufend}; // im Vorjahr gestartet, läuft noch
      return {s, e:new Date((j+1)+"-"+p.saison.bis+"T23:59:59")};                                 // nächste Instanz
    }
    if(e < HEUTE0){ s.setFullYear(j+1); e.setFullYear(j+1); }  // dieses Jahr vorbei → nächstes Jahr
    return {s, e};
  }
  if(p.start){
    return {s:new Date(p.start+"T00:00:00"), e:new Date((p.ende || p.start)+"T23:59:59")};
  }
  return null;
}
function wdhAnTag(wdh, d){ return wdh.split(",").map(t=>t.trim()).includes(TAGE[d.getDay()]); }
function wdhImFenster(wdh, von, bis){
  const d = new Date(von);
  for(let i=0; i<8 && d<=bis; i++){ if(wdhAnTag(wdh, d)) return true; d.setDate(d.getDate()+1); }
  return false;
}
/* Uhrzeit aus der Meta-Zeile lesen: "Musikbunker · 20 Uhr", "Markt · 20:30 · frei",
   "Sa 7–13 Uhr". Liefert Minuten seit Mitternacht oder null, wenn keine Zeit dabeisteht. */
function startMinute(p){
  if(p._min !== undefined) return p._min;
  const text = (p.meta || "") + " " + (p.text || "");
  const m = text.match(/(?:^|[^\d.])(\d{1,2})[:.](\d{2})\s*(?:Uhr)?/) ||
            text.match(/(?:^|[^\d.])(\d{1,2})\s*Uhr/);
  p._min = m ? (+m[1]) * 60 + (m[2] ? +m[2] : 0) : null;
  if(p._min !== null && (p._min < 0 || p._min > 1439)) p._min = null;
  return p._min;
}
/* Uhrzeit-Fenster prüfen — nur wenn im Filter überhaupt eine Zeit gesetzt wurde.
   Pins ohne Zeitangabe (Märkte, Ausstellungen, Ernteorte) bleiben bewusst sichtbar. */
function uhrzeitOk(p, f){
  if(!f || !f.mitZeit) return true;
  const min = startMinute(p);
  if(min === null) return true;
  const vonMin = f.von.getHours()*60 + f.von.getMinutes();
  const bisMin = f.bis.getHours()*60 + f.bis.getMinutes();
  return vonMin <= bisMin ? (min >= vonMin && min <= bisMin) : (min >= vonMin || min <= bisMin);
}

function wdhAktivImFenster(p, von, bis){
  // wdh-Pin mit optionalem start/ende: nur Tage zählen, die auch im Pin-Fenster liegen
  const w = fenster(p);
  const a = (w && w.s > von) ? w.s : von;
  const b = (w && w.e < bis) ? w.e : bis;
  if(a > b) return false;
  return wdhImFenster(p.wdh, a, b);
}
function zeitOk(p){
  const w = fenster(p);
  if(w && w.e < HEUTE0) return false;                      // vorbei → nie zeigen
  const schnitt = suchFenster || (zeit === "range" ? eigenZeitraum : null); // Suche/eigener Zeitraum
  if(schnitt){
    if(!uhrzeitOk(p, schnitt)) return false;
    if(p.wdh) return wdhAktivImFenster(p, schnitt.von, schnitt.bis);
    if(!w) return false;
    return w.s <= schnitt.bis && schnitt.von <= w.e;
  }
  if(zeit === "all") return true;
  const heuteEnde = new Date(HEUTE0); heuteEnde.setHours(23,59,59);
  const limit = new Date(HEUTE0); limit.setDate(limit.getDate()+30);
  if(p.wdh){                                               // wdh + start/ende: erst ab Fensterbeginn zeigen
    if(w && w.s > (zeit === "today" ? heuteEnde : limit)) return false;
    return zeit === "soon" ? true : wdhAnTag(p.wdh, HEUTE0);
  }
  if(!w) return true;                                      // undatierte Orte: immer
  if(zeit === "today") return w.s <= heuteEnde && HEUTE0 <= w.e;
  return w.s <= limit;                                     // "Demnächst" = startet in ≤30 Tagen
}
function fmtDatum(p){
  if(p.wdh) return "jeden " + p.wdh.split(",").map(t=>TAGN[t.trim()]||t).join("/");
  if(p.saison){ const mt = s => parseInt(s.slice(3),10)+"."+parseInt(s.slice(0,2),10)+"."; return "Saison " + mt(p.saison.von) + "–" + mt(p.saison.bis); }
  if(!p.start) return "";
  const f = d => { const x = new Date(d+"T00:00:00"); return TAGN[TAGE[x.getDay()]] + " " + x.getDate() + "." + (x.getMonth()+1) + "."; };
  return p.ende && p.ende !== p.start ? f(p.start) + " – " + f(p.ende) : f(p.start);
}

/* ---------- Sonnenzeiten für Fotospots (Roadmap Nr. 6) — NOAA-Näherung, ±3 Min ---------- */
function sonnenzeiten(lat, lng, datum){
  const rad = Math.PI/180;
  const anfang = new Date(datum.getFullYear(), 0, 0);
  const tag = Math.floor((datum - anfang) / 864e5);
  const B = rad * (360/365) * (tag - 81);
  const eot = 9.87*Math.sin(2*B) - 7.53*Math.cos(B) - 1.5*Math.sin(B);
  const dekl = 23.45 * Math.sin(rad * (360/365) * (tag - 81));
  const cosH = (Math.cos(90.833*rad) - Math.sin(lat*rad)*Math.sin(dekl*rad)) / (Math.cos(lat*rad)*Math.cos(dekl*rad));
  if(cosH < -1 || cosH > 1) return null;
  const H = Math.acos(cosH) / rad;
  const mittagUTC = 720 - 4*lng - eot;
  const mk = min => { const d = new Date(Date.UTC(datum.getFullYear(), datum.getMonth(), datum.getDate())); d.setUTCMinutes(Math.round(min)); return d; };
  return { aufgang: mk(mittagUTC - 4*H), untergang: mk(mittagUTC + 4*H) };
}
function goldeneStundeText(p){
  const sz = sonnenzeiten(p.lat, p.lng, new Date());
  if(!sz) return "";
  const f = d => d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  const gsStart = new Date(sz.untergang.getTime() - 60*60*1000);
  return "☀️ Goldene Stunde heute: " + f(gsStart) + "–" + f(sz.untergang) + " · Sonnenaufgang " + f(sz.aufgang);
}

   "sonnenuntergang","sonnenaufgang","instagram","insta","bild","bilder"],
  ["hilfe","helfen","gesuch","gesuche","suche","nachbarschaft","nachbarschaftshilfe","unterstuetzung",
   "unterstützung","ehrenamt","einkauf","kurier"],
  // "kostenlos" ist kein Tag mehr — diese Gruppe sucht deshalb im Volltext (Text/Meta-Zeile)
  ["gratis","kostenlos","umsonst","frei","eintrittsfrei","geschenkt","verschenken","zu-verschenken","abzugeben"],
  ["fest","feste","strassenfest","straßenfest","stadtfest","kirmes","jahrmarkt","karneval","feiern"],
];
// Wort → Gruppe (einmalig aufgebaut, damit die Suche pro Tastendruck schnell bleibt)
const SYN_INDEX = new Map();
SYNONYME.forEach(gruppe => gruppe.forEach(w => {
  if(!SYN_INDEX.has(w)) SYN_INDEX.set(w, new Set());
  gruppe.forEach(v => SYN_INDEX.get(w).add(v));
}));

/* Umlaute und ß vereinheitlichen, damit "Trödel" auch "troedel" findet (und umgekehrt) */
function normText(s){
  return String(s).toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[^a-z0-9]+/g," ");
}
/* Sehr einfaches Stammformen-Kürzen für deutsche Endungen — reicht für Suchbegriffe.
   Kurze Wörter bleiben unangetastet, damit "spot" nicht zu "sp" wird. */
function stamm(w){
  if(w.length <= 4) return w;
  return w.replace(/(innen|ungen|enden|erin|ung|est|end|ern|em|er|en|es|et|te|st|s|e|n)$/,"");
}

function parseSuche(q){
  suchTerme = []; suchFenster = null;
  normText(q).split(/\s+/).filter(Boolean).forEach(tok => {
    if(tok === "heute") { suchFenster = fensterTage(0,0); return; }
    if(tok === "morgen"){ suchFenster = fensterTage(1,1); return; }
    if(tok.startsWith("wochenend")){ suchFenster = naechstesWochenende(); return; }
    if(FUELLWOERTER.has(tok)) return;
    // Varianten: das Wort selbst, sein Stamm und alle Synonyme (als Stämme)
    const varianten = new Set([tok, stamm(tok)]);
    (SYN_INDEX.get(tok) || SYN_INDEX.get(stamm(tok)) || []).forEach(v => varianten.add(stamm(normText(v).trim())));
    suchTerme.push([...varianten].filter(Boolean));
  });
}

/* Durchsuchbarer Text eines Pins — einmal berechnet und am Pin gespeichert (Cache),
   damit die Suche auch bei vielen Pins pro Tastendruck flüssig bleibt. */
function suchText(p){
  if(p._such) return p._such;
  const teile = [p.titel, p.text, p.meta, p.tags.join(" "), TYPNAME[p.typ], TYPPLURAL[p.typ]];
  if(p.quelle){ try{ teile.push(new URL(p.quelle).hostname.replace(/^www\./,"").split(".")[0]); }catch(e){} }
  if(p.wdh) teile.push(p.wdh.split(",").map(t => TAGN[t.trim()] || t).join(" ") + " woechentlich jeden");
  if(p.saison) teile.push("saison saisonal");
  if(p.hot) teile.push("beliebt angesagt highlight");
  const worte = normText(teile.filter(Boolean).join(" ")).split(/\s+/).filter(Boolean);
  // Volltext + Stammformen, damit "Konzerte" auch "Konzert" trifft
  p._such = " " + worte.join(" ") + " | " + worte.map(stamm).join(" ") + " ";
  return p._such;
}
function textOk(p){
  if(!suchTerme.length) return true;
  const heu = suchText(p);
  // Jede Eingabe-Gruppe muss irgendwie vorkommen (UND zwischen Wörtern, ODER innerhalb der Synonyme)
  return suchTerme.every(varianten => varianten.some(v => v && heu.includes(v)));
}
function tagOk(p){
  if(merkModus && !merk[p.id]) return false;
  if(nurHighlights && !p.hot) return false;
  if(!aktiveTags.size) return true;
  return p.tags.some(t => aktiveTags.has(t));
}
function sichtbar(p){ return !p.verstecken && aktiv[p.typ] && zeitOk(p) && textOk(p) && tagOk(p); }
function imAusschnitt(p){
  try{ return map.getBounds().contains([p.lng, p.lat]); }catch(e){ return true; }
}
function istNeu(p){ return letzterBesuch && p.hinzu && p.hinzu > letzterBesuch; }
function passtZuMir(p){
  const meine = profilTags();
  return meine.length && p.tags.some(t => meine.includes(t));
}

/* ---------- Popup (Roadmap Nr. 10, 20, 23) ---------- */
/* Grundlage fürs Durchblättern (wie eine Trefferliste in Immobilienportalen): die Pins des
   aktuellen Ausschnitts, nach Relevanz sortiert. Der Kontext wird beim Öffnen des ersten
   Popups EINGEFROREN — sonst würde sich "3 von 17" bei jeder Kartenbewegung ändern und man
   verlöre beim Blättern die Reihenfolge. Zurückgesetzt beim Schließen und bei Filterwechsel. */
let blaetterKontext = null;
function blaetterListe(p){
  if(!blaetterKontext){
    blaetterKontext = PINS.filter(x => sichtbar(x) && imAusschnitt(x))
      .sort((a,b) => relevanz(b) - relevanz(a));
    // Am Rand geöffnet? Dann gehört der Pin trotzdem dazu.
    if(p && !blaetterKontext.some(x => x.id === p.id)) blaetterKontext.unshift(p);
  }
  return blaetterKontext;
}
function blaetterKontextLoeschen(){ blaetterKontext = null; }
function zeigePinNr(i){
  const liste = blaetterListe();
  const p = liste[i];
  if(!p) return;
  if(istMobil()){ sheetOeffnen(p); return; }      // im Sheet bleiben statt Popup zu wechseln
  const mk = marker.find(x => x.p.id === p.id);
  if(!mk) return;
  const merkeKontext = blaetterKontext;                  // Kontext übers Schließen hinweg halten
  marker.forEach(x => { if(x.m.getPopup() && x.m.getPopup().isOpen()) x.m.togglePopup(); });
  blaetterKontext = merkeKontext;
  mk.el.style.display = "flex";
  lernen(p);
  if(!map.getBounds().contains([p._lng ?? p.lng, p._lat ?? p.lat]))
    map.easeTo({center:[p._lng ?? p.lng, p._lat ?? p.lat], duration:400});
  mk.m.togglePopup();
}
/* ---------- Nutzerbeiträge: Bild und Tipps ----------
   Beides wird eingereicht (WhatsApp/Mail), vom Betreiber geprüft und dann in pins.json
   eingetragen — bewusst mit Vorabprüfung: Für fremde Fotos und Texte haftet der Betreiber
   (Urheber- und Persönlichkeitsrechte), automatische Veröffentlichung wäre riskant.
   Schema: bild {url, credit}, tipps [{text, von, datum}] */
function bildBlock(p){
  if(!p.bild || !urlOk(p.bild.url)) return "";
  return '<img class="p-bild" src="'+esc(p.bild.url)+'" alt="'+esc(p.titel)+'" loading="lazy">'+
    (p.bild.credit ? '<div class="p-bild-credit">Foto: '+esc(p.bild.credit)+'</div>' : "");
}
function tippBlock(p){
  const tipps = Array.isArray(p.tipps) ? p.tipps.filter(t => t && t.text) : [];
  const liste = tipps.map(t =>
    '<div class="p-tipp">'+esc(t.text)+
    (t.von ? ' <span class="wer">— '+esc(t.von)+(t.datum ? ", "+esc(fmtKurzDatum(t.datum)) : "")+'</span>' : '')+
    '</div>').join("");
  return '<div class="p-tipps">'+
    (tipps.length ? '<h4>Tipps aus der Nachbarschaft</h4>' + liste : '')+
    '<div class="p-beitragen">'+
      '<button class="bei-foto" data-id="'+esc(p.id)+'">📷 Foto beisteuern</button>'+
      '<button class="bei-tipp" data-id="'+esc(p.id)+'">💬 '+(tipps.length ? "Tipp ergänzen" : "Ersten Tipp schreiben")+'</button>'+
    '</div></div>';
}
function fmtKurzDatum(iso){
  const d = new Date(iso + "T00:00:00");
  return isNaN(d) ? iso : d.getDate() + "." + (d.getMonth()+1) + ".";
}

function popupHTML(p){
  const meta = [fmtDatum(p), p.meta].filter(Boolean).join(" · ");
  const gold = p.typ === "spot" ? '<div class="p-gold">'+esc(goldeneStundeText(p))+'</div>'
             : p.saison ? '<div class="p-gold">'+esc(saisonStatus(p).lang)+'</div>' : "";
  const route = "https://www.google.com/maps/dir/?api=1&destination=" + p.lat + "," + p.lng;
  const gedankt = danke[p.id];
  let quelle = "";
  if(urlOk(p.quelle)){
    let host = p.quelle; try{ host = new URL(p.quelle).hostname.replace(/^www\./,""); }catch(e){}
    quelle = '<div class="p-quelle">Quelle: <a href="'+esc(p.quelle)+'" target="_blank" rel="noopener">'+esc(host)+'</a></div>';
  }
  const gemerkt = merk[p.id];
  /* Aktionen mit klarer Rangfolge statt sechs gleichrangiger Knöpfe: Was der Nutzer als
     Nächstes tun will, steht breit oben — bei Veranstaltungen mit Link die Detailseite
     (dort gibt es Tickets), sonst die Route. Alles Weitere kompakt darunter. */
  const primaer = urlOk(p.link)
    ? '<a class="p-haupt" href="'+esc(p.link)+'" target="_blank" rel="noopener">Mehr dazu &amp; Tickets ↗</a>'
    : '<a class="p-haupt" href="'+esc(route)+'" target="_blank" rel="noopener">📍 Route dorthin</a>';
  // Blätter-Leiste wie in Immobilienportalen: Treffer der Reihe nach durchgehen,
  // ohne jedes Mal zur Karte zurückzumüssen.
  const liste = blaetterListe(p);
  const idx = liste.findIndex(x => x.id === p.id);
  const nav = liste.length > 1 && idx >= 0
    ? '<div class="p-nav">'+
        '<button class="p-vor" data-i="'+(idx-1)+'"'+(idx <= 0 ? ' disabled' : '')+' aria-label="Vorheriger Pin">‹</button>'+
        '<span class="zaehler">'+(idx+1)+' von '+liste.length+'</span>'+
        '<button class="p-zurueck" data-i="'+(idx+1)+'"'+(idx >= liste.length-1 ? ' disabled' : '')+' aria-label="Nächster Pin">›</button>'+
      '</div>'
    : "";
  return nav + '<div class="p-typ '+esc(p.typ)+'">'+ICON[p.typ]+TYPNAME[p.typ]+(p.hot ? '<span class="p-hot">🔥 Highlight</span>' : '')+'</div>'+
    '<div class="p-titel">'+esc(p.titel)+'</div>'+
    '<div class="p-text">'+esc(p.text)+'</div>'+
    (meta ? '<div class="p-meta">'+esc(meta)+'</div>' : "")+ gold +
    bildBlock(p) + primaer +
    '<div class="p-akt">'+
      (urlOk(p.link) ? '<a class="p-btn sek" href="'+esc(route)+'" target="_blank" rel="noopener">📍 Route</a>' : "")+
      '<button class="p-btn sek p-danke'+(gedankt?' aktivgruen':'')+'" data-id="'+esc(p.id)+'">👍 '+(gedankt?"Danke ✓":"Danke")+'</button>'+
      '<button class="p-btn sek p-merk'+(gemerkt?' aktivgruen':'')+'" data-id="'+esc(p.id)+'">★ '+(gemerkt?"Gemerkt ✓":"Merken")+'</button>'+
      '<button class="p-btn sek p-teilen" data-id="'+esc(p.id)+'">↗ Teilen</button>'+
      (p.start ? '<button class="p-btn sek p-ics" data-id="'+esc(p.id)+'">📅 Kalender</button>' : "")+
    '</div>'+ tippBlock(p) + quelle;
}

/* Kopfzeile und HUD liegen als Overlay über der Karte — MapLibre weiß davon nichts und
   öffnet Popups gern genau darunter. Nach dem Öffnen prüfen wir die tatsächliche Lage und
   schieben die Karte nur so weit, dass das Popup frei steht. */
function popupInsBild(m){
  setTimeout(() => {
    const pop = m.getPopup && m.getPopup();
    if(!pop || !pop.isOpen()) return;
    const el = pop.getElement();
    if(!el) return;
    const box = el.getBoundingClientRect();
    const hud = document.querySelector(".hud").getBoundingClientRect();
    const kopfUnten = document.querySelector("header").getBoundingClientRect().bottom;
    const rand = 10;
    let dx = 0, dy = 0;
    if(box.bottom > hud.top - rand) dy = box.bottom - (hud.top - rand);   // vom HUD wegschieben
    if(box.top - dy < kopfUnten + rand) dy = box.top - (kopfUnten + rand); // aber nicht unter die Kopfzeile
    if(box.right > innerWidth - rand) dx = box.right - (innerWidth - rand);
    if(box.left - dx < rand) dx = box.left - rand;
    if(dx || dy) map.panBy([dx, dy], {duration:280});
  }, 60);   // Popup braucht einen Frame, bis es gemessen werden kann
}

/* Inhalt der Hover-Karte: so viel, dass man ohne Klick entscheiden kann, ob es sich lohnt —
   Kategorie, Titel, Wann/Wo, ein Satz Beschreibung und Hinweise wie „gratis" oder Entfernung. */
function hoverInhalt(p){
  const wannWo = [fmtDatum(p), p.meta].filter(Boolean).join(" · ");
  const satz = String(p.text || "").split(/(?<=[.!?])\s/)[0];   // erster Satz reicht
  const marken = [];
  if(p.hot) marken.push("🔥 Highlight");
  if(/kostenlos|gratis|eintritt frei|\bfrei\b/i.test((p.meta||"") + " " + (p.text||""))) marken.push("gratis");
  if(p.saison){ const st = saisonStatus(p); if(st.laeuft) marken.push("jetzt Saison"); }
  const weg = entfernungText(p);
  if(weg) marken.push(weg + " entfernt");
  return '<b>' + esc(p.titel) + '</b>' +
    (wannWo ? '<small>' + esc(wannWo) + '</small>' : '') +
    (satz ? '<em>' + esc(satz.length > 95 ? satz.slice(0, 92) + "…" : satz) + '</em>' : '') +
    (marken.length ? '<i>' + esc(marken.join(" · ")) + '</i>' : '');
}

/* ---------- Detail-Sheet: auf Mobil ersetzt es das Karten-Popup ---------- */
const istMobil = () => window.matchMedia("(max-width: 699px)").matches;
let sheetPin = null;          // welcher Pin steckt gerade im Sheet
let sheetAusListe = false;    // kam der Nutzer aus der Liste? → Rückweg anbieten

function sheetOeffnen(p, ausListe){
  sheetPin = p;
  if(ausListe !== undefined) sheetAusListe = ausListe;
  const inhalt = $("#sheet-inhalt");
  inhalt.innerHTML = (sheetAusListe
      ? '<button class="sheet-zurueck" id="sheet-zur-liste">‹ Zurück zur Liste</button>' : '') +
    popupHTML(p);
  $("#sheet").classList.add("offen");
  $("#sheet").setAttribute("aria-hidden", "false");
  const zur = $("#sheet-zur-liste");
  if(zur) zur.addEventListener("click", () => { sheetSchliessen(); zeigeListe(letzterListenTab); });
  lernen(p);
  pinFreihalten(p);
  ansichtAktualisieren();
}
function sheetSchliessen(){
  $("#sheet").classList.remove("offen");
  $("#sheet").setAttribute("aria-hidden", "true");
  sheetPin = null; sheetAusListe = false;
  blaetterKontextLoeschen();
}
/* Karte so verschieben, dass der gewählte Pin über dem Sheet sichtbar bleibt */
function pinFreihalten(p){
  setTimeout(() => {
    const sheet = $("#sheet").getBoundingClientRect();
    const pkt = map.project([p._lng ?? p.lng, p._lat ?? p.lat]);
    const kopfUnten = document.querySelector("header").getBoundingClientRect().bottom;
    const obergrenze = kopfUnten + 40, untergrenze = sheet.top - 30;
    if(pkt.y > untergrenze) map.panBy([0, pkt.y - untergrenze + 40], {duration:300});
    else if(pkt.y < obergrenze) map.panBy([0, pkt.y - obergrenze], {duration:300});
  }, 40);
}
$("#sheet-griff").addEventListener("click", sheetSchliessen);

/* Wischgesten: nach unten schließen, seitlich blättern — wie in Karten-Apps üblich */
(() => {
  const sheet = $("#sheet");
  let startY = 0, startX = 0, dy = 0, dx = 0, aktiv = false;
  sheet.addEventListener("touchstart", e => {
    if($("#sheet-inhalt").scrollTop > 0) return;      // erst scrollen, dann ziehen
    aktiv = true; startY = e.touches[0].clientY; startX = e.touches[0].clientX; dy = dx = 0;
    sheet.style.transition = "none";
  }, {passive:true});
  sheet.addEventListener("touchmove", e => {
    if(!aktiv) return;
    dy = e.touches[0].clientY - startY;
    dx = e.touches[0].clientX - startX;
    if(dy > 0) sheet.style.transform = "translateY(" + dy + "px)";
  }, {passive:true});
  sheet.addEventListener("touchend", () => {
    if(!aktiv) return;
    aktiv = false;
    sheet.style.transition = "";
    sheet.style.transform = "";
    if(dy > 90) { sheetSchliessen(); return; }
    if(Math.abs(dx) > 70 && Math.abs(dy) < 40 && sheetPin){   // seitlich blättern
      const liste = blaetterListe(sheetPin);
      const i = liste.findIndex(x => x.id === sheetPin.id);
      const ziel = dx < 0 ? i + 1 : i - 1;
      if(ziel >= 0 && ziel < liste.length) sheetOeffnen(liste[ziel]);
    }
  });
})();

/* ---------- Marker ---------- */
/* Pins auf (fast) identischer Koordinate kreisförmig auffächern, damit jeder antippbar
   bleibt — z. B. Katschhof und Elisenbrunnen, wo mehrere Pins übereinanderliegen.
   Der Versatz ist bewusst winzig (~12 m) und wird nur zur Darstellung benutzt. */
function faecherAuf(pins){
  const gruppen = new Map();
  pins.forEach(p => {
    const key = p.lng.toFixed(3) + "," + p.lat.toFixed(3);   // ~100-m-Raster
    (gruppen.get(key) || gruppen.set(key, []).get(key)).push(p);
  });
  gruppen.forEach(gruppe => {
    if(gruppe.length < 2) { gruppe.forEach(p => { p._lng = p.lng; p._lat = p.lat; }); return; }
    const r = 0.00011 * Math.min(2.2, 1 + gruppe.length * 0.16);   // wächst leicht mit der Anzahl
    gruppe.forEach((p, i) => {
      const w = (i / gruppe.length) * 2 * Math.PI - Math.PI / 2;
      p._lng = p.lng + (r * Math.cos(w)) / Math.cos(p.lat * Math.PI / 180);
      p._lat = p.lat + r * Math.sin(w);
    });
  });
}

function baueMarker(){
  marker.forEach(x => x.m.remove());
  marker.length = 0;
  clusterAufloesen();
  faecherAuf(PINS);
  PINS.forEach(p => {
    const el = document.createElement("button");
    el.className = "blip t-"+p.typ + (p.hot ? " hot" : "") + (istNeu(p) ? " frisch" : "");
    const sym = blipSymbol(p);
    el.innerHTML = '<span class="form"></span>' +
      (sym ? '<span class="emo">'+sym+'</span>' : ICON[p.typ]) +
      '<span class="tip">' + hoverInhalt(p) + '</span>';
    el.addEventListener("click", () => lernen(p));
    // Tooltip nach unten klappen, wenn oben kein Platz ist
    el.addEventListener("mouseenter", () => {
      el.classList.toggle("tip-unten", el.getBoundingClientRect().top < 190);
    });
    const m = new maplibregl.Marker({element:el})
      .setLngLat([p._lng ?? p.lng, p._lat ?? p.lat])
      .setPopup(new maplibregl.Popup({offset:22, maxWidth:"270px"}).setHTML(popupHTML(p)))
      .addTo(map);
    // Auf dem Handy übernimmt das Sheet — Popup gar nicht erst öffnen lassen
    el.addEventListener("click", ev => {
      if(!istMobil()) return;
      ev.stopPropagation();
      if(m.getPopup().isOpen()) m.togglePopup();
      sheetOeffnen(p, false);
    }, true);
    // Inhalt bei jedem Öffnen neu bauen: Zähler ("3 von 17"), Danke-Status und
     // Goldene Stunde hängen vom aktuellen Zustand ab, nicht vom Zeitpunkt des Aufbaus.
    m.getPopup().on("open", () => { m.getPopup().setHTML(popupHTML(p)); popupInsBild(m); });
    m.getPopup().on("close", () => setTimeout(() => {
      // Kein Popup mehr offen → Blätter-Kontext freigeben, damit er beim nächsten Mal frisch ist
      if(!marker.some(x => x.m.getPopup() && x.m.getPopup().isOpen())) blaetterKontextLoeschen();
    }, 30));
    el.setAttribute("aria-label", TYPNAME[p.typ]+": "+p.titel);  // nach addTo — MapLibre überschreibt es sonst
    marker.push({p, m, el});
  });
}

/* ---------- Tag-Leiste (Roadmap Nr. 7 + V2 "Für dich") ---------- */
/* Themen, nach denen Leute aktiv suchen — die stehen vorn, auch wenn es (noch) wenige Pins
   gibt. Sonst rutscht z. B. "Musik" hinter 20 Ernte-Pins und wirkt, als gäbe es keine Konzerte. */
const TAG_PRIO = ["musik", "kultur", "fest", "markt", "sport", "familie", "natur"];
function baueTagleiste(){
  const zaehl = {};
  PINS.forEach(p => { if(zeitOk(p)) p.tags.forEach(t => zaehl[t] = (zaehl[t]||0)+1); });
  const vorhanden = Object.keys(zaehl);
  const wichtig = TAG_PRIO.filter(t => zaehl[t]);
  const rest = vorhanden.filter(t => !wichtig.includes(t)).sort((a,b) => zaehl[b]-zaehl[a]);
  const tags = [...wichtig, ...rest].slice(0, 14);
  const leiste = $("#tagleiste");
  leiste.innerHTML = "";
  const reset = document.createElement("button");                 // Auswahl aufheben (User-Test)
  reset.className = "tagchip reset"; reset.id = "filter-reset";
  reset.textContent = "✕ Zurücksetzen";
  reset.addEventListener("click", filterZuruecksetzen);
  leiste.appendChild(reset);

  // Highlights zuerst: der schnellste Weg zu "was lohnt sich gerade wirklich?"
  const hotAnzahl = PINS.filter(p => p.hot && zeitOk(p)).length;
  if(hotAnzahl){
    const h = document.createElement("button");
    h.className = "tagchip highlight" + (nurHighlights ? " an" : "");
    h.id = "chip-highlights";
    h.textContent = "🔥 Highlights " + hotAnzahl;
    h.setAttribute("aria-pressed", nurHighlights);
    h.addEventListener("click", () => {
      nurHighlights = !nurHighlights;
      h.classList.toggle("an", nurHighlights);
      h.setAttribute("aria-pressed", nurHighlights);
      ansichtAktualisieren();
      if(nurHighlights) alleTrefferZeigen();      // alle Highlights ins Bild holen
    });
    leiste.appendChild(h);
  }
  if(profil){
    const b = document.createElement("button");
    b.className = "tagchip fuerdich" + (fuerDich ? " an" : "");
    b.textContent = "✦ Für dich";
    b.setAttribute("aria-pressed", fuerDich);
    b.addEventListener("click", () => { fuerDich = !fuerDich; ansichtAktualisieren(); });
    leiste.appendChild(b);
  }
  if(Object.keys(merk).length){
    const b = document.createElement("button");
    b.className = "tagchip" + (merkModus ? " an" : "");
    b.textContent = "★ Gemerkt";
    b.setAttribute("aria-pressed", merkModus);
    b.addEventListener("click", () => { merkModus = !merkModus; b.classList.toggle("an", merkModus); ansichtAktualisieren(); });
    leiste.appendChild(b);
  }
  tags.forEach(t => {
    const b = document.createElement("button");
    b.className = "tagchip" + (aktiveTags.has(t) ? " an" : "");
    b.textContent = (TAG_LABEL[t] || t) + " " + zaehl[t];
    b.setAttribute("aria-pressed", aktiveTags.has(t));
    b.setAttribute("aria-label", (TAG_LABEL[t] || t).replace(/^\S+\s/, "") + ": " + zaehl[t] + " Pins");
    b.addEventListener("click", () => {
      aktiveTags.has(t) ? aktiveTags.delete(t) : aktiveTags.add(t);
      b.classList.toggle("an", aktiveTags.has(t));               // Aktiv-Zustand direkt am Chip
      b.setAttribute("aria-pressed", aktiveTags.has(t));
      ansichtAktualisieren();
    });
    leiste.appendChild(b);
  });
  scrollHinweisPruefen();
}

  const marke = $("#klapp-marke");     // eingeklappt sichtbar machen, dass Filter greifen
  if(marke) marke.classList.toggle("da", filterAktiv());

/* ---------- Clustering ----------
   Bei 140+ Pins ist die Karte sonst ein Teppich aus Symbolen. Wir gruppieren nach
   Bildschirm-Pixeln (nicht nach Geografie): Was näher als eine Rasterzelle beieinander
   liegt, wird zu einem Kreis mit Anzahl. Beim Reinzoomen lösen sich die Cluster von
   selbst auf. Tippen zoomt auf die Gruppe. */
const clusterMarker = [];
const CLUSTER_RASTER = 58;        // Kantenlänge einer Zelle in Bildschirmpixeln
const CLUSTER_AB_ZOOM = 16;       // ab diesem Zoom immer alle Einzel-Pins zeigen

function clusterAufloesen(){
  clusterMarker.forEach(m => m.remove());
  clusterMarker.length = 0;
}

function clusternUndZeichnen(sichtbare){
  clusterAufloesen();
  // Nicht clustern, wenn ohnehin wenig zu sehen ist oder gezielt gefiltert wurde —
  // wer auf "🔥 Highlights" tippt, will alle sehen, nicht wieder eine Gruppe.
  if(map.getZoom() >= CLUSTER_AB_ZOOM || sichtbare.length <= 12 || nurHighlights){
    sichtbare.forEach(x => { x.el.style.display = "flex"; });
    return;
  }
  const zellen = new Map();
  sichtbare.forEach(x => {
    const pkt = map.project([x.p._lng ?? x.p.lng, x.p._lat ?? x.p.lat]);
    const key = Math.floor(pkt.x / CLUSTER_RASTER) + ":" + Math.floor(pkt.y / CLUSTER_RASTER);
    if(!zellen.has(key)) zellen.set(key, []);
    zellen.get(key).push(x);
  });
  zellen.forEach(gruppe => {
    if(gruppe.length === 1){ gruppe[0].el.style.display = "flex"; return; }

    // Highlights werden mitgeclustert (sonst überlagern sich ihre Glut-Ringe zu einem Klumpen);
    // der Cluster trägt den Ring stellvertretend und zeigt so, dass hier etwas Besonderes liegt.
    gruppe.forEach(x => { x.el.style.display = "none"; });
    const hotAnzahl = gruppe.filter(x => x.p.hot).length;
    const haeufigsterTyp = Object.entries(gruppe.reduce((acc, x) => {
      acc[x.p.typ] = (acc[x.p.typ] || 0) + 1; return acc;
    }, {})).sort((a,b) => b[1]-a[1])[0][0];
    const mitteLng = gruppe.reduce((s,x) => s + (x.p._lng ?? x.p.lng), 0) / gruppe.length;
    const mitteLat = gruppe.reduce((s,x) => s + (x.p._lat ?? x.p.lat), 0) / gruppe.length;

    const el = document.createElement("button");
    el.className = "cluster t-" + haeufigsterTyp + (gruppe.length >= 10 ? " gross" : "") +
      (hotAnzahl ? " hat-hot" : "");
    el.innerHTML = (hotAnzahl ? '<span class="c-flamme">🔥</span>' : "") + gruppe.length;
    el.setAttribute("aria-label", gruppe.length + " Pins hier" +
      (hotAnzahl ? ", davon " + hotAnzahl + " Highlight" + (hotAnzahl > 1 ? "s" : "") : "") +
      " — antippen zum Aufteilen");
    el.title = gruppe.slice(0, 4).map(x => (x.p.hot ? "🔥 " : "") + x.p.titel).join("\n") +
      (gruppe.length > 4 ? "\n…" : "");
    el.addEventListener("click", e => {
      e.stopPropagation();
      const b = new maplibregl.LngLatBounds();
      gruppe.forEach(x => b.extend([x.p._lng ?? x.p.lng, x.p._lat ?? x.p.lat]));
      // Zoomen hilft nur, wenn die Pins auch wirklich auseinanderliegen. Sind es viele
      // (typisch: eine Bühne mit ganzer Konzertreihe), ist die Liste der schnellere Weg.
      const spanne = Math.max(b.getEast()-b.getWest(), b.getNorth()-b.getSouth());
      if(spanne < 0.0006 || gruppe.length >= 6 || map.getZoom() >= CLUSTER_AB_ZOOM - 1)
        zeigeClusterListe(gruppe.map(x => x.p));
      else map.fitBounds(b, {padding:{top:110, bottom:250, left:50, right:50}, maxZoom:17.5, duration:600});
    });
    clusterMarker.push(new maplibregl.Marker({element:el}).setLngLat([mitteLng, mitteLat]).addTo(map));
  });
}

/* Cluster-Liste: Was steckt in dieser Gruppe? Nach Spielstätte gebündelt, denn genau das
   ist der Normalfall — eine Bühne mit ganzer Konzertreihe (Markt, Musikbunker, FRANZ).
   Innerhalb einer Spielstätte chronologisch, damit man den Spielplan liest, nicht ein Ranking. */
/* Der erste Teil der Meta-Zeile ist meist die Spielstätte ("Markt · 20:30 · frei").
   Manche Pins führen dort aber eine Zeitangabe ("vormittags", "samstags") — die ist kein Ort. */
const KEIN_ORT = /^(vormittags|nachmittags|abends|nachts|morgens|samstags|sonntags|montags|dienstags|mittwochs|donnerstags|freitags|täglich|taeglich|laufend|wöchentlich|woechentlich|kostenlos|frei|beispiel|ernte|selbstpflücke|selbstpfluecke|selber\b.*)/i;
function ortsName(p){
  const m = (p.meta || "").split("·")[0].trim();
  if(!m || /^\d/.test(m) || KEIN_ORT.test(m)) return "";
  return m;
}
function zeigeClusterListe(pins){
  const gruppen = new Map();
  pins.forEach(p => {
    const ort = ortsName(p) || "Weitere in der Nähe";
    if(!gruppen.has(ort)) gruppen.set(ort, []);
    gruppen.get(ort).push(p);
  });
  // Größte Gruppe zuerst; innerhalb der Gruppe nach Datum
  const sortiert = [...gruppen.entries()].sort((a,b) => b[1].length - a[1].length);
  const key = p => { const w = fenster(p); return w ? w.s.getTime() : 0; };
  const rumpf = sortiert.map(([ort, liste]) => {
    liste.sort((a,b) => key(a) - key(b) || relevanz(b) - relevanz(a));
    const kopf = sortiert.length > 1 || liste.length > 3
      ? '<div class="saison-kopf">'+esc(ort)+' · '+liste.length+'</div>' : "";
    return kopf + liste.map(p => listenZeile(p)).join("");
  }).join("");

  modalOeffnen(
    '<h2>' + pins.length + ' Pins an dieser Stelle</h2>'+
    '<p class="klein">'+(sortiert.length > 1 ? 'Nach Ort gebündelt. ' : '')+
    'Antippen öffnet den Pin auf der Karte.</p>'+ rumpf
  );
  blatt.querySelectorAll(".liste-zeile").forEach(z =>
    z.addEventListener("click", () => zumPin(PINS.find(x => x.id === z.dataset.id), true)));
}

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => { aktiv[chip.dataset.typ] = !aktiv[chip.dataset.typ]; ansichtAktualisieren(); });
});
document.querySelectorAll(".zchip").forEach(c => {
  c.addEventListener("click", () => {

/* Eigener Zeitraum (User-Test: "in bestimmten Zeiträumen auswählen") */
function zeitraumWaehlen(){
  const iso = d => d.toISOString().slice(0,10);
  const uhr = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  const von = eigenZeitraum ? iso(eigenZeitraum.von) : iso(new Date());
  const bisD = eigenZeitraum ? eigenZeitraum.bis : (() => { const x = new Date(); x.setDate(x.getDate()+7); return x; })();
  const vonZeit = eigenZeitraum && eigenZeitraum.mitZeit ? uhr(eigenZeitraum.von) : "00:00";
  const bisZeit = eigenZeitraum && eigenZeitraum.mitZeit ? uhr(eigenZeitraum.bis) : "23:59";
  modalOeffnen(
    '<h2>📅 Eigener Zeitraum</h2>'+
    '<p>Zeige nur Pins, die in diesem Zeitraum stattfinden:</p>'+
    '<div class="zeile"><span>Von</span><span class="zeit-feld">'+
      '<input type="time" id="zr-von-zeit" value="'+vonZeit+'" aria-label="Startzeit">'+
      '<input type="date" id="zr-von" value="'+von+'" aria-label="Startdatum"></span></div>'+
    '<div class="zeile"><span>Bis</span><span class="zeit-feld">'+
      '<input type="time" id="zr-bis-zeit" value="'+bisZeit+'" aria-label="Endzeit">'+
      '<input type="date" id="zr-bis" value="'+iso(bisD)+'" aria-label="Enddatum"></span></div>'+
    '<p class="klein">Uhrzeit ist optional — sie greift nur bei Pins mit Zeitangabe '+
    '(z. B. „20:30"). Ganztägige Einträge bleiben immer sichtbar.</p>'+
    '<div class="blatt-knoepfe">'+
      '<button class="bbtn gelb" id="zr-ok">Anwenden</button>'+
      '<button class="bbtn sek" id="zr-abend">Heute Abend</button>'+
      (zeit === "range" ? '<button class="bbtn sek" id="zr-weg">Zeitraum aufheben</button>' : '')+
    '</div>'
  );
  const anwenden = () => {
    const v = $("#zr-von").value, b = $("#zr-bis").value;
    if(!v || !b) return;
    const vz = $("#zr-von-zeit").value || "00:00", bz = $("#zr-bis-zeit").value || "23:59";
    const von2 = new Date(v+"T"+vz+":00"), bis2 = new Date(b+"T"+bz+":59");
    if(bis2 < von2) return;
    eigenZeitraum = {von:von2, bis:bis2, mitZeit: vz !== "00:00" || bz !== "23:59"};
    zeit = "range"; suchFenster = null;
    baueTagleiste(); ansichtAktualisieren(); modalSchliessen();
  };
  $("#zr-ok").addEventListener("click", anwenden);
  $("#zr-abend").addEventListener("click", () => {          // häufigster Fall: "was geht gleich?"
    const heute = new Date();
    $("#zr-von").value = iso(heute); $("#zr-bis").value = iso(heute);
    $("#zr-von-zeit").value = "17:00"; $("#zr-bis-zeit").value = "23:59";
    anwenden();
  });
  const weg = $("#zr-weg");
  if(weg) weg.addEventListener("click", () => {
    eigenZeitraum = null; zeit = "soon";
    baueTagleiste(); ansichtAktualisieren(); modalSchliessen();
  });
}

function entfernungText(p){
  if(!meinStandort) return "";
  const km = entfernungKm(p.lat, p.lng, meinStandort.lat, meinStandort.lng);
  return km < 1 ? Math.round(km * 1000) + " m" : km.toFixed(km < 10 ? 1 : 0) + " km";
}
function listenZeile(p, datumText){
  const sym = blipSymbol(p);
  const weg = entfernungText(p);

    '<span class="lz-mitte"><span class="lz-titel">'+esc(p.titel)+'</span>'+
    '<span class="lz-meta">'+esc([TYPNAME[p.typ], p.meta, weg].filter(Boolean).join(" · "))+'</span></span>'+
    '<span class="lz-datum">'+esc(datumText ?? fmtDatum(p))+'</span></button>';
}

let letzterListenTab = "heute";     // für den Rückweg aus dem Detail-Sheet

/* Wie interessant ist ein Pin gerade? Nähe schlägt Ferne, markierte Highlights schlagen alles.
   Damit lässt sich aus 140 Pins eine kurze, ehrliche "Was ist los?"-Liste bilden. */
function relevanz(p){
  const w = fenster(p);
  let punkte = 0;
  if(p.hot) punkte += 100;
  if(p.wdh && wdhAnTag(p.wdh, HEUTE0)) punkte += 55;
  if(w){
    const tage = Math.ceil((w.s - HEUTE0) / 864e5);
    const laeuft = w.s <= new Date(HEUTE0.getTime() + 864e5 - 1) && w.e >= HEUTE0;
    if(laeuft) punkte += 60;
    else if(tage === 1) punkte += 40;
    else if(tage <= 3) punkte += 28;
    else if(tage <= 7) punkte += 18;
    else if(tage <= 14) punkte += 8;
  }
  if(danke[p.id]) punkte += 12;
  if(istNeu(p)) punkte += 6;
  if(passtZuMir(p)) punkte += 14;
  if(p.beispiel) punkte -= 40;
  return punkte;
}
function laeuftHeute(p){
  if(p.wdh) return wdhAnTag(p.wdh, HEUTE0);
  const w = fenster(p);
  if(!w) return false;
  const heuteEnde = new Date(HEUTE0); heuteEnde.setHours(23,59,59);
  return w.s <= heuteEnde && w.e >= HEUTE0;
}

function zeigeListe(tab){
  const saisonPins = PINS.filter(p => p.saison);
  const tabs = '<div class="liste-tabs">'+
    '<button data-tab="heute" class="'+(tab==="heute"?"an":"")+'">🔥 Aktuell</button>'+
    '<button data-tab="ausschnitt" class="'+(tab==="ausschnitt"?"an":"")+'">📍 Auf der Karte</button>'+
    (saisonPins.length ? '<button data-tab="saison" class="'+(tab==="saison"?"an":"")+'">🍏 Saison</button>' : '')+
  '</div>';

  let kopf, rumpf;
  if(tab === "heute"){
    // Kategorie- und Themenfilter gelten weiter, der Zeitfilter bewusst nicht: hier zählt,
    // was jetzt und in den nächsten Tagen ansteht. Saisonale Dauerangebote (Ernte) würden
    // die Liste sonst zuschütten — die haben ihren eigenen Tab und stehen unten als Fußnote.
    const merkeZeit = zeit, merkeFenster = suchFenster;
    zeit = "all"; suchFenster = null;
    const alle = PINS.filter(p => sichtbar(p) && !p.beispiel);
    zeit = merkeZeit; suchFenster = merkeFenster;
    const termine = alle.filter(p => !p.saison);

    const heute = termine.filter(laeuftHeute).sort((a,b) => relevanz(b) - relevanz(a)).slice(0, 8);
    const heuteIds = new Set(heute.map(p => p.id));
    const kommend = termine.filter(p => !heuteIds.has(p.id))
      .map(p => ({p, w:fenster(p)}))
      .filter(x => x.w && x.w.s > HEUTE0)
      .sort((a,b) => (relevanz(b.p) - relevanz(a.p)) || (a.w.s - b.w.s))
      .slice(0, 8);

    const heuteName = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"][HEUTE0.getDay()];
    kopf = '<h2>🔥 Was ist los?</h2>'+
      '<p class="klein">Das Wichtigste zuerst, 🔥 = Highlight. Themen- und Kategoriefilter '+
      'von der Karte gelten auch hier.</p>';
    const block = (titel, liste, datumFn) => liste.length
      ? '<div class="saison-kopf">'+titel+'</div>' + liste.map(x => {
          const p = x.p || x;
          return listenZeile(p, datumFn ? datumFn(p) : undefined);
        }).join("")
      : "";
    // Fußnote statt Zeilenflut: Dauerangebote nur zählen und verlinken
    const spots = alle.filter(p => p.typ === "spot").length;
    const saisonAktiv = alle.filter(p => p.saison && saisonStatus(p).laeuft).length;
    const fuss = (spots || saisonAktiv)
      ? '<p class="klein" style="margin-top:14px">Dauerhaft auf der Karte: '+
        [saisonAktiv ? '<span class="vorschlag" data-tab="saison">'+saisonAktiv+' Ernteorte mit laufender Saison</span>' : '',
         spots ? spots + ' Fotospots' : ''].filter(Boolean).join(" · ") + '</p>'
      : "";
    rumpf = (block("Heute (" + heuteName + ")", heute, p => p.hot ? "🔥 jetzt" : "heute") +
      block("Als Nächstes", kommend) ||
      '<p>Zu diesen Filtern ist gerade nichts los — tippe oben auf ✕ Zurücksetzen.</p>') + fuss;
  } else if(tab === "saison"){
    // Laufende zuerst und davon das, was bald endet ("letzte Chance"); danach nach Startnähe
    const mitStatus = saisonPins.map(p => ({p, st:saisonStatus(p)}));
    const jetzt  = mitStatus.filter(x => x.st.laeuft).sort((a,b) => a.st.tageBisEnde - b.st.tageBisEnde);
    const kommend = mitStatus.filter(x => !x.st.laeuft).sort((a,b) => a.st.tageBisStart - b.st.tageBisStart);
    const bald   = kommend.filter(x => x.st.tageBisStart <= 45);
    const later  = kommend.filter(x => x.st.tageBisStart > 45);
    const block = (titel, liste, klasse) => liste.length
      ? '<div class="saison-kopf '+(klasse||"")+'">'+titel+'</div>'+
        liste.map(x => listenZeile(x.p, x.st.kurz)).join("")
      : "";
    kopf = '<h2>🍏 Saisonkalender</h2>'+
      '<p class="klein">Wilde Ernte und Selbstpflücke rund um Aachen — Zeiten sind witterungsabhängige '+
      'Richtwerte. Es gilt die Handstraußregel: nur kleine Mengen für den Eigenbedarf.</p>';
    rumpf = block("Jetzt Saison", jetzt) + block("Bald dran", bald) +
            block("Später im Jahr", later, "spaeter");
  } else {
    const imBild = PINS.filter(p => sichtbar(p) && imAusschnitt(p));
    const key = p => { const w = fenster(p); return w ? w.s.getTime() : 0; };
    const reihenfolge = {event:0, angebot:1, hilfe:2, spot:3};
    imBild.sort((a,b) => (reihenfolge[a.typ]-reihenfolge[b.typ]) || (key(a)-key(b)));
    kopf = '<h2>☰ '+imBild.length+' Pins im Kartenausschnitt</h2>'+
      '<p class="klein">Zeit-, Themen- und Kategorie-Filter wirken auch hier. Antippen springt zur Karte.</p>';
    rumpf = imBild.map(p => listenZeile(p)).join("") ||
      '<p>Nichts im aktuellen Ausschnitt — zoome raus oder ändere die Filter.</p>';
  }

  letzterListenTab = tab;
  modalOeffnen(kopf + tabs + rumpf);
  blatt.querySelectorAll(".liste-tabs button").forEach(b =>
    b.addEventListener("click", () => zeigeListe(b.dataset.tab)));
  blatt.querySelectorAll(".vorschlag[data-tab]").forEach(v =>
    v.addEventListener("click", () => zeigeListe(v.dataset.tab)));
  blatt.querySelectorAll(".liste-zeile").forEach(z =>
    z.addEventListener("click", () => zumPin(PINS.find(x => x.id === z.dataset.id), true)));
}

/* Von der Liste zum Pin — auf dem Handy ohne Kontextverlust: Liste zu, Karte hin, Details
   fahren unten ein, "Zurück zur Liste" bringt einen zurück. Am Desktop wie gehabt per Popup. */
function zumPin(p, ausListe){
  if(!p) return;
  modalSchliessen();
  const ziel = [p._lng ?? p.lng, p._lat ?? p.lat];
  if(istMobil()){
    map.flyTo({center:ziel, zoom:Math.max(map.getZoom(), CLUSTER_AB_ZOOM), duration:500});
    const mk = marker.find(x => x.p.id === p.id);
    setTimeout(() => { if(mk) mk.el.style.display = "flex"; sheetOeffnen(p, !!ausListe); }, 380);
    return;
  }
  map.flyTo({center:ziel, zoom:Math.max(map.getZoom(), CLUSTER_AB_ZOOM)});
  const mk = marker.find(x => x.p.id === p.id);
  if(mk) setTimeout(() => { mk.el.style.display = "flex"; if(!mk.m.getPopup().isOpen()) mk.m.togglePopup(); }, 600);
}

/* Saison-Status eines Pins: läuft gerade? wie lange noch / wie lange bis dahin? */
const MONAT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function saisonStatus(p){
  const w = fenster(p);
  if(!w) return {laeuft:false, tageBisStart:9999, tageBisEnde:9999, kurz:"", lang:""};
  const tag = 864e5;
  const bisStart = Math.ceil((w.s - HEUTE0) / tag);
  const bisEnde  = Math.ceil((w.e - HEUTE0) / tag);
  const spanne = MONAT[w.s.getMonth()] + "–" + MONAT[w.e.getMonth()];
  if(bisStart <= 0 && bisEnde >= 0){
    const kurz = bisEnde === 0 ? "letzter Tag" : "noch " + bisEnde + " T";
    return {laeuft:true, tageBisStart:0, tageBisEnde:bisEnde, kurz,
      lang:"🍏 Jetzt Saison — " + kurz + " (" + spanne + ")"};
  }
  const kurz = bisStart <= 45 ? "in " + bisStart + " T" : spanne;
  return {laeuft:false, tageBisStart:bisStart, tageBisEnde:bisEnde,
    kurz, lang:"🍏 Saison startet in " + bisStart + " Tagen (" + spanne + ")"};
}

/* Rückmeldung zu Suche UND Filtern: Wie viele Treffer? Und wenn nichts passt: Warum, und was
   hilft? Der häufigste Fall im Alltag: "Musik" + "Heute" ist leer, obwohl übermorgen ein Konzert
   ist — dann nennen wir das nächste Datum, statt den Nutzer vor einer leeren Karte sitzen zu lassen. */
function naechsterTermin(){
  const merkeZeit = zeit, merkeFenster = suchFenster;
  zeit = "all"; suchFenster = null;
  const kommend = PINS.filter(p => sichtbar(p) && fenster(p))
    .map(p => ({p, w:fenster(p)}))
    .filter(x => x.w.e >= HEUTE0)
    .sort((a,b) => a.w.s - b.w.s);
  const gesamt = PINS.filter(sichtbar).length;
  zeit = merkeZeit; suchFenster = merkeFenster;
  return {naechster: kommend[0] || null, gesamt};
}
function suchInfoAktualisieren(){
  const box = $("#such-info");
  if(!box) return;
  const suchtAktiv = suchTerme.length || suchFenster;
  const sucheOffen = $("#suchleiste").classList.contains("offen");
  const filterAn = aktiveTags.size > 0 || merkModus || zeit === "range" ||
    !aktiv.event || !aktiv.angebot || !aktiv.hilfe || !aktiv.spot;
  // Anzeigen bei aktiver Suche — oder wenn ein Filter gesetzt ist und nichts übrig bleibt
  const treffer = PINS.filter(sichtbar).length;
  if(!(suchtAktiv && sucheOffen) && !(filterAn && treffer === 0)){ box.classList.remove("da"); return; }

  if(treffer){
    const imBild = PINS.filter(p => sichtbar(p) && imAusschnitt(p)).length;
    box.innerHTML = "<b>" + treffer + " Treffer</b>" +
      (imBild < treffer ? " · " + imBild + " im Ausschnitt — <span class='vorschlag' data-akt='zoom'>alle zeigen</span>" : "");
  } else {
    const {naechster, gesamt} = naechsterTermin();
    if(naechster){
      const tage = Math.ceil((naechster.w.s - HEUTE0) / 864e5);
      const wann = tage <= 0 ? "läuft gerade" : tage === 1 ? "schon morgen" : "in " + tage + " Tagen";
      box.innerHTML = "Im gewählten Zeitraum nichts — der nächste Termin ist <b>" + wann + "</b>: " +
        esc(naechster.p.titel.slice(0, 34)) + " (" + esc(fmtDatum(naechster.p)) + ") " +
        "<span class='vorschlag' data-akt='naechster' data-id='" + esc(naechster.p.id) + "'>anzeigen</span>";
    } else if(gesamt){
      box.innerHTML = "Keine Treffer im gewählten Zeitraum — aber <b>" + gesamt + "</b> insgesamt. " +
        "<span class='vorschlag' data-akt='alle'>Zeitraum auf „Alle“</span>";
    } else {
      box.innerHTML = "Nichts gefunden. Versuch es z. B. mit <span class='vorschlag' data-akt='bsp' data-q='konzert'>Konzert</span>, " +
        "<span class='vorschlag' data-akt='bsp' data-q='flohmarkt'>Flohmarkt</span> oder " +
        "<span class='vorschlag' data-akt='bsp' data-q='ernte'>Ernte</span>.";
    }
  }
  box.classList.add("da");
}
$("#such-info").addEventListener("click", e => {
