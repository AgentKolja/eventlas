    '</div>'+
    (KOMMENTARE_AN()
      ? '<div class="komm-neu">'+
          '<textarea class="komm-feld" data-id="'+esc(p.id)+'" rows="2" maxlength="600" '+
            'placeholder="Warst du da? Schreib den anderen, wie es war."></textarea>'+
          '<div class="komm-zeile">'+
            '<input class="komm-name" type="text" maxlength="40" placeholder="Dein Name (optional)" '+
              'value="'+esc(lsGet("kommName",""))+'">'+
            '<button class="komm-senden" data-id="'+esc(p.id)+'">Senden</button>'+
          '</div>'+
        '</div>'
      : '<p class="klein">Das Gespräch wird gerade eingerichtet. Bis dahin gern per '+
        '<a href="mailto:'+esc(KONFIG.mail)+'?subject='+encodeURIComponent("Tipp: "+p.titel)+'" style="color:var(--hilfe)">E-Mail</a>.</p>')+
    '<div class="p-beitragen">'+
      '<button class="bei-foto" data-id="'+esc(p.id)+'">📷 Foto beisteuern</button>'+
    '</div></div>';
}

/* Beiträge nachladen und in das Gerüst einsetzen */
async function kommentareEinsetzen(pinId){
  const box = document.querySelector('.komm-liste[data-fuer="'+CSS.escape(pinId)+'"]');
  if(!box || !KOMMENTARE_AN()) return;
  const daten = await kommentareLaden(pinId);
  if(!document.body.contains(box)) return;        // Detail wurde zwischenzeitlich geschlossen
  if(daten === null){
    box.innerHTML = '<div class="komm-hinweis">Beiträge konnten nicht geladen werden. '+
      '<button class="komm-neuladen" data-id="'+esc(pinId)+'">Erneut versuchen</button></div>';
    return;
  }
  if(!daten.length){
    box.innerHTML = '<div class="komm-hinweis">Noch keine Beiträge — schreib den ersten.</div>';
    return;
  }
  box.innerHTML = daten.map(k => kommentarHTML(k)).join("");
}
function kommentarHTML(k){
  const eigen = !!meineBeitraege[k.id];
  return '<div class="komm" data-kid="'+esc(k.id)+'">'+
    '<div class="komm-kopf"><b>'+esc(k.name || "Anonym")+'</b>'+
    '<span class="komm-zeit">'+esc(vorZeit(k.erstellt))+'</span></div>'+
    '<div class="komm-text">'+esc(k.text)+'</div>'+
    '<div class="komm-aktion">'+
      (eigen
        ? '<button class="komm-weg" data-kid="'+esc(k.id)+'">löschen</button>'
        : '<button class="komm-melden" data-kid="'+esc(k.id)+'">melden</button>')+
    '</div></div>';
}
function fmtKurzDatum(iso){
  const d = new Date(iso + "T00:00:00");
  return isNaN(d) ? iso : d.getDate() + "." + (d.getMonth()+1) + ".";
}

function popupHTML(p){
  const meta = [fmtDatum(p), p.meta].filter(Boolean).join(" · ");
  const gold = p.typ === "spot" ? '<div class="p-gold">'+esc(goldeneStundeText(p))+'</div>'
             : p.saison ? '<div class="p-gold">'+esc(saisonStatus(p).lang)+'</div>' : "";
  const wetterInfo = wetterZeile(p);
  const route = "https://www.google.com/maps/dir/?api=1&destination=" + p.lat + "," + p.lng;
  const gedankt = danke[p.id];
  let quelle = "";
  if(urlOk(p.quelle)){
    let host = p.quelle; try{ host = new URL(p.quelle).hostname.replace(/^www\./,""); }catch(e){}
    quelle = '<div class="p-quelle">Quelle: <a href="'+esc(p.quelle)+'" target="_blank" rel="noopener">'+esc(host)+'</a></div>';
  }
  const gemerkt = merk[p.id];
  /* Aktionen mit klarer Rangfolge statt sechs gleichrangiger Knöpfe: Was der Nutzer als
     Nächstes tun will, steht breit oben — bei Veranstaltungen mit Link die Detailseite
     (dort gibt es Tickets), sonst die Route. Alles Weitere kompakt darunter. */
  /* Der Knopf sagt, wohin er führt. Ein Ticketshop bekommt das Ticket-Symbol und den Preis
     direkt daneben — das sind die zwei Fragen vor jedem Konzertbesuch. Bei allem anderen
     bleibt es beim neutralen "Mehr dazu", sonst verspricht der Knopf Karten, wo keine sind. */
  const preis = preisText(p);
  const kostenlos = /kostenlos|frei/i.test(preis);
  const preisSchild = preis
    ? '<span class="p-preis'+(kostenlos ? " frei" : "")+'">'+esc(kostenlos ? "kostenlos" : preis)+'</span>'
    : "";
  const primaer = urlOk(p.link)
    ? '<a class="p-haupt" href="'+esc(p.link)+'" target="_blank" rel="noopener">'+
        (istTicketLink(p.link) ? '🎟 Tickets kaufen' : 'Mehr dazu') + ' ↗' + preisSchild + '</a>'
    : '<a class="p-haupt" href="'+esc(route)+'" target="_blank" rel="noopener">📍 Route dorthin'+preisSchild+'</a>';
  // Blätter-Leiste wie in Immobilienportalen: Treffer der Reihe nach durchgehen,
  // ohne jedes Mal zur Karte zurückzumüssen.
  const liste = blaetterListe(p);
  const idx = liste.findIndex(x => x.id === p.id);
  const nav = liste.length > 1 && idx >= 0
    ? '<div class="p-nav">'+
        '<button class="p-vor" data-i="'+(idx-1)+'"'+(idx <= 0 ? ' disabled' : '')+' aria-label="Vorheriger Pin">‹</button>'+
        '<span class="zaehler">'+(idx+1)+' von '+liste.length+'</span>'+
        '<button class="p-zurueck" data-i="'+(idx+1)+'"'+(idx >= liste.length-1 ? ' disabled' : '')+' aria-label="Nächster Pin">›</button>'+
      '</div>'
    : "";
  return nav + '<div class="p-typ '+esc(p.typ)+'">'+ICON[p.typ]+TYPNAME[p.typ]+(p.hot ? '<span class="p-hot">🔥 Highlight</span>' : '')+'</div>'+
    '<div class="p-titel">'+esc(p.titel)+'</div>'+
    '<div class="p-text">'+esc(p.text)+'</div>'+
    (meta ? '<div class="p-meta">'+esc(meta)+'</div>' : "")+ gold + wetterInfo +
    bildBlock(p) + ortsZeile(p) + primaer +
    '<div class="p-akt">'+
      (urlOk(p.link) ? '<a class="p-btn sek" href="'+esc(route)+'" target="_blank" rel="noopener">📍 Route</a>' : "")+
      '<button class="p-btn sek p-danke'+(gedankt?' aktivgruen':'')+'" data-id="'+esc(p.id)+'">👍 '+(gedankt?"Danke ✓":"Danke")+'</button>'+
      '<button class="p-btn sek p-merk'+(gemerkt?' aktivgruen':'')+'" data-id="'+esc(p.id)+'">★ '+(gemerkt?"Gemerkt ✓":"Merken")+'</button>'+
      '<button class="p-btn sek p-teilen" data-id="'+esc(p.id)+'">↗ Teilen</button>'+
      (p.start ? '<button class="p-btn sek p-ics" data-id="'+esc(p.id)+'">📅 Kalender</button>' : "")+
    '</div>'+ bestaetigungsBlock(p) + tippBlock(p) + quelle;
}

/* Kopfzeile und HUD liegen als Overlay über der Karte — MapLibre weiß davon nichts und
   öffnet Popups gern genau darunter. Nach dem Öffnen prüfen wir die tatsächliche Lage und
   schieben die Karte nur so weit, dass das Popup frei steht. */
function popupInsBild(m){
  setTimeout(() => {
    const pop = m.getPopup && m.getPopup();
    if(!pop || !pop.isOpen()) return;
    const el = pop.getElement();
    if(!el) return;
    const box = el.getBoundingClientRect();
    const hud = document.querySelector(".hud").getBoundingClientRect();
    const kopfUnten = document.querySelector("header").getBoundingClientRect().bottom;
    const rand = 10;
    let dx = 0, dy = 0;
    if(box.bottom > hud.top - rand) dy = box.bottom - (hud.top - rand);   // vom HUD wegschieben
    if(box.top - dy < kopfUnten + rand) dy = box.top - (kopfUnten + rand); // aber nicht unter die Kopfzeile
    if(box.right > innerWidth - rand) dx = box.right - (innerWidth - rand);
    if(box.left - dx < rand) dx = box.left - rand;
    if(dx || dy) map.panBy([dx, dy], {duration:280});
  }, 60);   // Popup braucht einen Frame, bis es gemessen werden kann
}

/* Inhalt der Hover-Karte: so viel, dass man ohne Klick entscheiden kann, ob es sich lohnt —
   Kategorie, Titel, Wann/Wo, ein Satz Beschreibung und Hinweise wie „gratis" oder Entfernung. */
function hoverInhalt(p){
  const wannWo = [fmtDatum(p), p.meta].filter(Boolean).join(" · ");
  const satz = String(p.text || "").split(/(?<=[.!?])\s/)[0];   // erster Satz reicht
  const marken = [];
  if(p.hot) marken.push("🔥 Highlight");
  if(/kostenlos|gratis|eintritt frei|\bfrei\b/i.test((p.meta||"") + " " + (p.text||""))) marken.push("gratis");
  if(p.saison){ const st = saisonStatus(p); if(st.laeuft) marken.push("jetzt Saison"); }
  const weg = entfernungText(p);
  if(weg) marken.push(weg + " entfernt");
  return '<b>' + esc(p.titel) + '</b>' +
    (wannWo ? '<small>' + esc(wannWo) + '</small>' : '') +
    (satz ? '<em>' + esc(satz.length > 95 ? satz.slice(0, 92) + "…" : satz) + '</em>' : '') +
    (marken.length ? '<i>' + esc(marken.join(" · ")) + '</i>' : '');
}

/* ---------- Detail-Sheet: auf Mobil ersetzt es das Karten-Popup ---------- */
const istMobil = () => window.matchMedia("(max-width: 699px)").matches;
let sheetPin = null;          // welcher Pin steckt gerade im Sheet
let sheetAusListe = false;    // kam der Nutzer aus der Liste? → Rückweg anbieten

function sheetOeffnen(p, ausListe){
  const wechsel = $("#sheet").classList.contains("offen");   // Durchblättern ≠ neu öffnen
  sheetPin = p;
  if(ausListe !== undefined) sheetAusListe = ausListe;
  const inhalt = $("#sheet-inhalt");
  inhalt.innerHTML = (sheetAusListe
      ? '<button class="sheet-zurueck" id="sheet-zur-liste">‹ Zurück zur Liste</button>' : '') +
    popupHTML(p);
  $("#sheet").classList.add("offen");
  $("#sheet").setAttribute("aria-hidden", "false");
  const zur = $("#sheet-zur-liste");
  if(zur) zur.addEventListener("click", () => { sheetSchliessen(); zeigeListe(letzterListenTab); });
  kommentareEinsetzen(p.id);
  lernen(p);
  pinFreihalten(p);
  ansichtAktualisieren();
  if(!wechsel) overlayAnmelden(() => sheetSchliessen(true));
}
function sheetSchliessen(vonZurueck){
  if(!$("#sheet").classList.contains("offen")) return;
  const kamAusListe = sheetAusListe;
  $("#sheet").classList.remove("offen");
  $("#sheet").setAttribute("aria-hidden", "true");
  sheetPin = null; sheetAusListe = false;
  blaetterKontextLoeschen();
  if(!vonZurueck) overlayAbmelden();
  // Wer aus der Liste kam, will mit der Zurück-Geste dorthin zurück — nicht auf die
  // nackte Karte. Beim Zuwischen des Sheets dagegen ist die Karte gemeint.
  else if(kamAusListe) zeigeListe(letzterListenTab);
}
/* Karte so verschieben, dass der gewählte Pin über dem Sheet sichtbar bleibt */
function pinFreihalten(p){
  setTimeout(() => {
    const sheet = $("#sheet").getBoundingClientRect();
    const pkt = map.project([p._lng ?? p.lng, p._lat ?? p.lat]);
    const kopfUnten = document.querySelector("header").getBoundingClientRect().bottom;
    const obergrenze = kopfUnten + 40, untergrenze = sheet.top - 30;
    if(pkt.y > untergrenze) map.panBy([0, pkt.y - untergrenze + 40], {duration:300});
    else if(pkt.y < obergrenze) map.panBy([0, pkt.y - obergrenze], {duration:300});
  }, 40);
}
$("#sheet-griff").addEventListener("click", sheetSchliessen);

/* Wischgesten: nach unten schließen, seitlich blättern — wie in Karten-Apps üblich */
(() => {
  const sheet = $("#sheet");
  let startY = 0, startX = 0, dy = 0, dx = 0, aktiv = false;
  sheet.addEventListener("touchstart", e => {
    if($("#sheet-inhalt").scrollTop > 0) return;      // erst scrollen, dann ziehen
    aktiv = true; startY = e.touches[0].clientY; startX = e.touches[0].clientX; dy = dx = 0;
    sheet.style.transition = "none";
  }, {passive:true});
  sheet.addEventListener("touchmove", e => {
    if(!aktiv) return;
    dy = e.touches[0].clientY - startY;
    dx = e.touches[0].clientX - startX;
    if(dy > 0) sheet.style.transform = "translateY(" + dy + "px)";
  }, {passive:true});
  sheet.addEventListener("touchend", () => {
    if(!aktiv) return;
    aktiv = false;
    sheet.style.transition = "";
    sheet.style.transform = "";
    if(dy > 90) { sheetSchliessen(); return; }
    if(Math.abs(dx) > 70 && Math.abs(dy) < 40 && sheetPin){   // seitlich blättern
      const liste = blaetterListe(sheetPin);
      const i = liste.findIndex(x => x.id === sheetPin.id);
      const ziel = dx < 0 ? i + 1 : i - 1;
      if(ziel >= 0 && ziel < liste.length) sheetOeffnen(liste[ziel]);
    }
  });
})();

/* ---------- Marker ---------- */
/* Pins auf (fast) identischer Koordinate kreisförmig auffächern, damit jeder antippbar
   bleibt — z. B. Katschhof und Elisenbrunnen, wo mehrere Pins übereinanderliegen.
   Der Versatz ist bewusst winzig (~12 m) und wird nur zur Darstellung benutzt. */
function faecherAuf(pins){
  const gruppen = new Map();
  pins.forEach(p => {
    const key = p.lng.toFixed(3) + "," + p.lat.toFixed(3);   // ~100-m-Raster
    (gruppen.get(key) || gruppen.set(key, []).get(key)).push(p);
  });
  gruppen.forEach(gruppe => {
    if(gruppe.length < 2) { gruppe.forEach(p => { p._lng = p.lng; p._lat = p.lat; }); return; }
    const r = 0.00011 * Math.min(2.2, 1 + gruppe.length * 0.16);   // wächst leicht mit der Anzahl
    gruppe.forEach((p, i) => {
      const w = (i / gruppe.length) * 2 * Math.PI - Math.PI / 2;
      p._lng = p.lng + (r * Math.cos(w)) / Math.cos(p.lat * Math.PI / 180);
      p._lat = p.lat + r * Math.sin(w);
    });
  });
}

function baueMarker(){
  marker.forEach(x => x.m.remove());
  marker.length = 0;
  clusterAufloesen();
  faecherAuf(PINS);
  PINS.forEach(p => {
    const el = document.createElement("button");
    el.className = "blip t-"+p.typ + (p.hot ? " hot" : "") + (istNeu(p) ? " frisch" : "");
    const sym = blipSymbol(p);
    el.innerHTML = '<span class="form"></span>' +
      (sym ? '<span class="emo">'+sym+'</span>' : ICON[p.typ]) +
      '<span class="tip">' + hoverInhalt(p) + '</span>';
    el.addEventListener("click", () => lernen(p));
    // Tooltip nach unten klappen, wenn oben kein Platz ist
    el.addEventListener("mouseenter", () => {
      el.classList.toggle("tip-unten", el.getBoundingClientRect().top < 190);
    });
    const m = new maplibregl.Marker({element:el})
      .setLngLat([p._lng ?? p.lng, p._lat ?? p.lat])
      .setPopup(new maplibregl.Popup({offset:22, maxWidth:"270px"}).setHTML(popupHTML(p)))
      .addTo(map);
    // Auf dem Handy übernimmt das Sheet — Popup gar nicht erst öffnen lassen
    el.addEventListener("click", ev => {
      if(!istMobil()) return;
      ev.stopPropagation();
      if(m.getPopup().isOpen()) m.togglePopup();
      sheetOeffnen(p, false);
    }, true);
    // Inhalt bei jedem Öffnen neu bauen: Zähler ("3 von 17"), Danke-Status und
     // Goldene Stunde hängen vom aktuellen Zustand ab, nicht vom Zeitpunkt des Aufbaus.
    m.getPopup().on("open", () => {
      m.getPopup().setHTML(popupHTML(p));
      popupInsBild(m);
      kommentareEinsetzen(p.id);
    });
    m.getPopup().on("close", () => setTimeout(() => {
      // Kein Popup mehr offen → Blätter-Kontext freigeben, damit er beim nächsten Mal frisch ist
      if(!marker.some(x => x.m.getPopup() && x.m.getPopup().isOpen())) blaetterKontextLoeschen();
    }, 30));
    el.setAttribute("aria-label", TYPNAME[p.typ]+": "+p.titel);  // nach addTo — MapLibre überschreibt es sonst
    marker.push({p, m, el});
  });
}

/* ---------- Tag-Leiste (Roadmap Nr. 7 + V2 "Für dich") ---------- */
/* Themen, nach denen Leute aktiv suchen — die stehen vorn, auch wenn es (noch) wenige Pins
   gibt. Sonst rutscht z. B. "Musik" hinter 20 Ernte-Pins und wirkt, als gäbe es keine Konzerte. */
const TAG_PRIO = ["musik", "kultur", "fest", "markt", "sport", "familie", "natur"];
function baueTagleiste(){
  const zaehl = {};
  PINS.forEach(p => { if(zeitOk(p)) p.tags.forEach(t => zaehl[t] = (zaehl[t]||0)+1); });
  const vorhanden = Object.keys(zaehl);
  const wichtig = TAG_PRIO.filter(t => zaehl[t]);
  const rest = vorhanden.filter(t => !wichtig.includes(t)).sort((a,b) => zaehl[b]-zaehl[a]);
  const tags = [...wichtig, ...rest].slice(0, 14);
  const leiste = $("#tagleiste");
  leiste.innerHTML = "";
  const reset = document.createElement("button");                 // Auswahl aufheben (User-Test)
  reset.className = "tagchip reset"; reset.id = "filter-reset";
  reset.textContent = "✕ Zurücksetzen";
  reset.addEventListener("click", filterZuruecksetzen);
  leiste.appendChild(reset);

  // Highlights zuerst: der schnellste Weg zu "was lohnt sich gerade wirklich?"
  const hotAnzahl = PINS.filter(p => p.hot && zeitOk(p)).length;
  if(hotAnzahl){
    const h = document.createElement("button");
    h.className = "tagchip highlight" + (nurHighlights ? " an" : "");
    h.id = "chip-highlights";
    h.textContent = "🔥 Highlights " + hotAnzahl;
    h.setAttribute("aria-pressed", nurHighlights);
    h.addEventListener("click", () => {
      nurHighlights = !nurHighlights;
      h.classList.toggle("an", nurHighlights);
      h.setAttribute("aria-pressed", nurHighlights);
      ansichtAktualisieren();
      if(nurHighlights) alleTrefferZeigen();      // alle Highlights ins Bild holen
    });
    leiste.appendChild(h);
  }
  if(profil){
    const b = document.createElement("button");
    b.className = "tagchip fuerdich" + (fuerDich ? " an" : "");
    b.textContent = "✦ Für dich";
    b.setAttribute("aria-pressed", fuerDich);
    b.addEventListener("click", () => { fuerDich = !fuerDich; ansichtAktualisieren(); });
    leiste.appendChild(b);
  }
  if(Object.keys(merk).length){
    const b = document.createElement("button");
    b.className = "tagchip" + (merkModus ? " an" : "");
    b.textContent = "★ Gemerkt";
    b.setAttribute("aria-pressed", merkModus);
    b.addEventListener("click", () => { merkModus = !merkModus; b.classList.toggle("an", merkModus); ansichtAktualisieren(); });
    leiste.appendChild(b);
  }
  tags.forEach(t => {
    const b = document.createElement("button");
    b.className = "tagchip" + (aktiveTags.has(t) ? " an" : "");
    b.textContent = (TAG_LABEL[t] || t) + " " + zaehl[t];
    b.setAttribute("aria-pressed", aktiveTags.has(t));
    b.setAttribute("aria-label", (TAG_LABEL[t] || t).replace(/^\S+\s/, "") + ": " + zaehl[t] + " Pins");
    b.addEventListener("click", () => {
      aktiveTags.has(t) ? aktiveTags.delete(t) : aktiveTags.add(t);
      b.classList.toggle("an", aktiveTags.has(t));               // Aktiv-Zustand direkt am Chip
      b.setAttribute("aria-pressed", aktiveTags.has(t));
      ansichtAktualisieren();
    });
    leiste.appendChild(b);
  });
  scrollHinweisPruefen();
}
/* Zeigt den Verlauf nur, wenn rechts wirklich noch Chips warten */
function scrollHinweisPruefen(){
  const l = $("#tagleiste"), w = $("#tags-wrap");
  if(!l || !w) return;
  w.classList.toggle("mehr", l.scrollWidth - l.scrollLeft - l.clientWidth > 12);
}

function filterAktiv(){
  return aktiveTags.size > 0 || fuerDich || merkModus || nurHighlights || suchTerme.length > 0 ||
    !!suchFenster || zeit === "range";
}
function filterZuruecksetzen(){
  aktiveTags.clear(); fuerDich = false; merkModus = false; nurHighlights = false; eigenZeitraum = null;
  zeit = "soon";
  $("#sucheingabe").value = ""; parseSuche("");
  $("#suchleiste").classList.remove("offen"); $("#btn-suche").classList.remove("an");

/* ---------- Ansicht (Roadmap Nr. 12: offene Popups schließen, wenn rausgefiltert;
   Nr. 16: Zähler beziehen sich auf den sichtbaren Kartenausschnitt) ---------- */
function ansichtAktualisieren(){
  const meine = profilTags();
  document.querySelectorAll(".zchip").forEach(c => {
    c.classList.toggle("an", c.dataset.z === zeit && !suchFenster);
    c.setAttribute("aria-pressed", c.dataset.z === zeit);
  });
  const zr = $("#zr-chip");
  if(zr){
    const f = d => d.getDate() + "." + (d.getMonth()+1) + ".";
    const u = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    if(zeit === "range" && eigenZeitraum){
      const einTag = eigenZeitraum.von.toDateString() === eigenZeitraum.bis.toDateString();
      zr.textContent = "📅 " + (einTag
        ? f(eigenZeitraum.von) + (eigenZeitraum.mitZeit ? " " + u(eigenZeitraum.von) + "–" + u(eigenZeitraum.bis) : "")
        : f(eigenZeitraum.von) + "–" + f(eigenZeitraum.bis));
    } else zr.textContent = "📅 Zeitraum";
  }
  const rst = $("#filter-reset");
  if(rst) rst.classList.toggle("da", filterAktiv());
  const marke = $("#klapp-marke");     // eingeklappt sichtbar machen, dass Filter greifen
  if(marke) marke.classList.toggle("da", filterAktiv());
  const hc = $("#chip-highlights");
  if(hc) hc.classList.toggle("an", nurHighlights);
  const lz = $("#liste-zahl");
  if(lz){
    const n = PINS.filter(p => sichtbar(p) && imAusschnitt(p)).length;
    lz.textContent = n ? "Liste " + n : "Liste";
  }
  suchInfoAktualisieren();
  document.querySelectorAll("#tagleiste .tagchip").forEach(c => {
    if(c.classList.contains("fuerdich")){ c.classList.toggle("an", fuerDich); return; }
  });
  // Trefferliste nur verwerfen, wenn gerade niemand darin blättert (sonst würde jede
  // Kartenbewegung beim Durchklicken die Reihenfolge zerreißen).
  if(!marker.some(x => x.m.getPopup() && x.m.getPopup().isOpen())) blaetterKontextLoeschen();
  const zuZeigen = [];
  marker.forEach(x => {
    const zeigen = sichtbar(x.p);
    x.el.style.display = "none";                                   // Cluster entscheidet gleich
    if(!zeigen && x.m.getPopup() && x.m.getPopup().isOpen()) x.m.togglePopup();  // Nr. 12
    if(zeigen) zuZeigen.push(x);
    if(zeigen && fuerDich){
      const passt = passtZuMir(x.p);
      x.el.classList.toggle("passt", passt);
      x.el.classList.toggle("gedimmt", !passt);
    } else {
      x.el.classList.remove("passt","gedimmt");
    }
  });
  // Offenes Popup gewinnt: sein Marker darf nie in einem Cluster verschwinden
  const offen = zuZeigen.find(x => x.m.getPopup() && x.m.getPopup().isOpen());
  clusternUndZeichnen(zuZeigen);
  if(offen) offen.el.style.display = "flex";
}
map.on("moveend", ansichtAktualisieren);

/* ---------- Clustering ----------
   Bei 140+ Pins ist die Karte sonst ein Teppich aus Symbolen. Wir gruppieren nach
   Bildschirm-Pixeln (nicht nach Geografie): Was näher als eine Rasterzelle beieinander
   liegt, wird zu einem Kreis mit Anzahl. Beim Reinzoomen lösen sich die Cluster von
   selbst auf. Tippen zoomt auf die Gruppe. */
const clusterMarker = [];
/* Zellgröße nach Bildschirmbreite: Auf einem 375 px breiten Handy liegt bei gleichem Zoom
   alles enger beieinander als auf einem 1400-px-Monitor, und der Daumen ist ungenauer als
   ein Mauszeiger. Mit fester Zellgröße blieb auf dem Handy ein Symbolteppich stehen. */
function clusterRaster(){
  const b = window.innerWidth;
  return b < 420 ? 76 : b < 700 ? 66 : 58;
}
const CLUSTER_AB_ZOOM = 16;       // ab diesem Zoom immer alle Einzel-Pins zeigen

function clusterAufloesen(){
  clusterMarker.forEach(m => m.remove());
  clusterMarker.length = 0;
}

function clusternUndZeichnen(sichtbare){
  clusterAufloesen();
  // Nicht clustern, wenn ohnehin wenig zu sehen ist oder gezielt gefiltert wurde —
  // wer auf "🔥 Highlights" tippt, will alle sehen, nicht wieder eine Gruppe.
  /* Pins am GLEICHEN Ort werden immer gebündelt, auch beim tiefsten Zoom und bei aktivem
     Highlight-Filter. Zwanzig Konzerte desselben Hauses nebeneinanderzulegen hilft niemandem:
     Sie überdecken sich, tragen alle dieselbe Adresse, und man muss jeden einzeln antippen,
     um zu sehen, was gespielt wird. Als ein Kreis mit Anzahl führt ein Tipp zur Liste. */
  const amSelbenOrt = new Map();
  sichtbare.forEach(x => {
    const k = (x.p.lat).toFixed(4) + "," + (x.p.lng).toFixed(4);   // ~11 m
    if(!amSelbenOrt.has(k)) amSelbenOrt.set(k, []);
    amSelbenOrt.get(k).push(x);
  });
  const ortsGruppen = [...amSelbenOrt.values()].filter(g => g.length > 1);
  const inOrtsGruppe = new Set(ortsGruppen.flat());

  if(map.getZoom() >= CLUSTER_AB_ZOOM || sichtbare.length <= 12 || nurHighlights){
    sichtbare.forEach(x => { x.el.style.display = inOrtsGruppe.has(x) ? "none" : "flex"; });
    ortsGruppen.forEach(zeichneCluster);
    return;
  }
  const raster = clusterRaster();
  const zellen = new Map();
  sichtbare.forEach(x => {
    if(inOrtsGruppe.has(x)) return;                 // steckt schon in einer Ortsgruppe
    const pkt = map.project([x.p._lng ?? x.p.lng, x.p._lat ?? x.p.lat]);
    const key = Math.floor(pkt.x / raster) + ":" + Math.floor(pkt.y / raster);
    if(!zellen.has(key)) zellen.set(key, []);
    zellen.get(key).push(x);
  });
  zellen.forEach(gruppe => {
    if(gruppe.length === 1){ gruppe[0].el.style.display = "flex"; return; }
    zeichneCluster(gruppe);
  });
}

function zeichneCluster(gruppe){
  // Highlights werden mitgeclustert (sonst überlagern sich ihre Glut-Ringe zu einem Klumpen);
  // der Cluster trägt den Ring stellvertretend und zeigt so, dass hier etwas Besonderes liegt.
  gruppe.forEach(x => { x.el.style.display = "none"; });
  const hotAnzahl = gruppe.filter(x => x.p.hot).length;
  const haeufigsterTyp = Object.entries(gruppe.reduce((acc, x) => {
    acc[x.p.typ] = (acc[x.p.typ] || 0) + 1; return acc;
  }, {})).sort((a,b) => b[1]-a[1])[0][0];
  const mitteLng = gruppe.reduce((s,x) => s + (x.p._lng ?? x.p.lng), 0) / gruppe.length;
  const mitteLat = gruppe.reduce((s,x) => s + (x.p._lat ?? x.p.lat), 0) / gruppe.length;
  // Alles am selben Fleck? Dann ist Zoomen sinnlos — der Klick geht direkt in die Liste.
  const b = new maplibregl.LngLatBounds();
  gruppe.forEach(x => b.extend([x.p._lng ?? x.p.lng, x.p._lat ?? x.p.lat]));
  const spanne = Math.max(b.getEast()-b.getWest(), b.getNorth()-b.getSouth());
  const einOrt = spanne < 0.0006;

  const el = document.createElement("button");
  el.className = "cluster t-" + haeufigsterTyp + (gruppe.length >= 10 ? " gross" : "") +
    (hotAnzahl ? " hat-hot" : "") + (einOrt ? " ein-ort" : "");
  el.innerHTML = (hotAnzahl ? '<span class="c-flamme">🔥</span>' : "") + gruppe.length;
  el.setAttribute("aria-label", gruppe.length + (einOrt
    ? " Termine an diesem Ort — antippen für die Liste"
    : " Pins hier" + (hotAnzahl ? ", davon " + hotAnzahl + " Highlight" + (hotAnzahl > 1 ? "s" : "") : "") +
      " — antippen zum Aufteilen"));
  el.title = gruppe.slice(0, 4).map(x => (x.p.hot ? "🔥 " : "") + x.p.titel).join("\n") +
    (gruppe.length > 4 ? "\n…" : "");
  el.addEventListener("click", e => {
    e.stopPropagation();
    // Zoomen hilft nur, wenn die Pins auch wirklich auseinanderliegen. Sind es viele
    // (typisch: eine Bühne mit ganzer Konzertreihe), ist die Liste der schnellere Weg.
    if(einOrt || gruppe.length >= 6 || map.getZoom() >= CLUSTER_AB_ZOOM - 1)
      zeigeClusterListe(gruppe.map(x => x.p));
    else map.fitBounds(b, {padding:{top:110, bottom:250, left:50, right:50}, maxZoom:17.5, duration:600});
  });
  const beschriftung = el.getAttribute("aria-label");
  clusterMarker.push(new maplibregl.Marker({element:el}).setLngLat([mitteLng, mitteLat]).addTo(map));
  // MapLibre setzt beim Anlegen sein eigenes aria-label ("Map marker") auf das Element und
  // überschreibt damit unseres. Für Screenreader wäre das wertlos — deshalb danach zurück.
  el.setAttribute("aria-label", beschriftung);
}

/* Cluster-Liste: Was steckt in dieser Gruppe? Nach Spielstätte gebündelt, denn genau das
   ist der Normalfall — eine Bühne mit ganzer Konzertreihe (Markt, Musikbunker, FRANZ).
   Innerhalb einer Spielstätte chronologisch, damit man den Spielplan liest, nicht ein Ranking. */
/* Der erste Teil der Meta-Zeile ist meist die Spielstätte ("Markt · 20:30 · frei").
   Manche Pins führen dort aber eine Zeitangabe ("vormittags", "samstags") — die ist kein Ort. */
const KEIN_ORT = /^(vormittags|nachmittags|abends|nachts|morgens|samstags|sonntags|montags|dienstags|mittwochs|donnerstags|freitags|täglich|taeglich|laufend|wöchentlich|woechentlich|kostenlos|frei|beispiel|ernte|selbstpflücke|selbstpfluecke|selber\b.*)/i;
function ortsName(p){
  const m = (p.meta || "").split("·")[0].trim();
  if(!m || /^\d/.test(m) || KEIN_ORT.test(m)) return "";
  return m;
}
function zeigeClusterListe(pins){
  const gruppen = new Map();
  pins.forEach(p => {
    const ort = ortsName(p) || "Weitere in der Nähe";
    if(!gruppen.has(ort)) gruppen.set(ort, []);
    gruppen.get(ort).push(p);
  });
  // Größte Gruppe zuerst; innerhalb der Gruppe nach Datum
  const sortiert = [...gruppen.entries()].sort((a,b) => b[1].length - a[1].length);
  const key = p => { const w = fenster(p); return w ? w.s.getTime() : 0; };
  const rumpf = sortiert.map(([ort, liste]) => {
    liste.sort((a,b) => key(a) - key(b) || relevanz(b) - relevanz(a));
    const kopf = sortiert.length > 1 || liste.length > 3
      ? '<div class="saison-kopf">'+esc(ort)+' · '+liste.length+'</div>' : "";
    return kopf + liste.map(p => listenZeile(p)).join("");
  }).join("");

  modalOeffnen(
    '<h2>' + pins.length + ' Pins an dieser Stelle</h2>'+
    '<p class="klein">'+(sortiert.length > 1 ? 'Nach Ort gebündelt. ' : '')+
    'Antippen öffnet den Pin auf der Karte.</p>'+ rumpf
  );
  blatt.querySelectorAll(".liste-zeile").forEach(z =>
    z.addEventListener("click", () => zumPin(PINS.find(x => x.id === z.dataset.id), true)));
}

/* Ein Weg für beide Stellen: die Chips über der Karte und die Schnellwahl in der Liste. */
function zeitSetzen(z){
  if(z === "range"){ zeitraumWaehlen(); return; }
  zeit = z;
  if(suchFenster){ suchFenster = null; $("#sucheingabe").value = suchTerme.join(" "); }
  baueTagleiste(); ansichtAktualisieren();
}
document.querySelectorAll(".zchip").forEach(c => {
  c.addEventListener("click", () => zeitSetzen(c.dataset.z));
});

/* Eigener Zeitraum (User-Test: "in bestimmten Zeiträumen auswählen") */
function zeitraumWaehlen(){
  const iso = tagKey;      // lokal formatieren, sonst steht nachts der Vortag im Feld
  const uhr = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  const von = eigenZeitraum ? iso(eigenZeitraum.von) : iso(new Date());
  const bisD = eigenZeitraum ? eigenZeitraum.bis : (() => { const x = new Date(); x.setDate(x.getDate()+7); return x; })();
  const vonZeit = eigenZeitraum && eigenZeitraum.mitZeit ? uhr(eigenZeitraum.von) : "00:00";
  const bisZeit = eigenZeitraum && eigenZeitraum.mitZeit ? uhr(eigenZeitraum.bis) : "23:59";
  modalOeffnen(
    '<h2>📅 Eigener Zeitraum</h2>'+
    '<p>Zeige nur Pins, die in diesem Zeitraum stattfinden:</p>'+
    '<div class="zeile"><span>Von</span><span class="zeit-feld">'+
      '<input type="time" id="zr-von-zeit" value="'+vonZeit+'" aria-label="Startzeit">'+
      '<input type="date" id="zr-von" value="'+von+'" aria-label="Startdatum"></span></div>'+
    '<div class="zeile"><span>Bis</span><span class="zeit-feld">'+
      '<input type="time" id="zr-bis-zeit" value="'+bisZeit+'" aria-label="Endzeit">'+
      '<input type="date" id="zr-bis" value="'+iso(bisD)+'" aria-label="Enddatum"></span></div>'+
    '<p class="klein">Uhrzeit ist optional — sie greift nur bei Pins mit Zeitangabe '+
    '(z. B. „20:30"). Ganztägige Einträge bleiben immer sichtbar.</p>'+
    '<div class="blatt-knoepfe">'+
      '<button class="bbtn gelb" id="zr-ok">Anwenden</button>'+
      '<button class="bbtn sek" id="zr-abend">Heute Abend</button>'+
      (zeit === "range" ? '<button class="bbtn sek" id="zr-weg">Zeitraum aufheben</button>' : '')+
    '</div>'
  );
  const anwenden = () => {
    const v = $("#zr-von").value, b = $("#zr-bis").value;
    if(!v || !b) return;
    const vz = $("#zr-von-zeit").value || "00:00", bz = $("#zr-bis-zeit").value || "23:59";
    const von2 = new Date(v+"T"+vz+":00"), bis2 = new Date(b+"T"+bz+":59");
    if(bis2 < von2) return;
    eigenZeitraum = {von:von2, bis:bis2, mitZeit: vz !== "00:00" || bz !== "23:59"};
    zeit = "range"; suchFenster = null;
    baueTagleiste(); ansichtAktualisieren(); modalSchliessen();
  };
  $("#zr-ok").addEventListener("click", anwenden);
  $("#zr-abend").addEventListener("click", () => {          // häufigster Fall: "was geht gleich?"
    const heute = new Date();
    $("#zr-von").value = iso(heute); $("#zr-bis").value = iso(heute);
    $("#zr-von-zeit").value = "17:00"; $("#zr-bis-zeit").value = "23:59";
    anwenden();
  });
  const weg = $("#zr-weg");
  if(weg) weg.addEventListener("click", () => {
    eigenZeitraum = null; zeit = "soon";
    baueTagleiste(); ansichtAktualisieren(); modalSchliessen();
  });
}

$("#liste-unten").addEventListener("click", () => zeigeListe("heute"));

function entfernungText(p){
  if(!meinStandort) return "";
  const km = entfernungKm(p.lat, p.lng, meinStandort.lat, meinStandort.lng);
  return km < 1 ? Math.round(km * 1000) + " m" : km.toFixed(km < 10 ? 1 : 0) + " km";
}
function listenZeile(p, datumText){

  const weg = entfernungText(p);
  return '<button class="liste-zeile" data-id="'+esc(p.id)+'">'+
    '<span class="lz-sym '+esc(p.typ)+(p.hot ? " hot" : "")+'">'+(p.hot ? "🔥" : (sym || ICON[p.typ]))+'</span>'+
    '<span class="lz-mitte"><span class="lz-titel">'+esc(p.titel)+'</span>'+
    '<span class="lz-meta">'+esc([TYPNAME[p.typ], p.meta, weg].filter(Boolean).join(" · "))+'</span></span>'+
    '<span class="lz-datum">'+esc(datumText ?? fmtDatum(p))+'</span></button>';
}

let letzterListenTab = "heute";     // für den Rückweg aus dem Detail-Sheet

/* Zeigt oben in der Liste, welche Filter gerade greifen — sonst wundert man sich,
   warum wenig dasteht, und sucht den Fehler bei den Daten statt bei der Auswahl. */
/* ohneChips: In der Liste stehen Zeitraum und Themen bereits als eigene, bedienbare Chips —
   sie hier zu wiederholen wäre doppelt gemoppelt. Über der Karte gibt es diese Chips nicht,
   dort gehört alles in die Aufzählung. */
function aktiveFilterNamen(ohneChips){
  const namen = [];
  if(nurHighlights) namen.push("🔥 Highlights");
  if(fuerDich) namen.push("✦ Für dich");
  if(merkModus) namen.push("★ Gemerkt");
  if(!ohneChips) aktiveTags.forEach(t => namen.push(TAG_LABEL[t] || t));
  const zeitName = {today:"Heute", soon:"Demnächst", all:"Alle Termine"}[zeit];
  if(zeit === "range" && eigenZeitraum){
    const f = d => d.getDate() + "." + (d.getMonth()+1) + ".";
    namen.push("📅 " + f(eigenZeitraum.von) + "–" + f(eigenZeitraum.bis));
  } else if(zeit !== "soon" && !ohneChips) namen.push("🗓 " + zeitName);
  if(suchTerme.length) namen.push('Suche: „' + suchTerme.map(v => v[0]).join(" ") + '"');
  if(suchFenster) namen.push("🗓 Suchzeitraum");
  return namen;
}
/* Filter direkt in der Liste — vorher stand hier nur, WAS gefiltert ist, ändern ging aber
   nur nach dem Schließen auf der Karte. Wer eine Liste durchsieht, will genau dort
   nachjustieren („doch lieber nur heute Abend"), ohne den Überblick zu verlieren. */
function filterZeile(){
  const namen = aktiveFilterNamen(true);
  const zeiten = [["today","Heute"],["soon","Demnächst"],["all","Alle"]];
  const schnell = '<div class="fz-zeit" role="group" aria-label="Zeitraum">'+
    zeiten.map(([k,n]) => '<button class="fz-z'+(zeit===k?" an":"")+'" data-z="'+k+'">'+n+'</button>').join("")+
    '</div>';
  const themen = [...aktiveTags];
  const abwahl = themen.length
    ? '<div class="fz-tags">'+ themen.map(t =>
        '<button class="fz-tag" data-tag="'+esc(t)+'">'+esc(TAG_LABEL[t]||t)+' ✕</button>').join("") +'</div>'
    : "";
  // "Alles aufheben" auch dann anbieten, wenn nur Themen gesetzt sind — die stehen zwar
  // schon als eigene Chips da, aber einzeln abwählen ist bei vier Themen mühsam.
  const etwasAktiv = namen.length || themen.length;
  return '<div class="filter-zeile">'+ schnell + abwahl +
    (namen.length ? '<span class="fz-liste">'+ namen.map(n => '<b>'+esc(n)+'</b>').join(" ") +'</span>' : '')+
    (etwasAktiv
      ? '<button class="fz-weg" id="liste-filter-weg">✕ alle aufheben</button>'
      // Nicht "alles wird gezeigt": Der Zeitraum oben ist ja auch eine Auswahl, sie steht
      // nur schon als Chip da und wird hier deshalb nicht wiederholt.
      : '<span class="fz-liste klein">Keine weiteren Filter</span>')+
    '</div>';
}

/* Wie interessant ist ein Pin gerade? Nähe schlägt Ferne, markierte Highlights schlagen alles.
   Damit lässt sich aus 140 Pins eine kurze, ehrliche "Was ist los?"-Liste bilden. */
function relevanz(p){
  const w = fenster(p);
  let punkte = 0;
  if(p.hot) punkte += 100;
  if(p.wdh && wdhAnTag(p.wdh, HEUTE0)) punkte += 55;
  if(w){
    const tage = Math.ceil((w.s - HEUTE0) / 864e5);
    const laeuft = w.s <= new Date(HEUTE0.getTime() + 864e5 - 1) && w.e >= HEUTE0;
    if(laeuft) punkte += 60;
    else if(tage === 1) punkte += 40;
    else if(tage <= 3) punkte += 28;
    else if(tage <= 7) punkte += 18;
    else if(tage <= 14) punkte += 8;
  }
  if(danke[p.id]) punkte += 12;
  if(istNeu(p)) punkte += 6;
  if(passtZuMir(p)) punkte += 14;
  if(p.beispiel) punkte -= 40;
  return punkte;
}
function laeuftHeute(p){
  if(p.wdh) return wdhAnTag(p.wdh, HEUTE0);
  const w = fenster(p);
  if(!w) return false;
  const heuteEnde = new Date(HEUTE0); heuteEnde.setHours(23,59,59);
  return w.s <= heuteEnde && w.e >= HEUTE0;
}

function zeigeListe(tab){
  const saisonPins = PINS.filter(p => p.saison);
  const tabs = '<div class="liste-tabs">'+
    '<button data-tab="heute" class="'+(tab==="heute"?"an":"")+'">🔥 Aktuell</button>'+
    '<button data-tab="ausschnitt" class="'+(tab==="ausschnitt"?"an":"")+'">📍 Auf der Karte</button>'+
    (saisonPins.length ? '<button data-tab="saison" class="'+(tab==="saison"?"an":"")+'">🍏 Saison</button>' : '')+
  '</div>';

  let kopf, rumpf;
  if(tab === "heute"){
    /* Alle Filter der Karte gelten auch hier — Thema, Kategorie UND Zeit. Nur bei den
       weiten Zeiteinstellungen ("Demnächst"/"Alle") blicken wir zusätzlich nach vorn, um
       den "Als Nächstes"-Block zu füllen. Bei "Heute", eigenem Zeitraum oder aktiver Suche
       bleibt es strikt bei dem, was gewählt wurde. Saison-Dauerangebote stehen als Fußnote,
       sonst schütten 20 Ernteorte die Liste zu. */
    const weiterBlick = (zeit === "soon" || zeit === "all") && !suchFenster;
    let alle = PINS.filter(p => sichtbar(p) && !p.beispiel);
    if(weiterBlick){
      const merkeZeit = zeit;
      zeit = "all";
      alle = PINS.filter(p => sichtbar(p) && !p.beispiel);
      zeit = merkeZeit;
    }
    const termine = alle.filter(p => !p.saison);

    /* Die Trennung „Heute / Als Nächstes" passt nur, solange der heutige Tag im gewählten
       Fenster liegt. Bei einem eigenen Zeitraum (z. B. 20.–22.8.) wäre eine Überschrift
       „Heute" irreführend — dann zeigen wir eine schlichte chronologische Liste. */
    const eigenesFenster = zeit === "range" || !!suchFenster;
    const heute = eigenesFenster ? [] :
      termine.filter(laeuftHeute).sort((a,b) => relevanz(b) - relevanz(a)).slice(0, 8);
    const heuteIds = new Set(heute.map(p => p.id));
    const kommend = termine.filter(p => !heuteIds.has(p.id))
      .map(p => ({p, w:fenster(p)}))
      .filter(x => eigenesFenster ? true : (x.w && x.w.s > HEUTE0))
      .sort((a,b) => eigenesFenster
        ? ((a.w ? a.w.s : 0) - (b.w ? b.w.s : 0)) || (relevanz(b.p) - relevanz(a.p))
        : (relevanz(b.p) - relevanz(a.p)) || (a.w.s - b.w.s))
      .slice(0, eigenesFenster ? 14 : 8);

    const heuteName = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"][HEUTE0.getDay()];
    kopf = '<h2>🔥 Was ist los?</h2>' + filterZeile() +
      '<p class="klein">Das Wichtigste zuerst, 🔥 = Highlight.</p>';
    const block = (titel, liste, datumFn) => liste.length
      ? '<div class="saison-kopf">'+titel+'<span class="anzahl">'+liste.length+'</span></div>' +
        liste.map(x => {
          const p = x.p || x;
          return listenZeile(p, datumFn ? datumFn(p) : undefined);
        }).join("")
      : "";
    // Fußnote statt Zeilenflut: Dauerangebote nur zählen und verlinken
    const spots = alle.filter(p => p.typ === "spot").length;
    const saisonAktiv = alle.filter(p => p.saison && saisonStatus(p).laeuft).length;
    const fuss = (spots || saisonAktiv)
      ? '<p class="klein" style="margin-top:14px">Dauerhaft auf der Karte: '+
        [saisonAktiv ? '<span class="vorschlag" data-tab="saison">'+saisonAktiv+' Ernteorte mit laufender Saison</span>' : '',
         spots ? spots + ' Fotospots' : ''].filter(Boolean).join(" · ") + '</p>'
      : "";
    rumpf = (block("Heute (" + heuteName + ")", heute, p => p.hot ? "🔥 jetzt" : "heute") +
      block(eigenesFenster ? "Im gewählten Zeitraum" : "Als Nächstes", kommend) ||
      '<p>Zu diesen Filtern ist gerade nichts los — tippe oben auf ✕ aufheben.</p>') + fuss;
  } else if(tab === "saison"){
    // Laufende zuerst und davon das, was bald endet ("letzte Chance"); danach nach Startnähe
    const mitStatus = saisonPins.map(p => ({p, st:saisonStatus(p)}));
    const jetzt  = mitStatus.filter(x => x.st.laeuft).sort((a,b) => a.st.tageBisEnde - b.st.tageBisEnde);
    const kommend = mitStatus.filter(x => !x.st.laeuft).sort((a,b) => a.st.tageBisStart - b.st.tageBisStart);
    const bald   = kommend.filter(x => x.st.tageBisStart <= 45);
    const later  = kommend.filter(x => x.st.tageBisStart > 45);
    const block = (titel, liste, klasse) => liste.length
      ? '<div class="saison-kopf '+(klasse||"")+'">'+titel+'<span class="anzahl">'+liste.length+'</span></div>'+
        liste.map(x => listenZeile(x.p, x.st.kurz)).join("")
      : "";
    kopf = '<h2>🍏 Saisonkalender</h2>' + filterZeile() +
      '<p class="klein">Wilde Ernte und Selbstpflücke rund um Aachen — Zeiten sind witterungsabhängige '+
      'Richtwerte. Es gilt die Handstraußregel: nur kleine Mengen für den Eigenbedarf.</p>';
    rumpf = block("Jetzt Saison", jetzt) + block("Bald dran", bald) +
            block("Später im Jahr", later, "spaeter");
  } else {
    const imBild = PINS.filter(p => sichtbar(p) && imAusschnitt(p));
    const key = p => { const w = fenster(p); return w ? w.s.getTime() : 0; };
    const reihenfolge = {event:0, angebot:1, hilfe:2, spot:3};
    imBild.sort((a,b) => (reihenfolge[a.typ]-reihenfolge[b.typ]) || (key(a)-key(b)));
    kopf = '<h2>☰ '+imBild.length+' Pins im Kartenausschnitt</h2>' + filterZeile() +
      '<p class="klein">Antippen springt zur Karte.</p>';
    rumpf = imBild.map(p => listenZeile(p)).join("") ||
      '<p>Nichts im aktuellen Ausschnitt — zoome raus oder ändere die Filter.</p>';
  }

  letzterListenTab = tab;
  modalOeffnen(kopf + tabs + rumpf);
  blatt.querySelectorAll(".liste-tabs button").forEach(b =>
    b.addEventListener("click", () => zeigeListe(b.dataset.tab)));
  blatt.querySelectorAll(".vorschlag[data-tab]").forEach(v =>
    v.addEventListener("click", () => zeigeListe(v.dataset.tab)));
  const fw = $("#liste-filter-weg");    // Filter direkt aus der Liste heraus aufheben
  if(fw) fw.addEventListener("click", () => { filterZuruecksetzen(); zeigeListe(tab); });
  // Zeitraum und Themen direkt in der Liste ändern — die Karte zieht mit, die Liste bleibt offen
  blatt.querySelectorAll(".fz-z").forEach(b => b.addEventListener("click", () => {
    zeitSetzen(b.dataset.z);
    zeigeListe(tab);
  }));
  blatt.querySelectorAll(".fz-tag").forEach(b => b.addEventListener("click", () => {
    aktiveTags.delete(b.dataset.tag);
    baueTagleiste(); ansichtAktualisieren();
    zeigeListe(tab);
  }));
  blatt.querySelectorAll(".liste-zeile").forEach(z =>
    z.addEventListener("click", () => zumPin(PINS.find(x => x.id === z.dataset.id), true)));
}

/* Von der Liste zum Pin — auf dem Handy ohne Kontextverlust: Liste zu, Karte hin, Details
   fahren unten ein, "Zurück zur Liste" bringt einen zurück. Am Desktop wie gehabt per Popup. */
function zumPin(p, ausListe){
  if(!p) return;
  modalSchliessen();
  const ziel = [p._lng ?? p.lng, p._lat ?? p.lat];
  if(istMobil()){
    map.flyTo({center:ziel, zoom:Math.max(map.getZoom(), CLUSTER_AB_ZOOM), duration:500});
    const mk = marker.find(x => x.p.id === p.id);
    setTimeout(() => { if(mk) mk.el.style.display = "flex"; sheetOeffnen(p, !!ausListe); }, 380);
    return;
  }
  map.flyTo({center:ziel, zoom:Math.max(map.getZoom(), CLUSTER_AB_ZOOM)});
  const mk = marker.find(x => x.p.id === p.id);
  if(mk) setTimeout(() => { mk.el.style.display = "flex"; if(!mk.m.getPopup().isOpen()) mk.m.togglePopup(); }, 600);
}

/* Saison-Status eines Pins: läuft gerade? wie lange noch / wie lange bis dahin? */
const MONAT = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
function saisonStatus(p){
  const w = fenster(p);
  if(!w) return {laeuft:false, tageBisStart:9999, tageBisEnde:9999, kurz:"", lang:""};
  const tag = 864e5;
  const bisStart = Math.ceil((w.s - HEUTE0) / tag);
  const bisEnde  = Math.ceil((w.e - HEUTE0) / tag);
  const spanne = MONAT[w.s.getMonth()] + "–" + MONAT[w.e.getMonth()];
  if(bisStart <= 0 && bisEnde >= 0){
    const kurz = bisEnde === 0 ? "letzter Tag" : "noch " + bisEnde + " T";
    return {laeuft:true, tageBisStart:0, tageBisEnde:bisEnde, kurz,
      lang:"🍏 Jetzt Saison — " + kurz + " (" + spanne + ")"};
  }
  const kurz = bisStart <= 45 ? "in " + bisStart + " T" : spanne;
  return {laeuft:false, tageBisStart:bisStart, tageBisEnde:bisEnde,
    kurz, lang:"🍏 Saison startet in " + bisStart + " Tagen (" + spanne + ")"};
}

/* Rückmeldung zu Suche UND Filtern: Wie viele Treffer? Und wenn nichts passt: Warum, und was
   hilft? Der häufigste Fall im Alltag: "Musik" + "Heute" ist leer, obwohl übermorgen ein Konzert
   ist — dann nennen wir das nächste Datum, statt den Nutzer vor einer leeren Karte sitzen zu lassen. */
function naechsterTermin(){
  const merkeZeit = zeit, merkeFenster = suchFenster;
  zeit = "all"; suchFenster = null;
  const kommend = PINS.filter(p => sichtbar(p) && fenster(p))
    .map(p => ({p, w:fenster(p)}))
    .filter(x => x.w.e >= HEUTE0)
    .sort((a,b) => a.w.s - b.w.s);
  const gesamt = PINS.filter(sichtbar).length;
  zeit = merkeZeit; suchFenster = merkeFenster;
  return {naechster: kommend[0] || null, gesamt};
}
function suchInfoAktualisieren(){
  const box = $("#such-info");
  if(!box) return;
  const suchtAktiv = suchTerme.length || suchFenster;
  const sucheOffen = $("#suchleiste").classList.contains("offen");
  const filterAn = aktiveTags.size > 0 || merkModus || zeit === "range";
  // Anzeigen bei aktiver Suche — oder wenn ein Filter gesetzt ist und nichts übrig bleibt
  const treffer = PINS.filter(sichtbar).length;
  if(!(suchtAktiv && sucheOffen) && !(filterAn && treffer === 0)){ box.classList.remove("da"); return; }

  if(treffer){
    const imBild = PINS.filter(p => sichtbar(p) && imAusschnitt(p)).length;
    box.innerHTML = "<b>" + treffer + " Treffer</b>" +
      (imBild < treffer ? " · " + imBild + " im Ausschnitt — <span class='vorschlag' data-akt='zoom'>alle zeigen</span>" : "");
  } else {
    const {naechster, gesamt} = naechsterTermin();
    if(naechster){
      const tage = Math.ceil((naechster.w.s - HEUTE0) / 864e5);
      const wann = tage <= 0 ? "läuft gerade" : tage === 1 ? "schon morgen" : "in " + tage + " Tagen";
      box.innerHTML = "Im gewählten Zeitraum nichts — der nächste Termin ist <b>" + wann + "</b>: " +
        esc(naechster.p.titel.slice(0, 34)) + " (" + esc(fmtDatum(naechster.p)) + ") " +
        "<span class='vorschlag' data-akt='naechster' data-id='" + esc(naechster.p.id) + "'>anzeigen</span>";
    } else if(gesamt){
      box.innerHTML = "Keine Treffer im gewählten Zeitraum — aber <b>" + gesamt + "</b> insgesamt. " +
        "<span class='vorschlag' data-akt='alle'>Zeitraum auf „Alle“</span>";
    } else {
      box.innerHTML = "Nichts gefunden. Versuch es z. B. mit <span class='vorschlag' data-akt='bsp' data-q='konzert'>Konzert</span>, " +
        "<span class='vorschlag' data-akt='bsp' data-q='flohmarkt'>Flohmarkt</span> oder " +
        "<span class='vorschlag' data-akt='bsp' data-q='ernte'>Ernte</span>.";
    }
  }
  box.classList.add("da");
}

/* Karte so weit herauszoomen, dass alle aktuellen Treffer sichtbar sind */
function alleTrefferZeigen(){
  const treffer = PINS.filter(sichtbar);
  if(!treffer.length) return;
  const b = new maplibregl.LngLatBounds();
  treffer.forEach(p => b.extend([p._lng ?? p.lng, p._lat ?? p.lat]));
  map.fitBounds(b, {padding:{top:120, bottom:260, left:50, right:50}, maxZoom:15, duration:700});
}

/* ---------- Zurück-Geste ----------
   Auf dem Handy erwartet man, dass die Wischgeste von der Bildschirmkante das zuletzt
   Geöffnete schließt — nicht die ganze Seite verlässt. Ohne das landet man beim Zurück
   aus der Liste versehentlich wieder in der Suchmaschine und muss alles neu laden.

   Umsetzung: Jedes Overlay legt beim Öffnen einen Eintrag in der Verlaufsliste an und
   merkt sich, wie es sich schließt. Die Zurück-Geste nimmt den obersten Eintrag; ein Klick
   auf ✕ ruft umgekehrt history.back(), damit der Eintrag nicht liegen bleibt und man
   nicht zweimal zurück tippen muss. */
const overlayStapel = [];
let zurueckIgnorieren = false;
function overlayAnmelden(schliesser){
  overlayStapel.push(schliesser);
  history.pushState({ eventlasOverlay: overlayStapel.length }, "");
}
function overlayAbmelden(){
  // Von Hand geschlossen: den eigenen Verlaufseintrag wieder abräumen. Das history.back()
  // löst selbst ein popstate aus — ohne den Merker würde dieses gleich noch das darunter
  // liegende Overlay mitschließen (Detail unter der Liste zum Beispiel).
  if(!overlayStapel.length) return;
  overlayStapel.pop();
  if(history.state && history.state.eventlasOverlay){
    zurueckIgnorieren = true;
    history.back();
  }
}
window.addEventListener("popstate", () => {
  if(zurueckIgnorieren){ zurueckIgnorieren = false; return; }
  const schliessen = overlayStapel.pop();
  if(schliessen) schliessen();
});

/* ---------- Modale (ein Container, wechselnder Inhalt) ---------- */
const schleier = $("#schleier"), blatt = $("#blatt");
let nachModal = null;
function modalOeffnen(html){
  const wechsel = schleier.classList.contains("offen");   // Inhalt tauschen ≠ neu öffnen
  blatt.innerHTML = html;
  blatt.scrollTop = 0;
  schleier.classList.add("offen");
  if(!wechsel) overlayAnmelden(() => modalSchliessen(true));
}
function modalSchliessen(vonZurueck){
  if(!schleier.classList.contains("offen")) return;
  schleier.classList.remove("offen");
  if(!vonZurueck) overlayAbmelden();
  if(nachModal){ const f = nachModal; nachModal = null; f(); }
}
schleier.addEventListener("click", e => { if(e.target === schleier) modalSchliessen(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") modalSchliessen(); });

/* Kartenbild wechseln. HTML-Marker überleben den Stilwechsel (sie hängen am Container,
   nicht am Style), eigene GeoJSON-Layer wie der Heimat-Kreis dagegen nicht — der wird
   nach dem Laden neu gezeichnet. */
function stilWechseln(neu){
  if(!STILE[neu] || neu === stilKey) return;
  stilKey = neu;
  lsSet("stil", neu);
  map.setStyle(STILE[neu].url);
  map.once("styledata", () => { heimKreisZeichnen(); ansichtAktualisieren(); });
  blatt.querySelectorAll("#stil-wahl button").forEach(b =>
    b.classList.toggle("an", b.dataset.stil === neu));

  document.body.classList.toggle("karte-hell", neu === "positron" || neu === "bright" || neu === "liberty");
}

/* ---------- Heimat-Bereich (Roadmap Nr. 22, lokale Variante ohne Server) ---------- */
let heimModus = false, heimMarker = null;
function heimWaehlen(){
  modalSchliessen();
  heimModus = true;
  hinweisZeigen("Tippe auf die Karte, wo du wohnst — es wird nur auf deinem Gerät gespeichert.");
}
function heimKreisZeichnen(){
  if(heimMarker){ heimMarker.remove(); heimMarker = null; }
  if(map.getLayer("heim-kreis")) map.removeLayer("heim-kreis");
  if(map.getSource("heim-kreis")) map.removeSource("heim-kreis");
  if(!heim) return;
  const el = document.createElement("div"); el.className = "heim-marker"; el.title = "Dein Heimat-Bereich";
  heimMarker = new maplibregl.Marker({element:el}).setLngLat([heim.lng, heim.lat]).addTo(map);
  const punkte = [];
  const rGrad = heim.radius / 111.32;
  for(let i=0; i<=64; i++){
    const w = (i/64) * 2 * Math.PI;
    punkte.push([heim.lng + (rGrad * Math.cos(w)) / Math.cos(heim.lat*Math.PI/180), heim.lat + rGrad * Math.sin(w)]);
  }
  const geo = {type:"Feature", geometry:{type:"Polygon", coordinates:[punkte]}};
  const hinzufuegen = () => {
    if(map.getSource("heim-kreis")) return;
    map.addSource("heim-kreis", {type:"geojson", data:geo});
    map.addLayer({id:"heim-kreis", type:"fill", source:"heim-kreis",
      paint:{"fill-color":"#F5F2E9","fill-opacity":0.07}});
  };
  /* map.loaded() ist während Tile-Nachladen false und "load" feuert nur einmal —
     deshalb: direkt versuchen, sonst beim nächsten "idle" nachholen */
  try{ hinzufuegen(); }catch(e){ map.once("idle", () => { try{ hinzufuegen(); }catch(e2){} }); }
}
function heimRadiusWaehlen(lat, lng){
  modalOeffnen(
    '<h2>Dein Heimat-Bereich</h2>'+
    '<p>Wie groß soll dein Bereich sein? Beim Öffnen zeigt dir Eventlas neue Pins daraus an.</p>'+
    '<div class="radius-wahl" id="radius-wahl">'+
      '<button data-r="0.5">500 m</button><button data-r="1" class="an">1 km</button>'+
      '<button data-r="2">2 km</button><button data-r="5">5 km</button>'+
    '</div>'+
    '<div class="blatt-knoepfe"><button class="bbtn gelb" id="heim-ok">Speichern</button></div>'
  );
  let radius = 1;
  blatt.querySelectorAll("#radius-wahl button").forEach(b => b.addEventListener("click", () => {
    radius = parseFloat(b.dataset.r);
    blatt.querySelectorAll("#radius-wahl button").forEach(x => x.classList.remove("an"));
    b.classList.add("an");
  }));
  $("#heim-ok").addEventListener("click", () => {
    heim = {lat, lng, radius};
    lsSet("heim", heim);
    heimKreisZeichnen();
    modalSchliessen();
  });
}
function entfernungKm(lat1, lng1, lat2, lng2){
  const rad = Math.PI/180, R = 6371;
  const a = Math.sin((lat2-lat1)*rad/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin((lng2-lng1)*rad/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

/* Senden: optimistisch anzeigen, damit sich das Gespräch flüssig anfühlt */
async function kommentarAbschicken(knopf){
  const pinId = knopf.dataset.id;
  const wurzel = knopf.closest(".p-tipps");
  const feld = wurzel.querySelector(".komm-feld");
  const nameFeld = wurzel.querySelector(".komm-name");
  const text = feld.value.trim();
  if(text.length < 2){ feld.focus(); return; }
  if(text.length > 600){ return; }

  knopf.disabled = true; knopf.textContent = "…";
  const name = nameFeld.value.trim();
  lsSet("kommName", name);
  try{
    const neu = await kommentarSenden(pinId, text, name);
    const liste = wurzel.querySelector(".komm-liste");
    const platzhalter = liste.querySelector(".komm-hinweis, .komm-laedt");
    if(platzhalter) platzhalter.remove();
    liste.insertAdjacentHTML("beforeend", kommentarHTML(neu));
    feld.value = "";
    karma.ideen++; lsSet("karma", karma);
    liste.lastElementChild.scrollIntoView({block:"nearest", behavior:"smooth"});
  }catch(err){
    const liste = wurzel.querySelector(".komm-liste");
    liste.insertAdjacentHTML("beforeend",
      '<div class="komm-hinweis">Konnte nicht gesendet werden — bitte später nochmal versuchen.</div>');
  }
  knopf.disabled = false; knopf.textContent = "Senden";
}

/* ---------- Export: die Pins mitnehmen ----------
   Bewusst clientseitig und ohne Anmeldung: Wer die Karte lieber in seiner eigenen App
   nutzt (Organic Maps, OsmAnd, Google My Maps), soll das können. GeoJSON für OSM-Apps,
   KML für Google My Maps — Google importiert kein GeoJSON. */
function dateiSpeichern(name, inhalt, typ){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([inhalt], {type:typ}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function exportPins(nurSichtbare){
  return nurSichtbare ? PINS.filter(sichtbar) : PINS.filter(p => !p.beispiel);
}
function alsGeoJSON(liste){
  return JSON.stringify({
    type: "FeatureCollection",
    name: "Eventlas " + STADT.name,
    features: liste.map(p => ({
      type: "Feature",
      geometry: {type:"Point", coordinates:[p.lng, p.lat]},
      properties: {
        name: p.titel, beschreibung: p.text, kategorie: TYPNAME[p.typ],
        themen: p.tags.join(", "), wann: fmtDatum(p) || "", info: p.meta || "",
        link: p.link || "", quelle: p.quelle || "",
      },
    })),
  }, null, 1);
}
function alsKML(liste){
  const x = s => String(s ?? "").replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
  const stile = Object.keys(TYPNAME).map(t =>
    '<Style id="'+t+'"><IconStyle><Icon><href>https://maps.google.com/mapfiles/kml/paddle/'+
    ({event:"blu", angebot:"orange", hilfe:"ylw", spot:"purple"}[t] || "wht")+'-circle.png</href></Icon></IconStyle></Style>').join("\n");
  const orte = liste.map(p =>
    "<Placemark>\n<name>"+x(p.titel)+"</name>\n"+
    "<description>"+x([p.text, [fmtDatum(p), p.meta].filter(Boolean).join(" · "), p.link].filter(Boolean).join("\n\n"))+"</description>\n"+
    "<styleUrl>#"+p.typ+"</styleUrl>\n"+
    "<Point><coordinates>"+p.lng+","+p.lat+",0</coordinates></Point>\n</Placemark>").join("\n");
  return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n'+
    "<name>Eventlas "+x(STADT.name)+"</name>\n"+
    "<description>"+x("Stand " + (datenStand || heute()) + " · eventlas.netlify.app")+"</description>\n"+
    stile + "\n" + orte + "\n</Document>\n</kml>";
}
function heute(){ return tagKey(new Date()); }

function zeigeExport(){
  const alle = exportPins(false).length, gefiltert = exportPins(true).length;
  modalOeffnen(
    '<h2>⬇ Pins mitnehmen</h2>'+

    '<div class="zeile"><span>Was exportieren?</span></div>'+

    '</div>'+
    '<div class="blatt-knoepfe">'+
      '<button class="bbtn gelb" id="exp-geojson">GeoJSON</button>'+
      '<button class="bbtn sek" id="exp-kml">KML</button>'+
    '</div>'+
    '<p class="klein"><b>GeoJSON</b> für Organic Maps, OsmAnd und die meisten Karten-Apps — '+
    'Datei antippen und „mit Organic Maps öffnen" wählen.<br>'+
    '<b>KML</b> für Google My Maps: am Rechner auf mymaps.google.com → Neue Karte → Importieren. '+
    'Die Karte erscheint danach in der Google-Maps-App unter „Gespeichert".</p>'
  );
  let wahl = "alle";
  blatt.querySelectorAll("#exp-wahl button").forEach(b => b.addEventListener("click", () => {
    wahl = b.dataset.w;
    blatt.querySelectorAll("#exp-wahl button").forEach(x => x.classList.remove("an"));
    b.classList.add("an");

  $("#exp-kml").addEventListener("click", () => {

  });
}

/* Kalender-Export: .ics clientseitig erzeugen (nur für datierte Pins) */
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function icsHerunterladen(p){
  const d8 = s => s.replace(/-/g,"");
  const endeExkl = () => {
    const e = new Date((p.ende || p.start) + "T00:00:00");
    e.setDate(e.getDate()+1);
    return e.getFullYear() + String(e.getMonth()+1).padStart(2,"0") + String(e.getDate()).padStart(2,"0");
  };
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15) + "Z";
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Eventlas//"+STADT.name+"//DE","BEGIN:VEVENT",
    "UID:"+p.id+"@eventlas","DTSTAMP:"+stamp,
    "DTSTART;VALUE=DATE:"+d8(p.start),"DTEND;VALUE=DATE:"+endeExkl(),
    "SUMMARY:"+icsEsc(p.titel),
    "DESCRIPTION:"+icsEsc(p.text + (urlOk(p.link) ? "\n" + p.link : "")),
    "GEO:"+p.lat+";"+p.lng,
    ...(urlOk(p.link) ? ["URL:"+p.link] : []),
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
  a.download = p.id + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

      "\nKarte: https://www.google.com/maps?q="+neuOrt.lat.toFixed(5)+","+neuOrt.lng.toFixed(5)+"\n"

/* ---------- Pin absenden: ausgefülltes Formular statt Freitext ----------
   Vorher stand in der Mail eine Vorlage mit leeren Zeilen ("Titel: ___"), die viele gar
   nicht ausfüllten — jede Meldung kostete dann eine Rückfrage. Jetzt fragt ein kurzes
   Formular genau das ab, was ein Pin braucht, und erzeugt daraus zweierlei:
   einen lesbaren Text für Menschen und einen fertigen JSON-Block zum Einfügen in pins.json.
   Bei Terminen kommt ein Kalendereintrag (.ics) dazu, den ein Mail-Assistent direkt
   übernehmen kann. Das ersetzt die geplante Datenbank: kein zusätzlicher Dienst, keine
   ungeprüften Fremdinhalte auf der Seite und damit keine Haftungsfrage nach § 10 DDG. */
function sendeOptionen(mitOrt){
  if(plakatDatei){ plakatSenden(); return; }      // Foto-Meldung hat ihren eigenen Weg (Bild anhängen)
  const heute = tagKey(new Date());
  modalOeffnen(
    '<h2>Pin melden</h2>'+
    '<p class="klein">'+(mitOrt && neuOrt ? "Ort ist gesetzt ✓ — " : "")+
      'Kurz ausfüllen, wir prüfen und stellen online. Nur Titel ist Pflicht.</p>'+
    '<div class="mf-zeile"><label>Was ist es?</label>'+
      '<select id="mf-typ">'+
        '<option value="event">Veranstaltung</option>'+
        '<option value="angebot">Angebot / zu verschenken</option>'+
        '<option value="hilfe">Hilfe gesucht</option>'+
      '</select></div>'+
    '<div class="mf-zeile"><label>Titel *</label>'+
      '<input id="mf-titel" type="text" maxlength="80" placeholder="z. B. Hofflohmarkt Oppenhoffallee"></div>'+
    '<div class="mf-zeile mf-halb"><span><label>Datum</label>'+
      '<input id="mf-datum" type="date" value="'+heute+'"></span>'+
      '<span><label>Uhrzeit</label><input id="mf-zeit" type="time"></span></div>'+
    '<div class="mf-zeile"><label>Was gibt es zu wissen?</label>'+
      '<textarea id="mf-text" rows="3" maxlength="400" placeholder="Ein, zwei Sätze reichen."></textarea></div>'+
    '<div class="mf-zeile"><label>Link (falls es eine Seite gibt)</label>'+
      '<input id="mf-link" type="url" placeholder="https://…"></div>'+
    '<div class="blatt-knoepfe">'+
      '<button class="bbtn gelb" id="senden-mail">✉ Absenden</button>'+
      '<a class="bbtn wa" target="_blank" rel="noopener" id="senden-wa" href="#">Per WhatsApp</a>'+
    '</div>'+
    '<div class="blatt-knoepfe"><button class="bbtn sek" id="senden-abbruch">✕ Abbrechen</button></div>'+
    '<p class="klein">Kein Spam, keine Werbung, keine fremden Rechte verletzen — sonst kommt der Pin nicht online. '+
    'Deine Angaben gehen nur an uns, nicht an Dritte.</p>'
  );
  const lese = () => ({
    typ: $("#mf-typ").value,
    titel: $("#mf-titel").value.trim(),
    datum: $("#mf-datum").value,
    uhr: $("#mf-zeit").value,
    text: $("#mf-text").value.trim(),
    link: $("#mf-link").value.trim(),
  });
  const zaehlen = () => { karma.gemeldet++; lsSet("karma", karma); meldenReset(); modalSchliessen(); };

  $("#senden-mail").addEventListener("click", () => {
    const d = lese();
    if(!d.titel){ $("#mf-titel").focus(); hinweisZeigen("Bitte gib wenigstens einen Titel an."); return; }
    const betreff = "Neuer Pin: " + d.titel;
    location.href = "mailto:" + KONFIG.mail + "?subject=" + encodeURIComponent(betreff) +
      "&body=" + encodeURIComponent(meldungsText(d, mitOrt));
    if(d.datum) icsHerunterladen(d);            // Kalendereintrag zum Anhängen bzw. Öffnen
    zaehlen();
  });
  $("#senden-wa").addEventListener("click", e => {
    const d = lese();
    if(!d.titel){ e.preventDefault(); $("#mf-titel").focus(); hinweisZeigen("Bitte gib wenigstens einen Titel an."); return; }
    e.currentTarget.href = "https://wa.me/" + KONFIG.whatsapp + "?text=" + encodeURIComponent(meldungsText(d, mitOrt));
    zaehlen();
  });
  $("#senden-abbruch").addEventListener("click", () => { meldenReset(); modalSchliessen(); });
  setTimeout(() => $("#mf-titel").focus(), 60);
}

/* Zwei Teile in einer Nachricht: oben zum Lesen, unten zum Einfügen. Der JSON-Block hält
   sich exakt an das Schema von pins.json — Prüfen heißt dann nur noch lesen und kopieren. */
function meldungsText(d, mitOrt){
  const ort = (mitOrt && neuOrt) ? {lng:+neuOrt.lng.toFixed(5), lat:+neuOrt.lat.toFixed(5)} : null;
  const pin = {
    id: slugFuerId(d.titel) + (d.datum ? "-" + d.datum : ""),
    typ: d.typ,
    titel: d.titel,
    text: d.text || "",
    ...(ort ? {lng: ort.lng, lat: ort.lat} : {}),
    ...(d.datum ? {start: d.datum} : {}),
    ...(d.uhr ? {meta: d.uhr + " Uhr"} : {}),
    ...(d.link ? {link: d.link, quelle: d.link} : {}),
    hinzu: tagKey(new Date()),
    fest: true,
  };
  const wann = [d.datum ? new Date(d.datum+"T00:00:00").toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"}) : "",
                d.uhr ? d.uhr + " Uhr" : ""].filter(Boolean).join(", ");
  return "Neuer Pin für Eventlas " + STADT.name + "\n\n" +
    "Was: " + ({event:"Veranstaltung", angebot:"Angebot", hilfe:"Hilfe gesucht"}[d.typ]) + "\n" +
    "Titel: " + d.titel + "\n" +
    (wann ? "Wann: " + wann + "\n" : "") +
    (d.text ? "Beschreibung: " + d.text + "\n" : "") +
    (d.link ? "Link: " + d.link + "\n" : "") +
    (ort ? "Ort: " + ort.lat + ", " + ort.lng +
           "\nAuf der Karte: https://www.google.com/maps?q=" + ort.lat + "," + ort.lng + "\n"
         : "Ort: nicht auf der Karte gesetzt\n") +
    "\n— — — Fertig für pins.json — — —\n" +
    JSON.stringify(pin, null, 1) + "\n";
}
function slugFuerId(s){
  return String(s).toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,36) || "pin";
}
/* Kalendereintrag als Datei. Eine mailto-Nachricht kann keine Anhänge tragen — die .ics
   landet deshalb im Download-Ordner und lässt sich anhängen oder direkt öffnen. */
function icsHerunterladen(d){
  const start = d.datum.replace(/-/g,"") + (d.uhr ? "T" + d.uhr.replace(":","") + "00" : "");
  const zeilen = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Eventlas//Pin-Meldung//DE","BEGIN:VEVENT",
    "UID:" + slugFuerId(d.titel) + "-" + Date.now() + "@eventlas",
    d.uhr ? "DTSTART:" + start : "DTSTART;VALUE=DATE:" + start,
    "SUMMARY:" + icsEsc("Eventlas-Pin prüfen: " + d.titel),
    "DESCRIPTION:" + icsEsc(meldungsText(d, true)),
    neuOrt ? "GEO:" + neuOrt.lat.toFixed(5) + ";" + neuOrt.lng.toFixed(5) : "",
    "END:VEVENT","END:VCALENDAR",
  ].filter(Boolean);
  const blob = new Blob([zeilen.join("\r\n")], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "eventlas-" + slugFuerId(d.titel) + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- Plakat-Foto mit automatischer Ortsbestimmung ----------
   Der Ort kommt in dieser Reihenfolge: 1) GPS-Daten im Foto selbst (EXIF — greift, wenn das
   Handy Standort in Bildern speichert und man vor Ort fotografiert), 2) aktueller Standort
   (man steht ja vor dem Plakat), 3) manuell auf der Karte antippen. Was auf dem Plakat steht
   (Titel, Datum), liest der Betreiber beim Pin-Update aus dem Bild — dafür bräuchte es im
   Browser einen API-Schlüssel, der dort nicht sicher liegen kann. */

/* Minimaler EXIF-GPS-Leser: sucht im JPEG den APP1/Exif-Block und darin die GPS-Tags. */
function exifGPS(datei){
  return new Promise(resolve => {
    const leser = new FileReader();
    leser.onerror = () => resolve(null);
    leser.onload = () => {
      try{
        const dv = new DataView(leser.result);
        if(dv.byteLength < 16 || dv.getUint16(0) !== 0xFFD8) return resolve(null);   // kein JPEG
        let pos = 2, exifStart = -1;
        while(pos + 4 < dv.byteLength){
          if(dv.getUint8(pos) !== 0xFF) break;
          const marker = dv.getUint8(pos + 1), laenge = dv.getUint16(pos + 2);
          if(marker === 0xE1 && dv.getUint32(pos + 4) === 0x45786966){ exifStart = pos + 10; break; }
          if(marker === 0xDA) break;                                                  // Bilddaten erreicht
          pos += 2 + laenge;
        }
        if(exifStart < 0) return resolve(null);
        const le = dv.getUint16(exifStart) === 0x4949;                                // Byte-Reihenfolge
        const u16 = o => dv.getUint16(exifStart + o, le);
        const u32 = o => dv.getUint32(exifStart + o, le);
        let gpsOffset = 0;
        const ifd0 = u32(4), anzahl = u16(ifd0);
        for(let i = 0; i < anzahl; i++){
          const e = ifd0 + 2 + i * 12;
          if(u16(e) === 0x8825){ gpsOffset = u32(e + 8); break; }                      // GPS-IFD
        }
        if(!gpsOffset) return resolve(null);
        const gps = {}, gAnzahl = u16(gpsOffset);
        for(let i = 0; i < gAnzahl; i++){
          const e = gpsOffset + 2 + i * 12;
          const tag = u16(e), typ = u16(e + 2), n = u32(e + 4);
          const wertOffset = (typ === 5 ? u32(e + 8) : e + 8);                         // rational → Zeiger
          if(tag === 1 || tag === 3){ gps[tag] = String.fromCharCode(dv.getUint8(exifStart + e + 8)); }
          if((tag === 2 || tag === 4) && typ === 5 && n === 3){
            const teile = [0,1,2].map(k => {
              const z = u32(wertOffset + k*8), nn = u32(wertOffset + k*8 + 4);
              return nn ? z / nn : 0;
            });
            gps[tag] = teile[0] + teile[1]/60 + teile[2]/3600;
          }
        }
        if(gps[2] == null || gps[4] == null) return resolve(null);
        const lat = gps[1] === "S" ? -gps[2] : gps[2];
        const lng = gps[3] === "W" ? -gps[4] : gps[4];
        if(!isFinite(lat) || !isFinite(lng) || (lat === 0 && lng === 0)) return resolve(null);
        resolve({lat, lng, quelle:"Foto"});
      }catch(err){ resolve(null); }
    };
    leser.readAsArrayBuffer(datei.slice(0, 256 * 1024));   // EXIF steht ganz am Anfang
  });
}

function aktuellerStandort(){
  return new Promise(resolve => {
    if(!navigator.geolocation) return resolve(null);
    const timer = setTimeout(() => resolve(null), 8000);
    navigator.geolocation.getCurrentPosition(
      pos => { clearTimeout(timer); resolve({lat:pos.coords.latitude, lng:pos.coords.longitude,
        genauigkeit:Math.round(pos.coords.accuracy), quelle:"Standort"}); },
      () => { clearTimeout(timer); resolve(null); },
      {enableHighAccuracy:true, timeout:7000, maximumAge:60000}
    );
  });
}

let plakatDatei = null;
$("#btn-foto").addEventListener("click", () => $("#plakat-datei").click());
$("#plakat-datei").addEventListener("change", e => plakatGewaehlt(e));
$("#plakat-galerie").addEventListener("change", e => plakatGewaehlt(e));

async function plakatGewaehlt(e){
  const datei = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!datei) return;
  plakatDatei = datei;
  $("#btn-foto").classList.add("laedt");

  const vorschau = URL.createObjectURL(datei);
  plakatModal(vorschau, null, "suche");

  // Ort bestimmen: erst aus dem Foto, sonst aktueller Standort
  let ort = await exifGPS(datei);
  if(!ort) ort = await aktuellerStandort();
  $("#btn-foto").classList.remove("laedt");

  if(ort){
    neuOrt = {lng:ort.lng, lat:ort.lat};
    setzeNeuMarker(ort.lng, ort.lat);
    map.flyTo({center:[ort.lng, ort.lat], zoom:16.5});
  }
  plakatModal(vorschau, ort, ort ? "gefunden" : "fehlt");
}

function setzeNeuMarker(lng, lat){
  if(neuMarker) neuMarker.remove();
  const el = document.createElement("button");
  el.className = "blip neu-ort";
  el.innerHTML = '<span class="form"></span>＋';
  el.addEventListener("click", ev => { ev.stopPropagation(); sendeOptionen(true); });
  neuMarker = new maplibregl.Marker({element:el}).setLngLat([lng, lat]).addTo(map);
  el.setAttribute("aria-label", "Gewählter Ort — antippen zum Senden");
}

function plakatModal(bildUrl, ort, zustand){
  const status =
    zustand === "suche"    ? '<div class="ort-status">📍 Ort wird bestimmt …</div>' :
    zustand === "gefunden" ? '<div class="ort-status ok">📍 Ort automatisch erkannt' +
        (ort.quelle === "Foto" ? " (aus dem Foto)" : " (dein Standort" + (ort.genauigkeit ? ", ±" + ort.genauigkeit + " m" : "") + ")") +
        ' — auf der Karte markiert</div>' :
      '<div class="ort-status warn">📍 Kein Ort im Foto gefunden — tippe den Ort gleich auf der Karte an</div>';

  modalOeffnen(
    '<h2>📷 Plakat gefunden</h2>'+
    '<img class="foto-vorschau" src="'+bildUrl+'" alt="Vorschau des fotografierten Plakats">'+
    status +
    '<p class="klein">Titel, Datum und Ort werden vom Plakat abgelesen, sobald deine Meldung ankommt — '+
    'du musst nichts abtippen. Schick einfach ab.</p>'+
    '<div class="blatt-knoepfe">'+
      '<button class="bbtn gelb" id="plakat-senden"'+(zustand === "suche" ? " disabled" : "")+'>Absenden</button>'+
      '<button class="bbtn sek" id="plakat-ort">'+(zustand === "gefunden" ? "Ort korrigieren" : "Ort auf Karte wählen")+'</button>'+
    '</div>'+
    (zustand !== "suche" ? '<div class="blatt-knoepfe"><button class="bbtn sek" id="plakat-galerie-btn">Anderes Bild aus der Galerie</button></div>' : '')
  );

  const senden = $("#plakat-senden");
  if(senden) senden.addEventListener("click", plakatSenden);
  const ortBtn = $("#plakat-ort");
  if(ortBtn) ortBtn.addEventListener("click", () => {
    modalSchliessen();
    meldeModus = true;
    meldenBtn.textContent = "Ort antippen …";
    hinweisZeigen("Tippe den Ort des Plakats auf der Karte an — das Foto ist gespeichert.");
  });
  const gal = $("#plakat-galerie-btn");
  if(gal) gal.addEventListener("click", () => { nachModal = () => $("#plakat-galerie").click(); modalSchliessen(); });
}

async function plakatSenden(){
  karma.gemeldet++; lsSet("karma", karma);
  const text = meldeText(!!neuOrt) + (neuOrt ? "" : "\n(Ort bitte vom Plakat ablesen.)");
  if(plakatDatei && navigator.canShare && navigator.canShare({files:[plakatDatei]})){
    try{
      await navigator.share({files:[plakatDatei], title:"Neuer Pin für Eventlas", text});
      meldenReset(); modalSchliessen(); plakatDatei = null;
      return;
    }catch(err){ if(err && err.name === "AbortError"){ return; } }
  }
  modalOeffnen(
    '<h2>Fast geschafft</h2>'+
    '<p>Dein Browser kann das Foto nicht direkt weitergeben. Öffne WhatsApp oder Mail und hänge das '+
    'Foto dort an — Text und Koordinaten sind schon vorbereitet.</p>'+
    '<div class="blatt-knoepfe">'+
      '<a class="bbtn wa" target="_blank" rel="noopener" href="https://wa.me/'+KONFIG.whatsapp+'?text='+encodeURIComponent(text)+'">WhatsApp öffnen</a>'+
      '<a class="bbtn sek" href="mailto:'+KONFIG.mail+'?subject='+encodeURIComponent("Plakat für Eventlas")+'&body='+encodeURIComponent(text)+'">E-Mail öffnen</a>'+
    '</div>'
  );
}

map.on("click", e => {

});

/* ---------- Neu seit letztem Besuch (Roadmap Nr. 22, lokale Variante) ---------- */
function neuBanner(){
  if(!letzterBesuch) return;
  let neue = PINS.filter(p => istNeu(p) && !String(p.titel).startsWith("[Beispiel]"));
  let wo = "";
  if(heim){
    const imBereich = neue.filter(p => entfernungKm(p.lat, p.lng, heim.lat, heim.lng) <= heim.radius);
    if(imBereich.length){ neue = imBereich; wo = " in deinem Bereich"; }
  } else if(profilTags().length){
    const passend = neue.filter(passtZuMir);
    if(passend.length){ neue = passend; wo = " für deine Interessen"; }
  }
  if(!neue.length) return;
  const toast = $("#toast");
  toast.innerHTML = "✨ <b>" + neue.length + (neue.length === 1 ? " neuer Pin" : " neue Pins") + "</b>" + wo + " seit deinem letzten Besuch — antippen zum Anschauen";
  toast.style.display = "block";
  toast.addEventListener("click", () => {
    toast.style.display = "none";
    const p = neue[0];
    map.flyTo({center:[p._lng ?? p.lng, p._lat ?? p.lat], zoom:CLUSTER_AB_ZOOM});
    const mk = marker.find(x => x.p.id === p.id);
    if(mk) setTimeout(() => { mk.el.style.display = "flex"; if(!mk.m.getPopup().isOpen()) mk.m.togglePopup(); }, 600);
  }, {once:true});
  setTimeout(() => { toast.style.display = "none"; }, 12000);
}

/* ---------- Deep-Link #pin=… (aus "Teilen") ---------- */
function deepLink(){
  const m = location.hash.match(/#pin=([^&]+)/);
  if(!m) return;
  const p = PINS.find(x => x.id === decodeURIComponent(m[1]));
  if(!p) return;
  map.flyTo({center:[p._lng ?? p.lng, p._lat ?? p.lat], zoom:CLUSTER_AB_ZOOM + 0.5});
  const mk = marker.find(x => x.p.id === p.id);
  if(mk) setTimeout(() => { mk.el.style.display = "flex"; if(!mk.m.getPopup().isOpen()) mk.m.togglePopup(); }, 700);
}

/* Live-Daten: pins.json wird bei jedem Öffnen frisch geladen (Fallback: eingebaute Pins). */
fetch(STADT.pinsDatei + "?v=" + Date.now(), {cache:"no-store"})
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if(d && Array.isArray(d.pins) && d.pins.length){
      datenStand = d.stand || null;
      PINS = beispielePruefen(d.pins.map(normalisiere));
      baueMarker();
      baueTagleiste();
      ansichtAktualisieren();
    }
  })
  .catch(() => {})
  .finally(() => {
    // Ortswissen nachladen: fehlt die Datei, bleibt die Karte vollständig nutzbar.
    fetch("orte.json?v=" + Date.now(), {cache:"no-store"})
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if(!d || !Array.isArray(d.orte)) return;
        ORTE = d.orte.filter(o => typeof o.lat === "number" && typeof o.lng === "number");
        ortCache.clear();
        if(sheetPin) sheetOeffnen(sheetPin);      // offenes Detail nachträglich ergänzen
      })
      .catch(() => {});
    wetterLaden();          // Vorhersage im Hintergrund holen, blockiert nichts
    window.__ev = { map, get pins(){ return PINS; }, get marker(){ return marker; },
      deepLink, blaetterListe, sichtbar, imAusschnitt, relevanz,
      get wetter(){ return wetter; }, draussen };   // Debug-Haken
    deepLink();                     // erst nach dem Daten-Load, sonst zerstört der Marker-Neuaufbau das Popup
    neuBanner();
    lsSet("besuch", tagKey(new Date()));
    willkommenPruefen();
  });

/* Beim ersten Besuch nur ein Streifen, kein Dialog: Die Karte ist sofort da und bedienbar.
   Wer mehr wissen will, tippt „Kurz erklären"; wer personalisieren will, findet das
   Männchen oben rechts. Ein per Link geteilter Pin unterdrückt den Streifen ganz — dort
   will jemand genau eine Sache sehen. */
function willkommenPruefen(){
  if(profil || lsGet("onboardingGesehen", false) || location.hash.includes("pin=")) return;
  const streifen = $("#willkommen");
  const stadt = $("#wk-stadt");
  if(stadt) stadt.textContent = STADT.name;
  streifen.hidden = false;
  const weg = () => { streifen.hidden = true; lsSet("onboardingGesehen", true); };
  $("#wk-zu").addEventListener("click", weg);
  $("#wk-mehr").addEventListener("click", () => { weg(); zeigeEinfuehrung(); });
}
</script>
