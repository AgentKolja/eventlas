<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314161A'/%3E%3Ccircle cx='32' cy='27' r='13' fill='%23FFC61A'/%3E%3Cpath d='M32 58 22 38h20z' fill='%23FFC61A'/%3E%3Ccircle cx='32' cy='27' r='5' fill='%2314161A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Schriften liegen im Projekt statt bei Google. Die dynamische Einbindung von Google Fonts
     überträgt bei jedem Aufruf die IP-Adresse in die USA — das LG München hat das 2022 als
     Datenschutzverstoß gewertet (3 O 17493/20). Lokal gehostet entfällt der Drittkontakt
     vollständig, und die Karte lädt schneller. Inter ist eine Variable Font: eine Datei
     deckt alle Schnitte ab. */
  @font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;
    src:url('schriften/anton.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;
    src:url('schriften/inter.woff2') format('woff2')}

  :root{
    --nacht:#14161A; --panel:#1D2026; --linie:#2C3038;
    --papier:#F5F2E9; --grau:#9AA0AB;
    --hilfe:#FFC61A; --event:#2FD6C3; --angebot:#FF6A3D; --spot:#C77DFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* 100dvh statt 100% — sonst schneidet die einfahrende Adressleiste von Safari/Chrome
     auf dem Handy den unteren Rand ab und der Melden-Knopf liegt außerhalb. */
  html,body{height:100%;height:100dvh}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--nacht);color:var(--papier);
    overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  #map{position:absolute;inset:0}
  /* iOS zoomt beim Fokus auf Felder unter 16px — das verstellt die ganze Ansicht */
  input,select,textarea{font-size:16px}
  button{font-family:inherit}

  /* ---------- Kopfzeile ---------- */
  header{position:absolute;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:flex-start;gap:10px;padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top));
    background:linear-gradient(to bottom, rgba(20,22,26,.92), rgba(20,22,26,0));pointer-events:none}
  header .titel{pointer-events:auto;min-width:0}
  h1{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
  h1 span{color:var(--hilfe)}
  .sub{font-size:11px;color:var(--grau);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kopf-knoepfe{margin-left:auto;display:flex;gap:6px;pointer-events:auto;flex:none}
  .kbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--linie);
    background:rgba(29,32,38,.88);color:var(--papier);cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center}
  .kbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* Schmale Handys: sechs Knöpfe + Titel gehen sich sonst nicht aus.
     Die Knöpfe bleiben trotzdem gut treffbar — die sichtbare Fläche ist kleiner,
     die Tippfläche über ::before aber so groß wie das Raster erlaubt (36 + 6 Lücke).
     Genau bis an die Lücke und nicht darüber: Sonst überlappen sich die Flächen und
     ein Tipp zwischen zwei Knöpfen trifft den falschen. */
  @media (max-width:430px){
    h1{font-size:17px}
    .sub{font-size:10px}
    .kopf-knoepfe{gap:6px}
    .kbtn{width:36px;height:36px;border-radius:10px;position:relative}
    .kbtn::before{content:"";position:absolute;top:50%;left:50%;
      transform:translate(-50%,-50%);width:42px;height:44px}
    .kbtn svg{width:18px;height:18px}
  }
  /* Sehr schmal (iPhone SE u. Ä.): Untertitel weg, Knöpfe und Lücken enger — sonst
     schiebt die sechste Schaltfläche den Titel aus dem Bild. */
  @media (max-width:360px){
    .sub{display:none}
    .kopf-knoepfe{gap:4px}
    .kbtn{width:34px;height:34px}
    .kbtn::before{width:38px;height:44px}
    .kbtn svg{width:17px;height:17px}
  }
  /* "Stimmt das noch?" — unaufdringlich, aber auffindbar. Bewusst unter den Aktionen:
     Erst will man wissen, was der Ort ist, dann ob die Angabe frisch ist. */
  .p-bestaetigen{margin-top:10px;padding:9px 11px;border-radius:10px;
    background:var(--nacht);border:1px solid var(--linie);font-size:11.5px;color:var(--grau)}
  .bs-stand{display:block}
  .bs-stand.alt{color:var(--hilfe)}
  .bs-frage{display:block;margin:6px 0 6px;color:var(--papier);font-weight:700;font-size:12px}
  .bs-knoepfe{display:flex;gap:6px;flex-wrap:wrap}
  .bs-btn{flex:1;min-width:118px;min-height:38px;border-radius:8px;cursor:pointer;
    border:1px solid var(--linie);background:var(--panel);color:var(--papier);
    font:700 11.5px 'Inter';padding:8px 6px}
  .bs-btn.ja:hover{border-color:var(--event);color:var(--event)}
  .bs-btn.nein:hover{border-color:var(--angebot);color:var(--angebot)}

  /* Meldeformular: kurze Felder statt einer Freitext-Vorlage, die niemand ausfüllt */
  .mf-zeile{margin:10px 0 0}
  .mf-zeile label{display:block;font:700 11.5px 'Inter';color:var(--grau);margin-bottom:4px}
  .mf-zeile input,.mf-zeile select,.mf-zeile textarea{
    width:100%;background:var(--nacht);border:1px solid var(--linie);color:var(--papier);
    border-radius:10px;padding:10px 11px;font:500 13.5px 'Inter';min-height:44px}
  .mf-zeile textarea{min-height:64px;resize:vertical}
  .mf-zeile input::placeholder,.mf-zeile textarea::placeholder{color:var(--grau)}
  .mf-zeile input:focus,.mf-zeile select:focus,.mf-zeile textarea:focus{
    outline:2px solid var(--hilfe);outline-offset:1px;border-color:var(--hilfe)}
  .mf-halb{display:flex;gap:8px}
  .mf-halb > span{flex:1;min-width:0}

  /* Trenner + eigene Färbung heben das Profil von den Karten-Werkzeugen ab */
  .kopf-trenner{width:1px;align-self:stretch;margin:2px 2px;background:var(--linie);flex:none}
  .kbtn.profil{background:rgba(199,125,255,.16);border-color:rgba(199,125,255,.5);color:var(--spot)}
  .kbtn.profil:hover{background:rgba(199,125,255,.28)}
  .kbtn.an{background:var(--papier);color:#141414;border-color:var(--papier)}
  .kbtn.foto{background:var(--hilfe);border-color:var(--hilfe);color:#141414}
  .kbtn.foto:active{transform:scale(.94)}
  .kbtn.laedt{opacity:.6;pointer-events:none}
  .foto-vorschau{width:100%;max-height:180px;object-fit:contain;border-radius:12px;
    border:1px solid var(--linie);background:var(--nacht);margin:10px 0 4px}
  .ort-status{display:flex;align-items:center;gap:8px;font-size:12px;padding:9px 11px;
    border-radius:10px;background:var(--nacht);border:1px solid var(--linie);margin:8px 0}
  .ort-status.ok{border-color:var(--event);color:var(--event)}
  .ort-status.warn{border-color:var(--hilfe);color:var(--hilfe)}
  .kbtn:focus-visible,.zchip:focus-visible,.tagchip:focus-visible,.melden:focus-visible{outline:2px solid var(--papier);outline-offset:2px}

  /* Suchleiste */
  .suche{position:absolute;left:12px;right:12px;z-index:19;display:none;
    top:calc(58px + env(safe-area-inset-top));max-width:560px;margin:0 auto}
  .suche.offen{display:flex;gap:8px}
  .suche input{flex:1;border:1px solid var(--linie);background:rgba(29,32,38,.96);color:var(--papier);
    border-radius:12px;padding:11px 14px;font:600 14px 'Inter';min-width:0}
  .suche input::placeholder{color:var(--grau);font-weight:400}
  .suche .leeren{width:44px;border-radius:12px;border:1px solid var(--linie);
    background:rgba(29,32,38,.96);color:var(--grau);cursor:pointer;font-size:16px}
  .such-info{position:absolute;left:12px;right:12px;z-index:19;display:none;max-width:560px;
    margin:6px auto 0;top:calc(58px + env(safe-area-inset-top));
    background:var(--panel);border:1px solid var(--linie);border-radius:10px;
    padding:8px 12px;font-size:12px;color:var(--grau)}
  .such-info.da{display:block}
  .such-info b{color:var(--papier)}
  .such-info .vorschlag{color:var(--hilfe);cursor:pointer;font-weight:600;white-space:nowrap}

  /* Begrüßung als Streifen statt Vollbild: Die Karte bleibt sichtbar und bedienbar.
     Liegt über der Karte, aber unterhalb der Kopfzeile — und nimmt keine Klicks weg,
     außer auf den eigenen beiden Knöpfen. */
  .willkommen{position:absolute;left:12px;right:12px;z-index:18;
    top:calc(58px + env(safe-area-inset-top));max-width:560px;margin:0 auto;
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--linie);border-radius:12px;
    padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.45);
    animation:wk-rein .35s ease both}
  @keyframes wk-rein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .willkommen[hidden]{display:none}
  .wk-text{flex:1;min-width:0;font-size:12.5px;line-height:1.45;color:var(--grau)}
  .wk-text b{display:block;color:var(--papier);font-size:13.5px;margin-bottom:1px}
  .wk-mehr{flex:none;background:var(--hilfe);color:#14161A;border:0;border-radius:9px;
    padding:9px 12px;font:800 12px 'Inter';cursor:pointer;min-height:38px}
  .wk-zu{flex:none;width:34px;min-height:38px;background:none;border:0;color:var(--grau);
    font-size:16px;cursor:pointer;border-radius:9px}
  .wk-zu:hover{background:var(--nacht);color:var(--papier)}

  /* Toast (neue Pins) */
  .toast{position:absolute;left:12px;right:12px;z-index:18;display:none;
    top:calc(58px + env(safe-area-inset-top));max-width:560px;margin:0 auto;
    background:var(--panel);border:1px solid var(--linie);border-radius:12px;
    padding:10px 14px;font-size:13px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  .toast b{color:var(--hilfe)}

  /* ---------- HUD unten ---------- */
  .hud{position:absolute;left:0;right:0;bottom:0;z-index:20;
    padding:8px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(20,22,26,.94) 62%, rgba(20,22,26,0));}
  .hud-innen{max-width:560px;margin:0 auto}

  /* Filter einklappbar: Auf kleinen Handys nehmen drei Filterreihen ein Drittel des
     Bildschirms weg. Eingeklappt bleibt die Karte groß, ein Tipp holt alles zurück. */
  .hud-klapp{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    background:none;border:0;color:var(--grau);font:700 11px 'Inter';letter-spacing:.4px;
    cursor:pointer;padding:5px 0 7px;min-height:32px}
  .hud-klapp .pfeil{transition:transform .2s ease;font-size:10px}
  .hud.zu .hud-klapp .pfeil{transform:rotate(180deg)}
  .hud-filter{max-height:340px;overflow:hidden;
    transition:max-height .26s ease, opacity .2s ease}
  .hud.zu .hud-filter{max-height:0;opacity:0;pointer-events:none}
  .hud.zu .hud-klapp{color:var(--papier)}
  .hud-klapp .marke{background:var(--hilfe);color:#141414;border-radius:99px;
    padding:1px 7px;font-size:10px;display:none}
  .hud.zu .hud-klapp .marke.da{display:inline-block}

  /* Tag-Chips (scrollbar). Der Verlauf rechts zeigt an, dass es weitergeht —
     ohne ihn übersehen Nutzer auf schmalen Screens die hinteren Themen. */
  .tags-wrap{position:relative}
  .tags-wrap::after{content:"";position:absolute;right:0;top:0;bottom:8px;width:26px;
    background:linear-gradient(to right, rgba(20,22,26,0), rgba(20,22,26,.92));
    pointer-events:none;opacity:0;transition:opacity .2s}
  .tags-wrap.mehr::after{opacity:1}
  .tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .tags::-webkit-scrollbar{display:none}
  .tags .tagchip{scroll-snap-align:start}
  .tagchip{flex:none;border:1px solid var(--linie);background:rgba(29,32,38,.85);color:var(--grau);
    border-radius:999px;padding:9px 13px;font:600 12.5px 'Inter';cursor:pointer;white-space:nowrap;
    min-height:38px;display:flex;align-items:center}
  .tagchip.an{color:#141414;background:var(--papier);border-color:var(--papier)}
  .tagchip.fuerdich.an{background:var(--hilfe);border-color:var(--hilfe)}
  .tagchip.reset{color:var(--angebot);border-color:var(--angebot);display:none}
  .tagchip.reset.da{display:block}
  .tagchip.highlight{color:#FFC61A;border-color:#FF8A1F}
  .tagchip.highlight.an{color:#141414;background:linear-gradient(95deg,#FFC61A,#FF8A1F);border-color:#FF8A1F}

  /* Zeit-Chips: halbtransparent, kontraststark (Roadmap Nr. 14) */
  .zfilter{display:flex;gap:8px;margin-bottom:8px}
  .zchip{flex:1;border:1px solid rgba(245,242,233,.28);background:rgba(20,22,26,.62);color:#E8E5DC;
    border-radius:10px;padding:11px 4px;font:600 12.5px 'Inter';cursor:pointer;backdrop-filter:blur(3px);
    min-height:42px}
  .zchip.an{color:#141414;background:var(--papier);border-color:var(--papier)}

  /* Die Kategorie-Chips (event/angebot/hilfe/spot) sind mit ihrer Filterzeile entfallen —
     ihr CSS steht deshalb nicht mehr hier. Form und Farbe der Marker tragen dieselbe
     Information; die Legende im Info-Dialog erklärt sie. */

  /* Liste und Melden gleichwertig nebeneinander: Die Liste ist der Haupteinstieg,
     wenn man nicht auf der Karte suchen will — nicht nur ein Icon unter vielen oben. */
  .hud-aktionen{display:flex;gap:8px;margin-top:8px}
  .liste-btn{flex:0 0 auto;display:flex;align-items:center;gap:7px;
    font-family:'Anton';font-size:14px;letter-spacing:.8px;text-transform:uppercase;
    background:var(--panel);color:var(--papier);border:1px solid var(--linie);
    border-radius:12px;padding:13px 15px;cursor:pointer;white-space:nowrap}
  .liste-btn:active{transform:scale(.97)}
  .liste-btn .lb-icon{font-size:15px;line-height:1}
  .liste-btn:focus-visible{outline:2px solid var(--papier);outline-offset:2px}
  .melden{display:block;flex:1;width:auto;
    font-family:'Anton';font-size:15px;letter-spacing:1px;text-transform:uppercase;
    background:var(--hilfe);color:#141414;border:0;border-radius:12px;
    padding:13px;cursor:pointer}
  .hinweis{margin:6px auto 0;font-size:11px;color:var(--grau);text-align:center;display:none}
  .hinweis a{color:var(--hilfe);font-weight:600}
  .hinweis b{color:var(--papier);font-size:12.5px}
  /* Alternativen im Hinweisbalken statt in einem Dialog davor: Der Ortauswahl-Vorgang
     läuft schon, der zweite Weg bleibt trotzdem einen Fingertipp entfernt. */
  .hw-neben{display:block;margin-top:3px}
  .hw-btn{background:none;border:0;color:var(--hilfe);font:600 11px 'Inter';cursor:pointer;
    padding:6px 4px;text-decoration:underline;min-height:32px}

  /* ---------- Map-Blips: Form + Icon statt Buchstaben (farbenblind-tauglich) ----------
     WICHTIG: position:absolute — MapLibre positioniert Marker absolut; ein relative
     würde die Marker in den Layout-Fluss zwingen und sie beim Zoomen/Filtern verschieben. */
  .blip{position:absolute;width:34px;height:34px;border:0;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .blip .form{position:absolute;inset:2px;border:2px solid #14161A;box-shadow:0 2px 8px rgba(0,0,0,.45)}
  .blip svg{position:relative;width:16px;height:16px;color:#141414;
    fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .blip.t-event .form{background:var(--event);border-radius:50%}
  .blip.t-angebot .form{background:var(--angebot);border-radius:9px}
  .blip.t-hilfe .form{background:var(--hilfe);border-radius:8px;transform:rotate(45deg)}
  .blip.t-spot .form{background:var(--spot);border-radius:50%;box-shadow:0 0 0 2px rgba(199,125,255,.45),0 2px 8px rgba(0,0,0,.45)}
  .blip.neu-ort .form{background:var(--papier);border-style:dashed;border-radius:50%}
  .blip.neu-ort{font-family:'Anton';font-size:15px;color:#141414}
  .blip.gedimmt{opacity:.4}
  .blip.passt{z-index:5}
  .blip.passt .form{box-shadow:0 0 0 3px var(--papier),0 2px 10px rgba(0,0,0,.5)}
  .blip .emo{position:relative;font-size:15px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
  /* Highlight-Pins: feuriger Ring + Glut-Puls, damit sie auch ohne die Flamme auffallen */
  .blip.hot{width:40px;height:40px;z-index:6}
  .blip.hot .form{inset:5px;border-color:#FFD24A;
    box-shadow:0 0 0 3px #FF8A1F, 0 0 14px 3px rgba(255,138,31,.85), 0 2px 10px rgba(0,0,0,.5);
    animation:glut 1.9s ease-in-out infinite}
  .blip.hot::after{content:"🔥";position:absolute;top:-5px;right:-5px;font-size:14px;z-index:3;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
  .blip.hot::before{content:"";position:absolute;inset:0;border-radius:50%;
    border:2px solid rgba(255,198,26,.9);animation:feuerring 1.9s ease-out infinite}
  .blip.frisch:not(.hot)::before{content:"";position:absolute;top:-2px;left:-2px;width:10px;height:10px;z-index:2;
    background:#fff;border-radius:50%;border:0;box-shadow:0 0 0 2px var(--nacht);animation:blinzel 1.4s ease-in-out infinite}
  @keyframes glut{
    0%,100%{box-shadow:0 0 0 3px #FF8A1F, 0 0 12px 2px rgba(255,138,31,.7), 0 2px 10px rgba(0,0,0,.5)}
    50%    {box-shadow:0 0 0 3px #FFC61A, 0 0 20px 6px rgba(255,170,40,.95), 0 2px 10px rgba(0,0,0,.5)}}
  @keyframes feuerring{
    0%  {transform:scale(.85);opacity:.9}
    70% {transform:scale(1.45);opacity:0}
    100%{transform:scale(1.45);opacity:0}}
  @keyframes blinzel{0%,100%{opacity:1}50%{opacity:.35}}

  /* Cluster: fasst dicht beieinander liegende Pins zusammen, damit die Karte bei
     weitem Zoom lesbar bleibt. Farbe zeigt die häufigste Kategorie der Gruppe. */
  .cluster{width:40px;height:40px;border-radius:50%;border:2px solid #14161A;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-family:'Anton';font-size:15px;
    color:#141414;box-shadow:0 2px 10px rgba(0,0,0,.45);position:absolute;
    background:var(--event);transition:transform .12s ease}
  .cluster:active{transform:scale(.94)}
  .cluster.gross{width:48px;height:48px;font-size:17px}
  .cluster.t-angebot{background:var(--angebot)} .cluster.t-hilfe{background:var(--hilfe)}
  .cluster.t-spot{background:var(--spot)} .cluster.t-event{background:var(--event)}
  .cluster.hat-hot{box-shadow:0 0 0 3px #FF8A1F,0 0 14px 3px rgba(255,138,31,.7),0 2px 10px rgba(0,0,0,.45)}
  .cluster .c-flamme{position:absolute;top:-7px;right:-6px;font-size:13px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
  .cluster:focus-visible{outline:2px solid var(--papier);outline-offset:3px}

  /* Hover-Vorschau: Titel erscheint direkt am Pin, ohne dass man klicken muss.
     Auf Touchgeräten irrelevant (kein Hover) — dort führt der Tipp direkt zum Popup. */
  .blip .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:var(--panel);color:var(--papier);border:1px solid var(--linie);border-radius:11px;
    padding:9px 11px;font:400 11.5px 'Inter';width:max-content;max-width:250px;
    white-space:normal;text-align:left;
    pointer-events:none;opacity:0;visibility:hidden;
    transition:opacity .13s ease;box-shadow:0 6px 20px rgba(0,0,0,.55);z-index:20}
  .blip .tip b{display:block;font-weight:800;font-size:12.5px;line-height:1.25;margin-bottom:2px}
  .blip .tip small{display:block;color:var(--hilfe);font-weight:600;font-size:10.5px;margin-bottom:3px}
  .blip .tip em{display:block;font-style:normal;color:#C9CDD6;line-height:1.4;font-size:11px}
  .blip .tip i{display:block;font-style:normal;color:var(--event);font-weight:600;
    font-size:10.5px;margin-top:4px}
  /* Am oberen Kartenrand nach unten aufklappen, damit die Karte nicht hinter die Kopfzeile rutscht */
  .blip.tip-unten .tip{bottom:auto;top:calc(100% + 8px)}
  @media (hover:hover){
    .blip:hover{z-index:19}
    .blip:hover .tip{opacity:1;visibility:visible}
    .cluster:hover{filter:brightness(1.08)}
  }
  .blip:focus-visible .tip{opacity:1;visibility:visible}

  /* Blättern zwischen Pins (wie in Immobilienportalen: Treffer durchklicken) */
  .p-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin:-4px -4px 8px;padding-bottom:8px;border-bottom:1px solid var(--linie)}
  .p-nav button{width:30px;height:26px;border-radius:7px;border:1px solid var(--linie);
    background:transparent;color:var(--papier);cursor:pointer;font-size:14px;line-height:1;flex:none}
  .p-nav button:disabled{opacity:.3;cursor:default}
  .p-nav .zaehler{font-size:11px;color:var(--grau);text-align:center;flex:1}

  /* Heimat-Marker */
  .heim-marker{width:16px;height:16px;border-radius:50%;background:var(--papier);
    border:3px solid var(--nacht);box-shadow:0 0 0 2px var(--papier)}

  /* ---------- Popup ---------- */
  .maplibregl-popup{z-index:15}
  .maplibregl-popup-content{background:var(--panel);color:var(--papier);
    border:1px solid var(--linie);border-radius:14px;padding:14px;min-width:230px;max-width:270px;
    font-family:'Inter'}
  .maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
  .maplibregl-popup-close-button{color:var(--grau);font-size:18px;right:6px;top:4px}
  .p-typ{font-family:'Anton';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .p-typ svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .p-typ.event{color:var(--event)} .p-typ.angebot{color:var(--angebot)}
  .p-typ.hilfe{color:var(--hilfe)} .p-typ.spot{color:var(--spot)}
  .p-hot{margin-left:auto;letter-spacing:.3px;font-size:9px;color:#141414;white-space:nowrap;
    background:linear-gradient(95deg,#FFC61A,#FF8A1F);border-radius:6px;padding:3px 6px}
  .p-titel{font-weight:800;font-size:15px;margin:4px 0 6px;line-height:1.25}
  .p-text{font-size:13px;color:#C9CDD6;line-height:1.45}
  .p-meta{font-size:11px;color:var(--grau);margin-top:8px}
  .p-gold{font-size:11px;color:var(--hilfe);margin-top:6px}
  .p-wetter{font-size:11.5px;color:var(--event);margin-top:5px;font-weight:600}
  /* Primäraktion breit und farbig, Zweitaktionen klein darunter — so ist auf einen Blick
     klar, was der nächste Schritt ist (Tickets bzw. Hinfahren). */
  .p-haupt{display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:11px;text-align:center;text-decoration:none;
    background:var(--hilfe);color:#141414;border-radius:10px;padding:12px 10px;
    font:800 13.5px 'Inter';letter-spacing:.2px;min-height:46px}
  /* Preis als Schild im Knopf: Wer den Preis sucht, findet ihn dort, wo er ihn braucht —
     nicht drei Zeilen weiter oben im Fließtext. */
  .p-preis{background:rgba(20,22,26,.22);border-radius:7px;padding:3px 8px;
    font:800 12px 'Inter';white-space:nowrap}
  .p-preis.frei{background:rgba(20,22,26,.14)}
  .p-akt{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .p-btn{display:inline-block;font:600 12px 'Inter';color:#141414;border:0;cursor:pointer;
    background:var(--papier);border-radius:8px;padding:7px 11px;text-decoration:none}
  .p-btn.sek{background:transparent;color:var(--papier);border:1px solid var(--linie)}
  .p-btn.sek.aktivgruen{border-color:var(--event);color:var(--event)}
  .p-quelle{font-size:10px;color:var(--grau);margin-top:8px}
  .p-quelle a{color:var(--grau)}

  /* Nutzerbeiträge: ein Bild und kurze Tipps von Leuten, die schon da waren.
     Beides wird vor der Veröffentlichung geprüft — siehe Roadmap "Beitragen". */
  .p-bild{width:100%;border-radius:10px;margin:9px 0 3px;display:block;
    background:var(--nacht);object-fit:cover;max-height:170px}
  .p-bild-credit{font-size:10px;color:var(--grau);margin-bottom:4px}
  .p-bild-credit a{color:var(--grau);text-decoration:underline}

  /* Ortswissen: Anfahrt, Zugänglichkeit, Hintergrund — als ruhiger Block, damit es
     die Veranstaltung nicht überstrahlt, aber vor dem Haupt-Knopf noch gelesen wird. */
  .p-ort{background:var(--nacht);border:1px solid var(--linie);border-radius:10px;
    padding:8px 10px;margin:9px 0 3px}
  .o-zeile{font-size:12px;color:var(--papier);line-height:1.5}
  .o-wiki{font-size:11.5px;color:var(--grau);line-height:1.55;margin-top:6px;
    padding-top:6px;border-top:1px solid var(--linie)}
  .o-wiki a{color:var(--event);text-decoration:none;white-space:nowrap}
  .o-wiki a:hover{text-decoration:underline}
  .p-tipps{margin-top:12px;border-top:1px solid var(--linie);padding-top:10px}
  .p-tipps h4{font:800 11px 'Inter';letter-spacing:.6px;text-transform:uppercase;
    color:var(--grau);margin-bottom:8px}

  /* Gesprächsverlauf: Beiträge als Sprechblasen, damit ein Austausch erkennbar ist */
  .komm{background:var(--nacht);border:1px solid var(--linie);border-radius:11px;
    padding:8px 11px;margin-bottom:7px}
  .komm-kopf{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
  .komm-kopf b{font-size:12px;font-weight:700;color:var(--papier)}
  .komm-zeit{font-size:10.5px;color:var(--grau);margin-left:auto;flex:none}
  .komm-text{font-size:13px;line-height:1.5;color:#D3D7DF;white-space:pre-wrap;word-break:break-word}
  .komm-aktion{margin-top:5px}
  .komm-aktion button{background:none;border:0;color:var(--grau);font:600 10.5px 'Inter';
    cursor:pointer;padding:2px 0}
  .komm-aktion button:hover{color:var(--angebot)}
  .komm-hinweis,.komm-laedt{font-size:12px;color:var(--grau);padding:6px 0 8px}
  .komm-neuladen{background:none;border:0;color:var(--hilfe);font:600 12px 'Inter';cursor:pointer}

  /* Eingabe */
  .komm-neu{margin-top:9px}
  .komm-feld{width:100%;border:1px solid var(--linie);background:var(--nacht);color:var(--papier);
    border-radius:10px;padding:10px;font:400 16px 'Inter';resize:vertical;min-height:44px}
  .komm-feld::placeholder{color:var(--grau)}
  .komm-zeile{display:flex;gap:7px;margin-top:7px}
  .komm-name{flex:1;min-width:0;border:1px solid var(--linie);background:var(--nacht);
    color:var(--papier);border-radius:10px;padding:10px;font:400 16px 'Inter'}
  .komm-name::placeholder{color:var(--grau)}
  .komm-senden{flex:none;background:var(--hilfe);color:#141414;border:0;border-radius:10px;
    padding:10px 18px;font:800 13px 'Inter';cursor:pointer;min-height:44px}
  .komm-senden:disabled{opacity:.5;cursor:default}

  .p-beitragen{display:flex;gap:6px;margin-top:10px}
  .p-beitragen button{flex:1;border:1px dashed var(--linie);background:transparent;
    color:var(--grau);border-radius:9px;padding:9px 6px;font:600 11.5px 'Inter';cursor:pointer}
  .p-beitragen button:active{transform:scale(.98)}
  .p-beitragen button:hover{color:var(--papier);border-color:var(--papier)}

  /* ---------- Modale ---------- */
  .schleier{position:fixed;inset:0;z-index:40;background:rgba(10,11,13,.6);display:none;
    align-items:flex-end;justify-content:center}
  .schleier.offen{display:flex}
  /* 72 statt 82 vh: Oben bleibt ein Streifen Karte stehen — man sieht, wo man ist, und
     kommt mit einem Tipp darauf zurück. Ein Blatt, das den ganzen Bildschirm füllt, wirkt
     wie eine eigene Seite; genau das war die Klage. */
  .blatt{width:100%;max-width:560px;max-height:72vh;overflow-y:auto;overflow-x:hidden;
    background:var(--panel);border:1px solid var(--linie);border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 32px rgba(0,0,0,.5)}
  /* Der freie Bereich über dem Blatt schließt bei Antippen (der Schleier fängt den Klick
     bereits ab) — der Zeiger macht das sichtbar. */
  .schleier{cursor:pointer}
  .blatt{cursor:auto}
  .blatt h2{font-family:'Anton';font-size:17px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
  .blatt h3{font-size:13px;font-weight:800;margin:16px 0 6px}
  .blatt p{font-size:13px;color:#C9CDD6;line-height:1.5;margin:6px 0}
  .blatt .klein{font-size:11px;color:var(--grau)}
  .blatt-knoepfe{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .bbtn{flex:1;min-width:130px;border:0;border-radius:12px;padding:12px;cursor:pointer;
    font:700 13px 'Inter';background:var(--papier);color:#141414;text-align:center;text-decoration:none;display:block}
  .bbtn.sek{background:transparent;color:var(--papier);border:1px solid var(--linie)}
  .bbtn.wa{background:#25D366}
  .bbtn.gelb{background:var(--hilfe)}
  .blatt textarea{width:100%;min-height:90px;border:1px solid var(--linie);background:var(--nacht);
    color:var(--papier);border-radius:10px;padding:10px;font:400 13px 'Inter';resize:vertical}
  .wahl-tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .wahl-tags .tagchip{font-size:13px;padding:9px 14px}

  /* Kurz-Einführung */
  .howto{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linie)}
  .howto:last-of-type{border-bottom:0}
  .howto .ht-icon{width:38px;height:38px;flex:none;border-radius:11px;background:var(--nacht);
    border:1px solid var(--linie);display:flex;align-items:center;justify-content:center;font-size:17px}
  .howto .ht-text{font-size:13px;line-height:1.45;color:#C9CDD6}
  .howto .ht-text b{color:var(--papier);display:block;font-size:13.5px;margin-bottom:1px}
  .schritte{display:flex;gap:5px;justify-content:center;margin-top:14px}
  .schritte span{width:7px;height:7px;border-radius:50%;background:var(--linie)}
  .schritte span.an{background:var(--hilfe);width:20px;border-radius:4px}
  .zeile{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;
    border-bottom:1px solid var(--linie);font-size:13px}
  .zeile:last-child{border-bottom:0}
  .zeile .aktion{color:var(--hilfe);font-weight:700;cursor:pointer;background:none;border:0;font-size:13px}
  .radius-wahl{display:flex;gap:6px}
  .radius-wahl button{border:1px solid var(--linie);background:var(--nacht);color:var(--papier);
    border-radius:8px;padding:6px 10px;font:600 12px 'Inter';cursor:pointer}
  .radius-wahl button.an{background:var(--papier);color:#141414}
  #stil-wahl{flex-wrap:wrap;margin:4px 0 2px}
  #stil-wahl button{flex:1;min-width:70px;min-height:40px}
  /* 16px ist Pflicht: Darunter zoomt iOS beim Antippen ins Feld hinein */
  .blatt input[type="date"],.blatt input[type="time"]{border:1px solid var(--linie);
    background:var(--nacht);color:var(--papier);border-radius:8px;padding:9px 10px;
    font:600 16px 'Inter';color-scheme:dark}
  .zeit-feld{display:flex;gap:6px;align-items:center;flex:1;justify-content:flex-end;min-width:0}
  .zeit-feld input[type="time"]{width:88px;flex:none;padding-left:6px;padding-right:6px}
  .zeit-feld input[type="date"]{flex:none;min-width:0;padding-left:6px;padding-right:6px}
  @media (max-width:380px){
    .zeit-feld input[type="time"]{width:78px;font-size:15px}
    .zeit-feld input[type="date"]{font-size:15px}
  }

  /* Listenansicht */
  .liste-zeile{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:none;border:0;border-bottom:1px solid var(--linie);padding:11px 2px;cursor:pointer;color:var(--papier)}
  .liste-zeile:last-child{border-bottom:0}
  .liste-zeile .lz-sym{width:30px;height:30px;flex:none;border-radius:9px;border:2px solid #14161A;
    display:flex;align-items:center;justify-content:center;font-size:14px}
  .liste-zeile .lz-sym svg{width:15px;height:15px;color:#141414;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .liste-zeile .lz-sym.event{background:var(--event);border-radius:50%}
  .liste-zeile .lz-sym.angebot{background:var(--angebot)}
  .liste-zeile .lz-sym.hilfe{background:var(--hilfe);border-radius:8px}
  .liste-zeile .lz-sym.spot{background:var(--spot);border-radius:50%}
  .liste-zeile .lz-sym.hot{box-shadow:0 0 0 2px #FF8A1F, 0 0 8px 2px rgba(255,138,31,.7)}
  .liste-zeile .lz-mitte{flex:1;min-width:0;overflow:hidden}
  .liste-zeile .lz-titel{display:block;font-weight:700;font-size:13px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .liste-zeile .lz-meta{display:block;font-size:11px;color:var(--grau);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .liste-zeile .lz-datum{flex:none;max-width:33%;font-size:11px;color:var(--hilfe);
    font-weight:700;text-align:right;white-space:nowrap}
  .liste-tabs{display:flex;gap:8px;margin:10px 0 4px}
  .liste-tabs button{flex:1;border:1px solid var(--linie);background:transparent;color:var(--grau);
    border-radius:10px;padding:9px 6px;font:700 12px 'Inter';cursor:pointer}
  .liste-tabs button.an{background:var(--papier);color:#141414;border-color:var(--papier)}
  /* Aktive Filter im Kopf der Liste — macht sichtbar, warum die Auswahl so aussieht */
  .filter-zeile{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--nacht);border:1px solid var(--linie);border-radius:10px;
    padding:8px 10px;margin:8px 0 2px}
  .filter-zeile .fz-liste{flex:1;min-width:0;font-size:11.5px;color:var(--grau);line-height:1.6}
  .filter-zeile .fz-liste b{color:var(--papier);font-weight:600;background:rgba(245,242,233,.09);
    border-radius:6px;padding:2px 7px;margin-right:3px;display:inline-block;white-space:nowrap}
  .filter-zeile .fz-weg{flex:none;background:none;border:0;color:var(--angebot);
    font:700 11.5px 'Inter';cursor:pointer;padding:4px 2px;min-height:32px}
  /* Abschnittsköpfe bleiben beim Scrollen oben kleben und sind farblich abgesetzt: In einer
     langen Liste soll jederzeit ablesbar sein, welcher Block gerade unter dem Daumen ist. */
  .saison-kopf{position:sticky;top:-2px;z-index:2;
    font-family:'Anton';font-size:12px;letter-spacing:1px;text-transform:uppercase;
    color:var(--hilfe);margin:16px -18px 2px;padding:7px 18px 6px;
    background:var(--panel);border-top:1px solid var(--linie);
    display:flex;align-items:center;gap:8px}
  .saison-kopf:first-of-type{margin-top:8px;border-top:0}
  .saison-kopf.spaeter{color:var(--grau)}
  .saison-kopf .anzahl{margin-left:auto;font-family:'Inter';font-size:11px;font-weight:700;
    letter-spacing:0;text-transform:none;color:var(--grau)}

  /* Filterzeile in der Liste: bedienbar, nicht nur informativ */
  .fz-zeit{display:flex;gap:5px;width:100%}
  .fz-z{flex:1;border:1px solid var(--linie);background:transparent;color:var(--grau);
    border-radius:9px;padding:8px 4px;font:700 11.5px 'Inter';cursor:pointer;min-height:38px}
  .fz-z.an{background:var(--papier);color:#141414;border-color:var(--papier)}
  .fz-tags{display:flex;flex-wrap:wrap;gap:5px;width:100%}
  .fz-tag{border:1px solid var(--linie);background:var(--panel);color:var(--papier);
    border-radius:8px;padding:6px 9px;font:600 11.5px 'Inter';cursor:pointer;min-height:34px}
  .fz-tag:hover{border-color:var(--hilfe);color:var(--hilfe)}

  /* ---------- Detail-Sheet (Mobil) ----------
     Auf dem Handy ist ein Popup mitten auf der Karte schlecht: klein, verdeckt den Pin und
     zwingt zum Zielen. Stattdessen fährt die Info von unten ein (wie in Karten- und
     Immobilien-Apps) — Karte bleibt oben sichtbar, Daumen erreicht alles. */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--panel);border-top:1px solid var(--linie);
    border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.55);
    transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
    max-height:66vh;display:flex;flex-direction:column;touch-action:none}
  .sheet.offen{transform:translateY(0)}
  .sheet-griff{width:100%;height:26px;border:0;background:transparent;cursor:grab;
    display:flex;align-items:center;justify-content:center;flex:none;padding:0}
  .sheet-griff::before{content:"";width:38px;height:4px;border-radius:2px;background:var(--linie)}
  .sheet-griff:active{cursor:grabbing}
  .sheet-inhalt{overflow-y:auto;overscroll-behavior:contain;
    padding:2px 16px calc(16px + env(safe-area-inset-bottom));font-family:'Inter'}
  .sheet .p-titel{font-size:17px;margin:6px 0 7px}
  .sheet .p-text{font-size:14px}
  .sheet .p-akt{gap:8px;margin-top:12px}
  .sheet .p-btn{padding:11px 14px;font-size:13px}
  .sheet .p-nav{margin:0 0 8px}
  .sheet .p-nav button{width:42px;height:34px;font-size:17px}
  .sheet-zurueck{display:flex;align-items:center;gap:6px;background:none;border:0;
    color:var(--hilfe);font:700 13px 'Inter';cursor:pointer;padding:6px 2px 8px}

  /* Querformat: Es bleibt kaum Höhe übrig — Sheet und Modale flacher, Filter zu.
     Ohne das verdeckt ein 66vh-Sheet fast die ganze Karte. */
  @media (max-height:520px){
    .sheet{max-height:82vh}
    .blatt{max-height:88vh}
    header{padding-top:6px;padding-bottom:4px}
    .hud{padding-top:4px}
    .hud-aktionen{margin-top:5px}
    .melden,.liste-btn{padding-top:10px;padding-bottom:10px}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
  @media (min-width:700px){
    .schleier{align-items:center} .blatt{border-radius:18px}
    .sheet{display:none}                 /* Desktop behält das Karten-Popup */
    /* Am Desktop ist Platz genug — Filter immer sichtbar, Klapp-Knopf überflüssig */
    .hud-klapp{display:none}
    .hud.zu .hud-filter{max-height:340px;opacity:1;pointer-events:auto}
  }
</style>
</head>
<body>

<div id="map" role="application" aria-label="Eventlas Karte"></div>

<header>
  <div class="titel">
    <h1 id="app-titel">Event<span>las</span></h1>
    <div class="sub" id="app-sub">Aachen — Events · Angebote · Hilfe · Fotospots</div>
  </div>
  <div class="kopf-knoepfe">
    <button class="kbtn foto" id="btn-foto" aria-label="Plakat fotografieren" title="Plakat fotografieren — Ort wird automatisch erkannt">

const TAG_LABEL = {musik:"🎵 Musik & Party", kultur:"🎭 Kultur", fest:"🎉 Feste",

/* Blip-Symbol: Thema schlägt Kategorie (mundraub soll nicht als generisches "Angebot"
   erscheinen — dieselben Symbole wie in der Filterleiste auch auf der Karte).

const TAG_EMOJI = {musik:"🎵", kultur:"🎭", fest:"🎉", markt:"🛍",
  sport:"⚽", familie:"🧒", natur:"🍏", neu:"✨"};
// "neu" steht vorn: Eine Neueröffnung ist genau das Bemerkenswerte an dem Pin — als
// generisches Laden-Symbol wäre sie von hundert anderen nicht zu unterscheiden.
const BLIP_PRIO = ["neu","natur","markt","musik","sport","kultur","fest","familie"];
function blipSymbol(p){ const t = BLIP_PRIO.find(t => p.tags.includes(t)); return t ? TAG_EMOJI[t] : null; }
const ONBOARDING_TAGS = ["musik","kultur","fest","markt","sport","familie","natur","neu"];

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urlOk = u => typeof u === "string" && /^https?:\/\//i.test(u);
function lsGet(k, fallback){ try{ const v = localStorage.getItem("eventlas."+k); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function lsSet(k, v){ try{ localStorage.setItem("eventlas."+k, JSON.stringify(v)); }catch(e){} }
function hashId(p){ let h = 5381; const s = p.titel + p.lng + p.lat; for(let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0; return "p"+(h>>>0).toString(36); }
function normalisiere(p){
  if(p.typ === "aufgabe") p.typ = "hilfe";                 // altes Schema
  if(!TYPNAME[p.typ]) p.typ = "event";
  // Nur bekannte Themen behalten — Altbestand und Auto-Update liefern teils veraltete Tags
  p.tags = (Array.isArray(p.tags) ? p.tags : []).filter(t => TAG_LABEL[t]);
  p.id = p.id || hashId(p);
  p.beispiel = /^\[Beispiel\]/.test(p.titel);
  return p;
}

/* Beispiel-Pins sind nur Platzhalter, damit die Karte zum Start nicht leer wirkt.
   Sobald in einer Kategorie genug echte Pins existieren, blenden sie sich selbst aus. */
function beispielePruefen(liste){
  const echte = {};
  liste.forEach(p => { if(!p.beispiel) echte[p.typ] = (echte[p.typ] || 0) + 1; });
  liste.forEach(p => { if(p.beispiel) p.verstecken = (echte[p.typ] || 0) >= 2; });
  return liste;
}

/* ---------- Zeitlogik (Roadmap Nr. 13: rollierende Fenster statt Jahresfilter) ----------
   Abgelaufene Pins werden NIE angezeigt (Datenpflege: das Update-Skript räumt Einträge,
   die länger als 3 Monate vorbei sind, aus pins.json). "Alle" = alles Kommende, auch
   über den Jahreswechsel hinaus — dadurch braucht es keinen fehleranfälligen Jahresfilter. */
const HEUTE0 = new Date(); HEUTE0.setHours(0,0,0,0);
const TAGE = ["so","mo","di","mi","do","fr","sa"];
const TAGN = {mo:"Mo",di:"Di",mi:"Mi",do:"Do",fr:"Fr",sa:"Sa",so:"So"};

function fenster(p){ // effektives Zeitfenster {s,e} oder null (= undatiert/immer)
  if(p.saison && p.saison.von && p.saison.bis){
    const j = HEUTE0.getFullYear();
    let s = new Date(j+"-"+p.saison.von+"T00:00:00");
    let e = new Date(j+"-"+p.saison.bis+"T23:59:59");
    if(e < s){ // Saison über Jahreswechsel (z. B. 11-01 bis 02-28)
      const eLaufend = new Date(j+"-"+p.saison.bis+"T23:59:59");
      if(HEUTE0 <= eLaufend) return {s:new Date((j-1)+"-"+p.saison.von+"T00:00:00"), e:eLaufend}; // im Vorjahr gestartet, läuft noch
      return {s, e:new Date((j+1)+"-"+p.saison.bis+"T23:59:59")};                                 // nächste Instanz
    }
    if(e < HEUTE0){ s.setFullYear(j+1); e.setFullYear(j+1); }  // dieses Jahr vorbei → nächstes Jahr
    return {s, e};
  }
  if(p.start){
    return {s:new Date(p.start+"T00:00:00"), e:new Date((p.ende || p.start)+"T23:59:59")};
  }
  return null;
}
function wdhAnTag(wdh, d){ return wdh.split(",").map(t=>t.trim()).includes(TAGE[d.getDay()]); }
function wdhImFenster(wdh, von, bis){
  const d = new Date(von);
  for(let i=0; i<8 && d<=bis; i++){ if(wdhAnTag(wdh, d)) return true; d.setDate(d.getDate()+1); }
  return false;
}
/* Uhrzeiten aus einem Text lesen: "Musikbunker · 20 Uhr", "Markt · 20:30 · frei",
   "Sa 7–13 Uhr". Liefert {start, ende} in Minuten seit Mitternacht — ende nur, wenn wirklich
   eine Spanne dasteht. Null, wenn gar keine Zeit gefunden wurde.

   Zeitspannen werden ZUERST geprüft: Bei "Sa 7–13 Uhr" steht das Wort "Uhr" hinter der
   Endzeit, eine Einzelzeit-Suche greift deshalb die 13 und macht aus dem Vormittagsmarkt
   eine Nachmittagsveranstaltung.

   Zwei Sonderfälle beim Ende: "bis 24 Uhr" und Spannen über Mitternacht ("22–3 Uhr") laufen
   bis Tagesende — sonst läge das Ende vor dem Beginn und der Termin wäre nie aktuell. */
function zeitAusText(text){
  const spanne = text.match(/(?:^|[^\d.])(\d{1,2})(?:[:.](\d{2}))?\s*[–—-]\s*(\d{1,2})(?:[:.](\d{2}))?\s*Uhr/);
  if(spanne){
    const start = (+spanne[1]) * 60 + (spanne[2] ? +spanne[2] : 0);
    if(start > 1439) return null;
    let ende = (+spanne[3]) * 60 + (spanne[4] ? +spanne[4] : 0);
    if(ende > 1440) ende = null;
    else if(ende === 1440 || ende <= start) ende = 1439;
    return {start, ende};
  }
  const einzeln = text.match(/(?:^|[^\d.])(\d{1,2})[:.](\d{2})\s*(?:Uhr)?/) ||
                  text.match(/(?:^|[^\d.])(\d{1,2})\s*Uhr/);
  if(!einzeln) return null;
  const start = (+einzeln[1]) * 60 + (einzeln[2] ? +einzeln[2] : 0);
  return start > 1439 ? null : {start, ende: null};
}
function startMinute(p){
  if(p._min !== undefined) return p._min;
  const z = zeitAusText((p.meta || "") + " " + (p.text || ""));
  p._min = z ? z.start : null;
  return p._min;
}
/* Für die Frage "läuft das jetzt noch?" zählt allein die Meta-Zeile — die gepflegte
   Kurzangabe ("Katschhof · 11–18 Uhr"). Im Fließtext stehen oft Zeiten, die nur für einen
   einzelnen Tag gelten ("Mo 10.8. reizarme Kirmes 14–17 Uhr"); daraus eine tägliche Endzeit
   abzuleiten hat die zehntägige Kirmes jeden Nachmittag um 17 Uhr verschwinden lassen. */
function metaZeit(p){
  if(p._metaZeit === undefined) p._metaZeit = zeitAusText(p.meta || "");
  return p._metaZeit;
}
/* Uhrzeit-Fenster prüfen — nur wenn im Filter überhaupt eine Zeit gesetzt wurde.
   Pins ohne Zeitangabe (Märkte, Ausstellungen, Ernteorte) bleiben bewusst sichtbar. */
function uhrzeitOk(p, f){
  if(!f || !f.mitZeit) return true;
  const min = startMinute(p);
  if(min === null) return true;
  const vonMin = f.von.getHours()*60 + f.von.getMinutes();
  const bisMin = f.bis.getHours()*60 + f.bis.getMinutes();
  return vonMin <= bisMin ? (min >= vonMin && min <= bisMin) : (min >= vonMin || min <= bisMin);
}

/* Ist der heutige Termin schon vorbei? „Heute" rechnet ab JETZT, nicht ab Mitternacht —
   ein Konzert von 20 Uhr gehört mittags in die Liste, um 23 Uhr nicht mehr. Das ersetzt den
   früheren Abendfilter: Wer um 19 Uhr schaut, sieht dadurch von selbst nur noch Abendliches.

   Drei bewusste Ausnahmen, damit nichts fälschlich verschwindet:
   - Steht eine Endzeit dabei („Flohmarkt 11–18 Uhr"), zählt die. Nur den Beginn zu prüfen
     hat den Flohmarkt um 12 Uhr aus der Liste geworfen, obwohl er noch sechs Stunden lief.
   - Pins OHNE gepflegte Uhrzeit (Wochenmarkt „vormittags", Ausstellungen) bleiben stehen.
     Sie auszublenden wäre geraten, nicht gewusst — sie rutschen stattdessen ans Listenende.
   - Ist nur der Beginn bekannt, eine Kulanzstunde: Wer um 20:15 sucht, findet das Konzert
     von 20 Uhr noch. */
const KULANZ_MIN = 60;
function heuteSchonVorbei(p){
  const z = metaZeit(p);
  if(!z) return false;                                // keine gepflegte Zeit → nie ausblenden
  const jetzt = new Date();
  const min = jetzt.getHours() * 60 + jetzt.getMinutes();
  return (z.ende !== null ? z.ende : z.start + KULANZ_MIN) < min;
}

function wdhAktivImFenster(p, von, bis){
  // wdh-Pin mit optionalem start/ende: nur Tage zählen, die auch im Pin-Fenster liegen
  const w = fenster(p);
  const a = (w && w.s > von) ? w.s : von;
  const b = (w && w.e < bis) ? w.e : bis;
  if(a > b) return false;
  return wdhImFenster(p.wdh, a, b);
}
function zeitOk(p){
  const w = fenster(p);
  if(w && w.e < HEUTE0) return false;                      // vorbei → nie zeigen
  const schnitt = suchFenster || (zeit === "range" ? eigenZeitraum : null); // Suche/eigener Zeitraum
  if(schnitt){
    if(!uhrzeitOk(p, schnitt)) return false;
    if(p.wdh) return wdhAktivImFenster(p, schnitt.von, schnitt.bis);
    if(!w) return false;
    return w.s <= schnitt.bis && schnitt.von <= w.e;
  }
  if(zeit === "all") return true;
  const heuteEnde = new Date(HEUTE0); heuteEnde.setHours(23,59,59);
  const limit = new Date(HEUTE0); limit.setDate(limit.getDate()+30);
  if(p.wdh){                                               // wdh + start/ende: erst ab Fensterbeginn zeigen
    if(w && w.s > (zeit === "today" ? heuteEnde : limit)) return false;
    if(zeit === "soon") return true;
    return wdhAnTag(p.wdh, HEUTE0) && !heuteSchonVorbei(p);
  }
  if(!w) return true;                                      // undatierte Orte: immer
  if(zeit === "today") return w.s <= heuteEnde && HEUTE0 <= w.e && !heuteSchonVorbei(p);
  return w.s <= limit;                                     // "Demnächst" = startet in ≤30 Tagen
}
function fmtDatum(p){
  if(p.wdh) return "jeden " + p.wdh.split(",").map(t=>TAGN[t.trim()]||t).join("/");
  if(p.saison){ const mt = s => parseInt(s.slice(3),10)+"."+parseInt(s.slice(0,2),10)+"."; return "Saison " + mt(p.saison.von) + "–" + mt(p.saison.bis); }
  if(!p.start) return "";
  const f = d => { const x = new Date(d+"T00:00:00"); return TAGN[TAGE[x.getDay()]] + " " + x.getDate() + "." + (x.getMonth()+1) + "."; };
  return p.ende && p.ende !== p.start ? f(p.start) + " – " + f(p.ende) : f(p.start);
}

/* ---------- Sonnenzeiten für Fotospots (Roadmap Nr. 6) — NOAA-Näherung, ±3 Min ---------- */
function sonnenzeiten(lat, lng, datum){
  const rad = Math.PI/180;
  const anfang = new Date(datum.getFullYear(), 0, 0);
  const tag = Math.floor((datum - anfang) / 864e5);
  const B = rad * (360/365) * (tag - 81);
  const eot = 9.87*Math.sin(2*B) - 7.53*Math.cos(B) - 1.5*Math.sin(B);
  const dekl = 23.45 * Math.sin(rad * (360/365) * (tag - 81));
  const cosH = (Math.cos(90.833*rad) - Math.sin(lat*rad)*Math.sin(dekl*rad)) / (Math.cos(lat*rad)*Math.cos(dekl*rad));
  if(cosH < -1 || cosH > 1) return null;
  const H = Math.acos(cosH) / rad;
  const mittagUTC = 720 - 4*lng - eot;
  const mk = min => { const d = new Date(Date.UTC(datum.getFullYear(), datum.getMonth(), datum.getDate())); d.setUTCMinutes(Math.round(min)); return d; };
  return { aufgang: mk(mittagUTC - 4*H), untergang: mk(mittagUTC + 4*H) };
}
function goldeneStundeText(p){
  const sz = sonnenzeiten(p.lat, p.lng, new Date());
  if(!sz) return "";
  const f = d => d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  const gsStart = new Date(sz.untergang.getTime() - 60*60*1000);
  return "☀️ Goldene Stunde heute: " + f(gsStart) + "–" + f(sz.untergang) + " · Sonnenaufgang " + f(sz.aufgang);
}

/* ---------- Zustand ---------- */
let PINS = beispielePruefen(FALLBACK_PINS.map(normalisiere));

let aktiveTags = new Set();
let fuerDich = false;

let suchTerme = [], suchFenster = null;

/* ---------- Suche (Roadmap Nr. 17) inkl. Zeit-Schlagwörter ---------- */
function fensterTage(abTagen, bisTagen){
  const von = new Date(HEUTE0); von.setDate(von.getDate()+abTagen);
  const bis = new Date(HEUTE0); bis.setDate(bis.getDate()+bisTagen); bis.setHours(23,59,59);
  return {von, bis};
}
function naechstesWochenende(){
  const tag = HEUTE0.getDay();                 // 0=So … 6=Sa
  if(tag === 0) return fensterTage(0, 0);      // Sonntag: das laufende Wochenende
  const bisSa = 6 - tag;
  return fensterTage(bisSa, bisSa + 1);
}
const FUELLWOERTER = new Set(["am","an","in","im","und","der","die","das","den","dem","ein","eine",
  "nächstes","naechstes","dieses","diese","was","läuft","laeuft","gibt","es","aachen","für","fuer",
  "mit","zum","zur","bei","von","ist","sind","wo","wann"]);

/* Suchwörter kontextgerecht erweitern: Wer "Konzert" tippt, meint auch Livemusik, Band,
   Gig oder den Musikbunker. Jede Gruppe wird beim Tippen auf ihre Varianten aufgefächert;
   ein Pin gilt als Treffer, wenn EINE der Varianten passt. */
const SYNONYME = [
  ["konzert","konzerte","livemusik","live-musik","live","band","bands","gig","auftritt","musik",
   "musikalisch","musikbunker","open-air","openair","festival","dj","party","tanz","tanzen","club",
   "clubnacht","disco","rave","eurogress","klangbruecke","franz","suedoase","sudoase","apollo",
   "domkeller","jazz","rock","pop","techno","house","schlager","chor","orgel","sinfonie","oper"],
  ["floh","flohmarkt","troedel","trödel","troedelmarkt","antik","kunstmarkt","secondhand",
   "gebraucht","kram","basar","markt","maerkte","märkte","wochenmarkt","stand","staende","stände",
   "essen","food","kulinarisch","imbiss","kaffee","brunch","street-food","streetfood"],
  ["kind","kinder","kindern","familie","familien","familienfreundlich","spielplatz","kita",
   "kinderfest","jugend","eltern"],
  ["sport","sportlich","fussball","fußball","alemannia","tivoli","reiten","reit","turnier",
   "lauf","laufen","marathon","schwimmen","yoga","fitness","bewegung","training","radfahren","rad"],
  ["kultur","kulturell","museum","museen","theater","ausstellung","ausstellungen","kunst","lesung",
   "literatur","vortrag","fuehrung","führung","kino","film","comedy","kabarett","oper","tanztheater",
   "galerie","atelier","vernissage"],
  ["ernte","ernten","pfluecken","pflücken","obst","beeren","brombeeren","heidelbeeren","apfel",
   "äpfel","aepfel","kirschen","nuesse","nüsse","walnuss","mundraub","sammeln","wild","essbar",
   "natur","saison","saisonal"],
  ["foto","fotos","fotografie","fotospot","fotospots","spot","spots","aussicht","panorama",
   "sonnenuntergang","sonnenaufgang","instagram","insta","bild","bilder"],
  ["hilfe","helfen","gesuch","gesuche","suche","nachbarschaft","nachbarschaftshilfe","unterstuetzung",
   "unterstützung","ehrenamt","einkauf","kurier"],
  // "kostenlos" ist kein Tag mehr — diese Gruppe sucht deshalb im Volltext (Text/Meta-Zeile)
  ["gratis","kostenlos","umsonst","frei","eintrittsfrei","geschenkt","verschenken","zu-verschenken","abzugeben"],
  ["fest","feste","strassenfest","straßenfest","stadtfest","kirmes","jahrmarkt","karneval","feiern"],
];
// Wort → Gruppe (einmalig aufgebaut, damit die Suche pro Tastendruck schnell bleibt)
const SYN_INDEX = new Map();
SYNONYME.forEach(gruppe => gruppe.forEach(w => {
  if(!SYN_INDEX.has(w)) SYN_INDEX.set(w, new Set());
  gruppe.forEach(v => SYN_INDEX.get(w).add(v));
}));

/* Umlaute und ß vereinheitlichen, damit "Trödel" auch "troedel" findet (und umgekehrt) */
function normText(s){
  return String(s).toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .replace(/[^a-z0-9]+/g," ");
}
/* Sehr einfaches Stammformen-Kürzen für deutsche Endungen — reicht für Suchbegriffe.
   Kurze Wörter bleiben unangetastet, damit "spot" nicht zu "sp" wird. */
function stamm(w){
  if(w.length <= 4) return w;
  return w.replace(/(innen|ungen|enden|erin|ung|est|end|ern|em|er|en|es|et|te|st|s|e|n)$/,"");
}

function parseSuche(q){
  suchTerme = []; suchFenster = null;
  normText(q).split(/\s+/).filter(Boolean).forEach(tok => {
    if(tok === "heute") { suchFenster = fensterTage(0,0); return; }
    if(tok === "morgen"){ suchFenster = fensterTage(1,1); return; }
    if(tok.startsWith("wochenend")){ suchFenster = naechstesWochenende(); return; }
    if(FUELLWOERTER.has(tok)) return;
    // Varianten: das Wort selbst, sein Stamm und alle Synonyme (als Stämme)
    const varianten = new Set([tok, stamm(tok)]);
    (SYN_INDEX.get(tok) || SYN_INDEX.get(stamm(tok)) || []).forEach(v => varianten.add(stamm(normText(v).trim())));
    suchTerme.push([...varianten].filter(Boolean));
  });
}

/* Durchsuchbarer Text eines Pins — einmal berechnet und am Pin gespeichert (Cache),
   damit die Suche auch bei vielen Pins pro Tastendruck flüssig bleibt. */
function suchText(p){
  if(p._such) return p._such;
  const teile = [p.titel, p.text, p.meta, p.tags.join(" "), TYPNAME[p.typ], TYPPLURAL[p.typ]];
  if(p.quelle){ try{ teile.push(new URL(p.quelle).hostname.replace(/^www\./,"").split(".")[0]); }catch(e){} }
  if(p.wdh) teile.push(p.wdh.split(",").map(t => TAGN[t.trim()] || t).join(" ") + " woechentlich jeden");
  if(p.saison) teile.push("saison saisonal");
  if(p.hot) teile.push("beliebt angesagt highlight");
  const worte = normText(teile.filter(Boolean).join(" ")).split(/\s+/).filter(Boolean);
  // Volltext + Stammformen, damit "Konzerte" auch "Konzert" trifft
  p._such = " " + worte.join(" ") + " | " + worte.map(stamm).join(" ") + " ";
  return p._such;
}
function textOk(p){
  if(!suchTerme.length) return true;
  const heu = suchText(p);
  // Jede Eingabe-Gruppe muss irgendwie vorkommen (UND zwischen Wörtern, ODER innerhalb der Synonyme)
  return suchTerme.every(varianten => varianten.some(v => v && heu.includes(v)));
}
function tagOk(p){
  if(merkModus && !merk[p.id]) return false;
  if(nurHighlights && !p.hot) return false;
  if(!aktiveTags.size) return true;
  return p.tags.some(t => aktiveTags.has(t));
}
function sichtbar(p){ return !p.verstecken && zeitOk(p) && textOk(p) && tagOk(p); }
function imAusschnitt(p){
  try{ return map.getBounds().contains([p.lng, p.lat]); }catch(e){ return true; }
}
function istNeu(p){ return letzterBesuch && p.hinzu && p.hinzu > letzterBesuch; }
function passtZuMir(p){
  const meine = profilTags();
  return meine.length && p.tags.some(t => meine.includes(t));
}

/* ---------- Popup (Roadmap Nr. 10, 20, 23) ---------- */
/* Grundlage fürs Durchblättern (wie eine Trefferliste in Immobilienportalen): die Pins des
   aktuellen Ausschnitts, nach Relevanz sortiert. Der Kontext wird beim Öffnen des ersten
   Popups EINGEFROREN — sonst würde sich "3 von 17" bei jeder Kartenbewegung ändern und man
   verlöre beim Blättern die Reihenfolge. Zurückgesetzt beim Schließen und bei Filterwechsel. */
let blaetterKontext = null;
function blaetterListe(p){
  if(!blaetterKontext){
    blaetterKontext = PINS.filter(x => sichtbar(x) && imAusschnitt(x))
      .sort((a,b) => relevanz(b) - relevanz(a));
    // Am Rand geöffnet? Dann gehört der Pin trotzdem dazu.
    if(p && !blaetterKontext.some(x => x.id === p.id)) blaetterKontext.unshift(p);
  }
  return blaetterKontext;
}
function blaetterKontextLoeschen(){ blaetterKontext = null; }
function zeigePinNr(i){
  const liste = blaetterListe();
  const p = liste[i];
  if(!p) return;
  if(istMobil()){ sheetOeffnen(p); return; }      // im Sheet bleiben statt Popup zu wechseln
  const mk = marker.find(x => x.p.id === p.id);
  if(!mk) return;
  const merkeKontext = blaetterKontext;                  // Kontext übers Schließen hinweg halten
  marker.forEach(x => { if(x.m.getPopup() && x.m.getPopup().isOpen()) x.m.togglePopup(); });
  blaetterKontext = merkeKontext;
  mk.el.style.display = "flex";
  lernen(p);
  if(!map.getBounds().contains([p._lng ?? p.lng, p._lat ?? p.lat]))
    map.easeTo({center:[p._lng ?? p.lng, p._lat ?? p.lat], duration:400});
  mk.m.togglePopup();
}
/* ---------- Wetter ----------
   Bei allem unter freiem Himmel ist das Wetter die eigentliche Entscheidungsfrage: Lohnt
   sich der Weg zum Sonnenuntergang, muss ich beim Straßenfest eine Jacke mitnehmen?
   Die Daten kommen von Open-Meteo — kostenlos, ohne Anmeldung, ohne Schlüssel, Server in
   der EU und keine Cookies. Ein Abruf pro Stunde für die ganze Stadt reicht: Aachen ist
   klein genug, dass die Vorhersage für alle Pins dieselbe ist. */
let wetter = null;
/* Datum als JJJJ-MM-TT in LOKALER Zeit. Nicht toISOString() verwenden: Das rechnet nach UTC
   um und liefert in unserer Zeitzone für Mitternacht den Vortag — dadurch stand beim
   Samstagskonzert die Freitagsvorhersage. */
function tagKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" +
         String(d.getDate()).padStart(2,"0");
}
const WMO = {                     // die amtlichen Wettercodes in Kurzform
  0:["☀️","klar"], 1:["🌤","meist klar"], 2:["⛅","wechselnd"], 3:["☁️","bedeckt"],
  45:["🌫","Nebel"], 48:["🌫","Nebel"],
  51:["🌦","Nieseln"], 53:["🌦","Nieseln"], 55:["🌦","Nieseln"],
  61:["🌧","leichter Regen"], 63:["🌧","Regen"], 65:["🌧","starker Regen"],
  66:["🌧","gefrierender Regen"], 67:["🌧","gefrierender Regen"],
  71:["🌨","leichter Schnee"], 73:["🌨","Schnee"], 75:["🌨","starker Schnee"],
  80:["🌦","Schauer"], 81:["🌦","Schauer"], 82:["⛈","kräftige Schauer"],
  95:["⛈","Gewitter"], 96:["⛈","Gewitter"], 99:["⛈","Gewitter"],
};
async function wetterLaden(){
  const gemerkt = lsGet("wetter", null);
  if(gemerkt && Date.now() - gemerkt.zeit < 3600000){ wetter = gemerkt.daten; return; }
  try{
    const [lng, lat] = STADT.zentrum;
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat.toFixed(3) +
      "&longitude=" + lng.toFixed(3) +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=Europe%2FBerlin&forecast_days=7";
    const res = await fetch(url);
    if(!res.ok) return;
    const d = await res.json();
    wetter = {};
    (d.daily.time || []).forEach((tag, i) => {
      wetter[tag] = {
        code: d.daily.weather_code[i],
        max: Math.round(d.daily.temperature_2m_max[i]),
        min: Math.round(d.daily.temperature_2m_min[i]),
        regen: d.daily.precipitation_probability_max[i],
      };
    });
    lsSet("wetter", {zeit: Date.now(), daten: wetter});
  }catch(e){ /* ohne Wetter läuft alles normal weiter */ }
}
/* Findet ein Pin unter freiem Himmel statt? Erst dann ist die Vorhersage relevant.
   Bewusst eine Positivliste bekannter Freiluft-Orte statt Stichwortraten: Ein Versuch über
   Textmuster hielt den "Trödelmarkt Eissporthalle" für eine Hallenveranstaltung (er findet
   auf dem Parkplatz statt) und beurteilte zwei Heimspiele im selben Stadion verschieden.
   Lieber kein Wetter anzeigen als ein falsches. */
const FREILUFT = /(marktplatz|katschhof|elisengarten|elisenbrunnen|kurpark|musikmuschel|park.?terrassen|chio|soers|tivoli|bendplatz|oppenhoffallee|burghof|burg frankenberg|gut wolf|breslauer|eissporthalle|stadtgarten|open.?air|freibad|vennbahn|lousberg|\bmarkt\b|\bhof\b)/i;
function draussen(p){
  if(p.typ === "spot" || p.saison) return true;            // Aussichtspunkte und Ernte immer
  const t = p.tags || [];
  // Unsere eigenen Kategorien sind verlässlicher als Wortsuche: Märkte, Feste und
  // Naturangebote finden praktisch immer unter freiem Himmel statt.
  if(t.includes("natur") || t.includes("markt") || t.includes("fest")) return true;
  return FREILUFT.test((p.meta || "") + " " + (p.titel || ""));
}
function wetterZeile(p){
  if(!wetter || !draussen(p)) return "";
  const w = fenster(p);
  let tag;
  if(p.wdh && !w){                                   // wiederkehrend: der nächste passende Tag
    const d = new Date(HEUTE0);
    for(let i = 0; i < 7; i++){
      if(wdhAnTag(p.wdh, d)){ tag = tagKey(d); break; }
      d.setDate(d.getDate() + 1);
    }
  } else if(w){
    const start = w.s < HEUTE0 ? HEUTE0 : w.s;       // laufendes Event: ab heute
    tag = tagKey(start);
  } else {
    tag = tagKey(HEUTE0);                            // Dauerangebote: heute
  }
  const v = tag && wetter[tag];
  if(!v) return "";                                  // weiter als 7 Tage voraus: nichts sagen
  const [icon, wort] = WMO[v.code] || ["🌡",""];
  const wann = tag === tagKey(HEUTE0) ? "heute"
    : new Date(tag+"T00:00:00").toLocaleDateString("de-DE", {weekday:"short"});
  const regen = v.regen >= 40 ? " · " + v.regen + "% Regen" : "";
  // Bei Extremen ein praktischer Hinweis statt nur Zahlen
  const rat = v.max >= 30 ? " — Wasser und Schatten einplanen"
            : v.regen >= 70 ? " — Regenjacke"
            : v.max <= 5 ? " — warm anziehen" : "";
  return '<div class="p-wetter">'+icon+' '+esc(wann)+': '+esc(wort)+', '+v.max+'°'+
    (v.min !== v.max ? '/'+v.min+'°' : '')+esc(regen)+esc(rat)+'</div>';
}

/* ---------- Ortswissen (orte.json) ----------
   Was ein Ort ist — Anfahrt, Zugänglichkeit, Geschichte — steht längst in OpenStreetMap und
   in der Wikipedia. Statt es abzuschreiben oder bei jedem Aufruf nachzuladen, ist es einmal
   recherchiert und liegt bei uns: keine Verbindung zu fremden Servern beim Betrachten, kein
   Einwilligungsbanner, und offline funktioniert es auch.
   Die Zuordnung läuft über Koordinaten, nicht über Pin-IDs — dadurch erbt jede neue
   Veranstaltung am selben Ort die Infos automatisch, ohne dass jemand etwas nachtragen muss. */
let ORTE = [];
const ortCache = new Map();
function ortZu(p){
  const key = p.lat + "," + p.lng;
  if(ortCache.has(key)) return ortCache.get(key);
  let treffer = null, best = 150;                     // weiter weg gilt nicht mehr als derselbe Ort
  for(const o of ORTE){
    const d = luftlinie(p.lat, p.lng, o.lat, o.lng);
    if(d < best){ best = d; treffer = o; }
  }
  ortCache.set(key, treffer);
  return treffer;
}
function luftlinie(lat1, lng1, lat2, lng2){
  const R = 6371000, rad = Math.PI/180;
  const dLat = (lat2-lat1)*rad, dLng = (lng2-lng1)*rad;
  const x = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const ROLLI = {yes:"barrierefrei", limited:"teilweise barrierefrei", no:"nicht barrierefrei",
               designated:"barrierefrei"};
// OSM schreibt Öffnungszeiten englisch und technisch ("Tu-Su 10:00-17:00") — lesbar machen.
const OSM_TAGE = {Mo:"Mo", Tu:"Di", We:"Mi", Th:"Do", Fr:"Fr", Sa:"Sa", Su:"So", PH:"Feiertags"};
function zeitenLesbar(s){
  if(!s || s.length > 90) return "";                  // verschachtelte Regeln lieber gar nicht zeigen
  if(/24\/7/.test(s)) return "durchgehend geöffnet";
  return s.replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH)\b/g, m => OSM_TAGE[m])
          .replace(/(\d{2}):00/g, "$1")               // 10:00 → 10
          .replace(/;\s*/g, " · ").replace(/,\s*/g, ", ").replace(/-/g, "–");
}
/* Anfahrt, Zugänglichkeit und ein Satz Hintergrund — die drei Fragen, die man sich vor
   einem Besuch stellt und für die man sonst die App wechseln müsste. */
function ortsZeile(p){
  const o = ortZu(p);
  if(!o) return "";
  const teile = [];
  if(o.halt){
    const min = Math.max(1, Math.round(o.halt.m / 80));        // ~5 km/h Gehtempo
    const l = o.halt.linien || [];
    const linien = l.length ? " · Linie" + (l.length > 1 ? "n " : " ") +
      l.slice(0, 6).join(", ") + (l.length > 6 ? " +" + (l.length - 6) : "") : "";
    teile.push('<div class="o-zeile">🚏 '+esc(o.halt.name)+' · '+min+' Min zu Fuß'+esc(linien)+'</div>');
  }
  if(o.rolli && ROLLI[o.rolli]) teile.push('<div class="o-zeile">♿ '+ROLLI[o.rolli]+'</div>');
  const z = zeitenLesbar(o.zeiten);
  if(z) teile.push('<div class="o-zeile">🕒 '+esc(z)+'</div>');
  if(o.wiki && o.wiki.text){
    // Wikipedia-Texte stehen unter CC BY-SA: Quelle und Link gehören sichtbar dazu.
    teile.push('<div class="o-wiki">'+esc(o.wiki.text)+
      (urlOk(o.wiki.url) ? ' <a href="'+esc(o.wiki.url)+'" target="_blank" rel="noopener">Wikipedia ↗</a>' : "")+
      '</div>');
  }
  return teile.length ? '<div class="p-ort">'+teile.join("")+'</div>' : "";
}

/* ---------- Kommentare ----------
   Eine echte Unterhaltung braucht einen gemeinsamen Speicher. Wir sprechen dafür direkt
   die REST-Schnittstelle von Supabase an — kein eigener Server, keine Bibliothek, keine
   Anmeldung für Schreibende. Was erlaubt ist, entscheiden die Datenbank-Regeln:
   Kommentare lesen und schreiben, mehr nicht.
   Moderation: Beiträge erscheinen sofort (sonst ist es kein Gespräch). Jeder kann melden;
   gemeldete Beiträge verschwinden ab drei Meldungen automatisch aus der Ansicht und
   landen zur Prüfung beim Betreiber. */
const KOMMENTARE_AN = () => !!(KONFIG.supabaseUrl && KONFIG.supabaseKey);
/* Kurzlebiger Zwischenspeicher: Beim Durchblättern soll nicht bei jedem Pin neu geladen
   werden, ein Gespräch darf aber auch nicht veralten. 30 Sekunden sind der Kompromiss —
   danach wird frisch geholt, damit neue oder ausgeblendete Beiträge sofort stimmen. */
const kommentarCache = new Map();          // pinId → {zeit, daten}
const CACHE_DAUER = 30000;
let meineBeitraege = lsGet("meineKommentare", {});   // eigene Beiträge dürfen gelöscht werden

function sbKopf(){
  return { apikey: KONFIG.supabaseKey, Authorization: "Bearer " + KONFIG.supabaseKey,
           "Content-Type": "application/json" };
}
async function kommentareLaden(pinId, frisch){
  if(!KOMMENTARE_AN()) return [];
  const gemerkt = kommentarCache.get(pinId);
  if(!frisch && gemerkt && Date.now() - gemerkt.zeit < CACHE_DAUER) return gemerkt.daten;
  try{
    const url = KONFIG.supabaseUrl + "/rest/v1/kommentare?stadt=eq." + encodeURIComponent(stadtKey) +
      "&pin_id=eq." + encodeURIComponent(pinId) + "&versteckt=is.false&order=erstellt.asc&limit=100";
    const res = await fetch(url, { headers: sbKopf() });
    if(!res.ok) throw new Error(res.status);
    const daten = await res.json();
    kommentarCache.set(pinId, {zeit: Date.now(), daten});
    return daten;
  }catch(e){
    console.warn("Kommentare nicht erreichbar:", e.message);
    return null;                            // null = Fehler, [] = einfach leer
  }
}
async function kommentarSenden(pinId, text, name){
  const eintrag = { stadt: stadtKey, pin_id: pinId, text: text.slice(0, 600),
                    name: (name || "").slice(0, 40) || null };
  const res = await fetch(KONFIG.supabaseUrl + "/rest/v1/kommentare", {
    method: "POST", headers: { ...sbKopf(), Prefer: "return=representation" },
    body: JSON.stringify(eintrag),
  });
  if(!res.ok) throw new Error("Senden fehlgeschlagen (" + res.status + ")");
  const [neu] = await res.json();
  meineBeitraege[neu.id] = true; lsSet("meineKommentare", meineBeitraege);
  kommentarCache.delete(pinId);
  return neu;
}
async function kommentarMelden(id){
  await fetch(KONFIG.supabaseUrl + "/rest/v1/rpc/kommentar_melden", {
    method: "POST", headers: sbKopf(), body: JSON.stringify({ kommentar_id: id }),
  });
}
async function kommentarLoeschen(id){
  await fetch(KONFIG.supabaseUrl + "/rest/v1/rpc/kommentar_loeschen", {
    method: "POST", headers: sbKopf(), body: JSON.stringify({ kommentar_id: id }),
  });
  delete meineBeitraege[id]; lsSet("meineKommentare", meineBeitraege);
}
/* "vor 5 Minuten" liest sich in einem Gespräch besser als ein Zeitstempel */
function vorZeit(iso){
  const min = Math.floor((Date.now() - new Date(iso)) / 60000);
  if(min < 1) return "gerade eben";
  if(min < 60) return "vor " + min + " Min.";
  const std = Math.floor(min / 60);
  if(std < 24) return "vor " + std + " Std.";
  const tage = Math.floor(std / 24);
  if(tage === 1) return "gestern";
  if(tage < 7) return "vor " + tage + " Tagen";
  return new Date(iso).toLocaleDateString("de-DE", {day:"numeric", month:"short"});
}

/* ---------- Nutzerbeiträge: Bild und Tipps ----------
   Beides wird eingereicht (WhatsApp/Mail), vom Betreiber geprüft und dann in pins.json
   eingetragen — bewusst mit Vorabprüfung: Für fremde Fotos und Texte haftet der Betreiber
   (Urheber- und Persönlichkeitsrechte), automatische Veröffentlichung wäre riskant.
   Schema: bild {url, credit}, tipps [{text, von, datum}] */
/* Bild mit Lizenzangabe. Bei freien Lizenzen (CC BY, CC BY-SA) sind Urheber, Lizenzname und
   ein Link zur Quelle Pflicht — deshalb steht die Zeile immer unter dem Bild, nicht versteckt.
   Die Dateien liegen im Projekt (Ordner bilder/), damit beim Betrachten keine Verbindung zu
   einem fremden Server entsteht und die Karte auch offline etwas zu zeigen hat. */
function bildBlock(p){
  const b = p.bild;
  if(!b || !b.url) return "";
  const lokal = !/^https?:\/\//i.test(b.url);
  if(!lokal && !urlOk(b.url)) return "";
  const nachweis = [
    b.credit ? "Foto: " + b.credit : "",
    b.lizenz || "",
  ].filter(Boolean).join(" · ");
  const link = urlOk(b.quelle)
    ? ' <a href="'+esc(b.quelle)+'" target="_blank" rel="noopener">Quelle</a>' : "";
    // Kein loading="lazy": Das Detail-Sheet wird eingefügt, während es noch unterhalb des
    // Bildschirmrands sitzt — der Browser stufte das Bild dann als unsichtbar ein und lud es nie.
  return '<img class="p-bild" src="'+esc(b.url)+'" alt="'+esc(p.titel)+'" decoding="async">'+
    (nachweis ? '<div class="p-bild-credit">'+esc(nachweis)+link+'</div>' : "");
}
/* Gerüst der Kommentarsektion. Die Beiträge werden asynchron nachgeladen und hier
   eingesetzt — so öffnet sich das Detail sofort, ohne aufs Netz zu warten. */
/* ---------- Tickets und Preis ----------
   Wer einen Konzerttermin ansieht, will als Nächstes wissen: Was kostet das, und wo bekomme
   ich eine Karte? Bisher hieß der Knopf neutral "Mehr dazu" und der Preis stand irgendwo im
   Text. Jetzt wird beides zusammengeführt — wenn der Link erkennbar zu einem Ticketverkauf
   führt, sagt der Knopf das, und der Preis steht direkt daran. */
const TICKET_HOSTER = /(eventim|ticketmaster|reservix|adticket|ticket\.io|pretix|bigcartel|rausgegangen|eventbrite|ticketshop|kartenkauf|tixforgigs|ticketino)/i;
const TICKET_PFAD   = /(tickets?|karten|shop|kaufen|buchen|vvk|vorverkauf)/i;
function istTicketLink(url){
  if(!urlOk(url)) return false;
  try {
    const u = new URL(url);
    return TICKET_HOSTER.test(u.hostname) || TICKET_PFAD.test(u.pathname);
  } catch(e){ return false; }
}
/* Preis: bevorzugt das gepflegte Feld, sonst aus Meta und Text gelesen. „frei" und
   „kostenlos" sind dabei genauso eine Preisauskunft wie ein Betrag — oft die wichtigere. */
function preisText(p){
  if(p.preis) return String(p.preis);
  const text = (p.meta || "") + " · " + (p.text || "");
  if(/\b(kostenlos|eintritt frei|freier eintritt|gratis)\b/i.test(text)) return "kostenlos";
  if(/(^|[·,;]\s*)frei(\s|$|[·,;])/i.test(text)) return "kostenlos";
  const ab = text.match(/\bab\s*(\d{1,3}(?:[,.]\d{2})?)\s*(?:€|EUR)/i);
  if(ab) return "ab " + ab[1].replace(".", ",") + " €";
  const spanne = text.match(/(\d{1,3})\s*(?:–|-|bis)\s*(\d{1,3})\s*(?:€|EUR)/i);
  if(spanne) return spanne[1] + "–" + spanne[2] + " €";
  const fest = text.match(/(\d{1,3}(?:[,.]\d{2})?)\s*(?:€|EUR)/i);
  if(fest) return fest[1].replace(".", ",") + " €";
  return "";
}

/* ---------- Stimmt das noch? ----------
   Manche Angaben altern schneller als andere: Ein Konzerttermin ist am Tag danach erledigt,
   ein neu eröffnetes Café kann in drei Monaten wieder zu sein. Für alles, was dauerhaft
   gelten soll, steht deshalb dabei, wann es zuletzt bestätigt wurde — und wer gerade davor
   steht, kann es mit einem Tipp bestätigen oder widersprechen.

   Ohne Server heißt Bestätigen: eine vorbereitete Nachricht an uns. Das ist kein Umweg,
   sondern Absicht — eine Angabe, die ungeprüft durch Klicks kippt, wäre manipulierbar, und
   für falsche Fremdinhalte haftet der Betreiber (§ 10 DDG). Der Klick kostet den Nutzer
   zwei Sekunden, uns eine kurze Prüfung, und die Karte bleibt verlässlich. */
function pruefStand(p){
  if(!p.geprueft) return null;
  const tage = Math.floor((Date.now() - new Date(p.geprueft + "T12:00:00")) / 864e5);
  if(tage < 0) return null;
  return { tage, text: tage === 0 ? "heute" : tage === 1 ? "gestern"
    : tage < 31 ? "vor " + tage + " Tagen"
    : tage < 365 ? "vor " + Math.round(tage / 30) + " Monaten" : "vor über einem Jahr" };
}
/* Nur dort anbieten, wo die Frage überhaupt Sinn ergibt: bei Orten und Dauerangeboten.
   Bei einem Konzert am Samstag ist „gibt es das noch?" keine sinnvolle Frage. */
function braucthBestaetigung(p){
  return p.typ === "spot" || p.typ === "angebot" || (p.tags || []).includes("neu") ||
         (!p.start && !p.wdh) || !!p.saison;
}
function bestaetigungsBlock(p){
  if(!braucthBestaetigung(p)) return "";
  const stand = pruefStand(p);
  const alt = stand && stand.tage > 180;
  const zeile = stand
    ? '<span class="bs-stand'+(alt ? " alt" : "")+'">Zuletzt bestätigt: '+esc(stand.text)+'</span>'
    : '<span class="bs-stand alt">Noch nicht bestätigt</span>';
  return '<div class="p-bestaetigen">'+ zeile +
    '<span class="bs-frage">Bist du gerade dort?</span>'+
    '<span class="bs-knoepfe">'+
      '<button class="bs-btn ja" data-id="'+esc(p.id)+'" data-antwort="ja">✓ Gibt es</button>'+
      '<button class="bs-btn nein" data-id="'+esc(p.id)+'" data-antwort="nein">✗ Gibt es nicht mehr</button>'+
    '</span></div>';
}
/* Eine Rückmeldung ist ein Zweizeiler — dafür lohnt kein Formular. Die Nachricht ist fertig
   formuliert, der Nutzer schickt sie nur ab. */
function bestaetigungSenden(pinId, antwort){
  const p = PINS.find(x => x.id === pinId);
  if(!p) return;
  const ja = antwort === "ja";
  const betreff = (ja ? "Bestätigt: " : "Stimmt nicht mehr: ") + p.titel;
  const text = (ja
      ? "Ich war gerade dort — es gibt " + p.titel + " noch.\n"
      : "Hinweis: " + p.titel + " gibt es dort nicht mehr (oder die Angabe stimmt nicht).\n") +
    "\nPin-Kennung: " + p.id +
    "\nStand laut Karte: " + (p.geprueft || "noch nie bestätigt") +
    "\nOrt: " + p.lat + ", " + p.lng +
    "\n\n(Falls dir noch etwas auffällt, schreib es einfach dazu.)\n";
  location.href = "mailto:" + KONFIG.mail + "?subject=" + encodeURIComponent(betreff) +
    "&body=" + encodeURIComponent(text);
  karma.gemeldet++; lsSet("karma", karma);
  // Lokal merken, damit man nicht zweimal dasselbe meldet
  const gemeldet = lsGet("bestaetigt", {});
  gemeldet[pinId] = { antwort, datum: tagKey(new Date()) };
  lsSet("bestaetigt", gemeldet);
  hinweisZeigen(ja ? "Danke! Deine Bestätigung ist unterwegs."
                   : "Danke für den Hinweis — wir prüfen das.");
  setTimeout(hinweisWeg, 4000);
}

function tippBlock(p){
  const feste = Array.isArray(p.tipps) ? p.tipps.filter(t => t && t.text) : [];
  const festeHtml = feste.map(t =>
    '<div class="komm"><div class="komm-kopf"><b>'+esc(t.von || "Eventlas")+'</b>'+
    '<span class="komm-zeit">'+(t.datum ? esc(fmtKurzDatum(t.datum)) : "")+'</span></div>'+
    '<div class="komm-text">'+esc(t.text)+'</div></div>').join("");
  return '<div class="p-tipps" data-pin="'+esc(p.id)+'">'+
    '<h4>💬 Gespräch</h4>'+
    festeHtml +
    '<div class="komm-liste" data-fuer="'+esc(p.id)+'">'+
