<!doctype html><meta charset="utf-8"><title>syntaxtest</title>
<script>
window.addEventListener('error', function(e){
  document.title = 'ERR ' + e.lineno + ':' + e.colno + ' — ' + e.message;
  var d = document.createElement('pre'); d.id='out';
  d.textContent = 'Zeile ' + e.lineno + ', Spalte ' + e.colno + ' — ' + e.message;
  document.body.appendChild(d);
});
</script>
<script src="/_syntaxtest.js"></script>
